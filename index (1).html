<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Átomo a Átomo</title>
<meta name="description" content="Juego para aprender el átomo, la tabla periódica y los enlaces químicos.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Una columna. Interfaz monocroma (tinta); el color solo aparece cuando significa algo:
   naranja = protón p⁺ · gris pizarra = neutrón n⁰ · azul = electrón e⁻ · dorado = estrellas
   magenta / violeta / cian / ocre = bloques s / p / d / f · verde = correcto ✓ · rojo = error ✗ */
:root{
  --bg:#F2F4F7; --surface:#FFFFFF; --sunk:#E7EBF0; --ink:#151E28; --muted:#5B6774; --line:#D2D9E1;
  --pro:#C4520A; --pro-soft:#FCE8D8;
  --neu:#5F6B7B; --neu-soft:#E2E6EC;
  --ele:#1F56D6; --ele-soft:#DFE7FC;
  --bs:#B8287A; --bs-soft:#F8DDEB;
  --bp:#6B3FCF; --bp-soft:#EAE1FA;
  --bd:#0A7B98; --bd-soft:#D3EDF4;
  --bf:#866600; --bf-soft:#F2E8C4;
  --ok:#1E8A4C; --ok-soft:#DCF3E5; --gold:#C58A00; --gold-soft:#FCEFC7; --bad:#CC3528; --bad-soft:#FCE3E0;
  --cat-alc:#FFD8B5; --cat-alt:#FCEAA6; --cat-tra:#CDD9F6; --cat-otm:#D7DCE3; --cat-mtl:#E1D5F6;
  --cat-nom:#F6D2EC; --cat-hal:#E6D3AE; --cat-gno:#C6ECEF; --cat-lan:#E3E0C4; --cat-act:#EBD2C4;
  --cat-ink:#151E28;
  --heat0:#EEF0F9; --heat1:#25327F;
  --mt-m:#CBD5E8; --mt-x:#E2D3F5; --mt-n:#FFE3A3;
  --rg-r:#D6DEE8; --rg-t:#9FB0C4; --rg-i:#5E7086;
  --bz-a:#DDF0F2; --bz-p:#8FD0DC; --bz-i:#2F95AA;
  --shadow:rgba(10,16,24,.22);
  --f-display:"Bricolage Grotesque",ui-rounded,"Segoe UI",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E141A; --surface:#161E26; --sunk:#1E2831; --ink:#E6ECF1; --muted:#98A5B1; --line:#2C3845;
  --pro:#FF9A57; --pro-soft:#3B230F; --neu:#A6B0BD; --neu-soft:#27313C; --ele:#82A6FF; --ele-soft:#16264A;
  --bs:#F27BBE; --bs-soft:#3D1430; --bp:#B497FF; --bp-soft:#2A1D4A; --bd:#4FC6E3; --bd-soft:#0F3440; --bf:#D9B53D; --bf-soft:#382D07;
  --ok:#4CCB86; --ok-soft:#123323; --gold:#F2C14E; --gold-soft:#3A2C08; --bad:#FF7B6E; --bad-soft:#3E1B17;
  --cat-alc:#5C3519; --cat-alt:#4E4313; --cat-tra:#22355E; --cat-otm:#38414D; --cat-mtl:#3B2C5E;
  --cat-nom:#552347; --cat-hal:#4D3D1C; --cat-gno:#14474C; --cat-lan:#45422A; --cat-act:#4C3026; --cat-ink:#ECF1F5;
  --heat0:#1B2130; --heat1:#9CB0FF; --mt-m:#2C3B57; --mt-x:#41305F; --mt-n:#4D3D10; --rg-r:#2A3542; --rg-t:#4A5D74; --rg-i:#7D93AD; --bz-a:#16363C; --bz-p:#1E6674; --bz-i:#3DB4CB; --shadow:rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E141A; --surface:#161E26; --sunk:#1E2831; --ink:#E6ECF1; --muted:#98A5B1; --line:#2C3845;
  --pro:#FF9A57; --pro-soft:#3B230F; --neu:#A6B0BD; --neu-soft:#27313C; --ele:#82A6FF; --ele-soft:#16264A;
  --bs:#F27BBE; --bs-soft:#3D1430; --bp:#B497FF; --bp-soft:#2A1D4A; --bd:#4FC6E3; --bd-soft:#0F3440; --bf:#D9B53D; --bf-soft:#382D07;
  --ok:#4CCB86; --ok-soft:#123323; --gold:#F2C14E; --gold-soft:#3A2C08; --bad:#FF7B6E; --bad-soft:#3E1B17;
  --cat-alc:#5C3519; --cat-alt:#4E4313; --cat-tra:#22355E; --cat-otm:#38414D; --cat-mtl:#3B2C5E;
  --cat-nom:#552347; --cat-hal:#4D3D1C; --cat-gno:#14474C; --cat-lan:#45422A; --cat-act:#4C3026; --cat-ink:#ECF1F5;
  --heat0:#1B2130; --heat1:#9CB0FF; --mt-m:#2C3B57; --mt-x:#41305F; --mt-n:#4D3D10; --rg-r:#2A3542; --rg-t:#4A5D74; --rg-i:#7D93AD; --bz-a:#16363C; --bz-p:#1E6674; --bz-i:#3DB4CB; --shadow:rgba(0,0,0,.5); color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
body.playing::before{background:var(--bg)}
h1,h2,h3{font-family:var(--f-display);line-height:1.15;text-wrap:balance;margin:0}
sub,sup{font-size:.7em;line-height:0}
button{font:inherit;color:inherit}
:focus-visible{outline:2.5px solid var(--ink);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.ico{width:1.1em;height:1.1em;flex:0 0 auto;vertical-align:-.15em}
.mono{font-family:var(--f-mono)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* significado del color */
.c-p{--c:var(--pro);--cs:var(--pro-soft)} .c-n{--c:var(--neu);--cs:var(--neu-soft)} .c-e{--c:var(--ele);--cs:var(--ele-soft)}
.c-s{--c:var(--bs);--cs:var(--bs-soft)} .c-pb{--c:var(--bp);--cs:var(--bp-soft)} .c-d{--c:var(--bd);--cs:var(--bd-soft)} .c-f{--c:var(--bf);--cs:var(--bf-soft)}
.c-ink{--c:var(--ink);--cs:var(--sunk)}
.q{display:inline-flex;align-items:baseline;gap:5px;font-family:var(--f-mono);color:var(--c,var(--ink));background:var(--cs,var(--sunk));border:1.5px solid var(--c,var(--ink));border-radius:8px;padding:2px 9px;white-space:nowrap;font-size:17px}
.q b{font-weight:600}
.q.ask{background:transparent;border-style:dashed}
.chg{font-weight:700;font-family:var(--f-mono)}
.chg.pos,.chg.neg{color:inherit} .chg.zero{color:var(--muted)} .dl{font-weight:600}
.tp{color:var(--pro);font-weight:600} .tn{color:var(--neu);font-weight:600} .te{color:var(--ele);font-weight:600}
.ts{color:var(--bs);font-weight:600} .tpb{color:var(--bp);font-weight:600} .td{color:var(--bd);font-weight:600} .tf{color:var(--bf);font-weight:600}
/* notación ᴬ_Z X */
.nuc{display:inline-flex;align-items:center;font-family:var(--f-mono);font-weight:500;line-height:1;white-space:nowrap;vertical-align:middle}
.nuc .az{display:inline-flex;flex-direction:column;align-items:flex-end;font-size:.62em;margin-right:2px;gap:2px}
.nuc .az .zz{color:var(--pro)}
.nuc .sym{font-size:1em}
.nuc .ch{font-size:.62em;align-self:flex-start;margin-left:1px;font-weight:700}
.conf{font-family:var(--f-mono);white-space:normal;line-height:1.9}
.conf .ss{white-space:nowrap;margin-right:6px}
.conf .ss sup{font-size:.72em;font-weight:600}

/* barra superior */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;flex-direction:column;gap:4px;padding-block:10px 0}
.brandrow{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{font-family:var(--f-display);font-weight:800;font-size:22px;letter-spacing:-.02em;display:flex;align-items:baseline;gap:6px;white-space:nowrap}
.brand small{font-family:var(--f-mono);font-size:11px;font-weight:500;color:var(--muted)}
.hstats{display:flex;align-items:center;gap:10px;font-family:var(--f-mono);font-size:14px;font-variant-numeric:tabular-nums}
.hstats span{display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.iconbtn{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;width:44px;height:44px;display:grid;place-items:center;cursor:pointer;flex:0 0 auto}
.tabs{display:flex;gap:2px;margin:0 -4px}
.tab{flex:1 1 0;background:none;border:0;padding:10px 6px 11px;font-weight:600;font-size:15px;color:var(--muted);border-bottom:3px solid transparent;cursor:pointer;min-height:44px;touch-action:manipulation}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}
body.playing .top{display:none}
main{padding-block:18px 96px}
.view{display:flex;flex-direction:column;gap:18px}

/* botones */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:8px 18px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-weight:600;font-size:16px;cursor:pointer;text-align:center;touch-action:manipulation}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.btn.big{min-height:54px;font-size:17px;border-radius:14px;width:100%}
.btn.small{min-height:44px;padding:4px 14px;font-size:15px}
.btn.link{border:0;background:none;padding:4px 2px;min-height:44px;text-decoration:underline;text-underline-offset:3px;font-weight:500;color:var(--muted)}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}

/* mapa */
.hero{display:flex;flex-direction:column;gap:12px}
.rank{display:flex;flex-direction:column;gap:6px}
.rank .rk{font-family:var(--f-display);font-weight:800;font-size:26px;letter-spacing:-.02em}
.rank .rs{font-size:14px;color:var(--muted);font-family:var(--f-mono)}
.xpbar{height:10px;background:var(--sunk);border-radius:5px;overflow:hidden}
.xpbar i{display:block;height:100%;background:var(--ink);border-radius:5px;transition:width .6s}
.block{display:flex;flex-direction:column;gap:10px}
.bhead{display:flex;align-items:baseline;gap:10px;padding-top:8px}
.bhead .bn{font-family:var(--f-mono);font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.bhead h2{font-size:22px;font-weight:800;letter-spacing:-.01em}
.units{display:flex;flex-direction:column;gap:10px}
.urow{display:grid;grid-template-columns:1fr auto;gap:10px 14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 12px 12px 14px}
.uhead{display:flex;flex-direction:column;gap:6px;min-width:0}
.uname{display:flex;align-items:center;gap:8px;font-weight:600;font-size:17px;line-height:1.2}
.unum{font-family:var(--f-mono);font-size:13px;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--ink);flex:0 0 auto}
.urow.mastered .unum{background:var(--ink);color:var(--surface)}
.route{display:flex;flex-wrap:wrap;align-items:center;gap:4px;font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.rc{color:var(--c);background:var(--cs);border-radius:6px;padding:0 6px;font-weight:500;white-space:nowrap}
.idea{display:inline-flex;align-items:center;gap:5px;border:0;background:none;color:var(--muted);font-size:14px;font-weight:500;padding:0;min-height:36px;cursor:pointer;text-decoration:underline;text-underline-offset:3px;align-self:flex-start}
.tiles{display:grid;grid-template-columns:repeat(4,64px);gap:6px}
.tile{position:relative;height:72px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:6px 2px 7px;cursor:pointer}
.tile .tnum{font-family:var(--f-display);font-weight:800;font-size:22px;line-height:1}
.tile .tl{font-size:10px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);font-weight:600}
.tst{display:flex;gap:1px;align-items:center}
.tile .tst .ico{width:12px;height:12px}
.tile:disabled{cursor:default;opacity:.5}
.tile.next{border:2.5px solid var(--ink);background:var(--surface);box-shadow:0 3px 0 var(--ink)}
.tile.next::after{content:"JUGAR";position:absolute;top:-9px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--surface);font-size:9px;font-weight:700;letter-spacing:.08em;padding:1px 6px;border-radius:6px}
.st-on{fill:var(--gold);stroke:var(--gold);stroke-width:1} .st-off{fill:none;stroke:var(--muted);stroke-width:1.5}
.final{display:flex;align-items:center;justify-content:space-between;gap:12px;border:2px dashed var(--ink);border-radius:16px;padding:14px;background:var(--surface);cursor:pointer;text-align:left;width:100%;color:var(--ink)}
.final:disabled{opacity:.5;cursor:default}
.final.next{border-style:solid;box-shadow:0 3px 0 var(--ink)}
.final b{font-family:var(--f-display);font-size:19px;font-weight:800;display:block}
.final span span{font-size:14px;color:var(--muted)}
.final .trophy{display:flex;align-items:center;gap:6px}
.final .trophy .ico{width:28px;height:28px}
.soon{border:1.5px dashed var(--line);border-radius:16px;padding:14px;color:var(--muted);font-size:15px}
.ust{display:inline-flex;align-items:center;gap:5px;font-family:var(--f-mono);font-size:12px;color:var(--muted);flex-wrap:wrap}
.urow.locked .uname{color:var(--muted)}
.tile.prac{border-style:dashed}
.tile.prac .tnum{font-size:24px}
.tile .tsub{font-size:10px;color:var(--muted);font-weight:600}
@media (max-width:540px){.urow{grid-template-columns:1fr}.tiles{grid-template-columns:repeat(4,1fr)}}

/* juego */
.playbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:12px;padding-block:10px}
.segbar{flex:1;display:flex;gap:4px}
.segbar i{flex:1;height:10px;border-radius:5px;background:var(--sunk)}
.segbar i.cur{background:var(--surface);box-shadow:inset 0 0 0 2px var(--ink)}
.segbar i.r1{background:var(--ok)} .segbar i.r2{background:var(--ok);opacity:.55} .segbar i.r0{background:var(--bad)}
.combo{font-family:var(--f-mono);font-weight:600;display:inline-flex;align-items:center;gap:3px;min-width:44px;justify-content:flex-end}
.combo.hot{animation:pop .35s}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.vp{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;font-size:17px}
.vpa{font-family:var(--f-mono);color:var(--muted);font-size:20px}
.vbig{font-size:34px}
.stmt{font-size:18px;margin:0;max-width:60ch;font-weight:500}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.step{border:1.5px solid var(--line);border-radius:14px;padding:12px 13px;display:flex;flex-direction:column;gap:12px;min-width:0}
.step.s-open{border-color:var(--ink)}
.step.s-ok{border-color:var(--ok);background:var(--ok-soft)}
.step.s-rev{border-color:var(--line);background:var(--sunk)}
.step.shake{animation:shake .35s}
.sq{display:flex;gap:10px;align-items:flex-start;font-weight:500}
.sn{flex:0 0 auto;font-family:var(--f-mono);font-size:12px;font-weight:600;width:22px;height:22px;border-radius:11px;display:grid;place-items:center;background:var(--ink);color:var(--surface);margin-top:1px}
.s-ok .sn{background:var(--ok)}
.inrow{display:flex;gap:8px;align-items:stretch;flex-wrap:wrap}
.inbox{display:flex;align-items:stretch;flex:1 1 150px;min-width:0;border:2px solid var(--line);border-radius:12px;background:var(--bg);overflow:hidden}
.inbox:focus-within{border-color:var(--ink)}
.inbox input{flex:1;min-width:0;width:100%;border:0;background:none;font-family:var(--f-mono);font-size:19px;padding:9px 11px;color:var(--ink);outline:none}
.ulbl{display:flex;align-items:center;padding:0 11px;font-family:var(--f-mono);font-size:15px;font-weight:600;color:var(--c,var(--muted));background:var(--cs,var(--sunk));white-space:nowrap}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{text-align:left;justify-content:flex-start;font-weight:500;min-height:50px}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pills .pill{flex:1 1 58px;max-width:120px}
.pill{min-width:58px;min-height:52px;font-family:var(--f-mono);font-size:19px;font-weight:600;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;padding:6px 12px;color:var(--c,var(--ink));touch-action:manipulation}
.pill:hover{border-color:var(--muted)}
.fb{font-size:15px;border-radius:10px;padding:9px 12px}
.fb.bad{background:var(--bad-soft);border-left:4px solid var(--bad)}
.fb.near,.fb.hint,.fb.info{background:var(--sunk);border-left:4px solid var(--muted)}
.fb.good{background:var(--ok-soft);border-left:4px solid var(--ok)}
.sa{display:flex;flex-direction:column;gap:2px}
.sa .v{font-family:var(--f-mono);font-weight:600}
.sa .ex{font-size:14px;color:var(--muted)}
.sa .ex b{color:var(--ink)}
.cardfoot{display:flex;justify-content:center}
.solbox{display:flex;flex-direction:column;gap:12px;border-top:1px solid var(--line);padding-top:12px}
.solsteps{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:6px;font-size:15px}
.solsteps .ex{color:var(--muted);font-size:14px;display:block}
.solsteps .ex b{color:var(--ink)}
.spacer{height:190px}
.vis{display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:10px;padding:10px;background:var(--bg);border-radius:14px;overflow-x:auto}
.vis svg{max-width:100%;height:auto;display:block}

/* casillas múltiples */
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(92px,1fr));gap:8px}
.fld2{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld2 label{font-family:var(--f-mono);font-size:14px;font-weight:600;color:var(--c,var(--ink))}
.fld2 input{width:100%;min-width:0;border:2px solid var(--line);border-radius:12px;background:var(--bg);font-family:var(--f-mono);font-size:20px;padding:8px 10px;color:var(--ink);outline:none;min-height:48px}
.fld2 input:focus{border-color:var(--ink)}
.fld2 .given{border:2px solid transparent;border-radius:12px;background:var(--cs,var(--sunk));color:var(--c,var(--ink));font-family:var(--f-mono);font-size:20px;font-weight:600;padding:8px 10px;min-height:48px;display:flex;align-items:center}
.fld2.wrong input{border-color:var(--bad)}
.fld2 .mk{font-size:12px;color:var(--bad);font-weight:600}

/* constructores */
.builder{display:flex;flex-direction:column;gap:12px}
.ctrs{display:grid;grid-template-columns:repeat(auto-fit,122px);gap:12px 8px;justify-content:center}
.ctr{display:flex;flex-direction:column;align-items:center;gap:4px}
.ctr .cl{font-family:var(--f-mono);font-size:14px;font-weight:600;color:var(--c,var(--ink));text-align:center}
.ctr .cap{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.stp{display:flex;align-items:center;border:2px solid var(--c,var(--ink));border-radius:12px;background:var(--cs,var(--sunk));overflow:hidden}
.sb{border:0;background:none;width:44px;height:46px;font-size:24px;cursor:pointer;color:var(--c,var(--ink));font-family:var(--f-mono);touch-action:manipulation;line-height:1}
.sb:active{background:var(--surface)}
.sb:disabled{opacity:.3;cursor:default}
.cv{min-width:28px;text-align:center;font-family:var(--f-mono);font-weight:600;font-size:21px;color:var(--c,var(--ink));font-variant-numeric:tabular-nums}
.counter{text-align:center;font-family:var(--f-mono);font-size:14px;color:var(--muted)}
.subs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.subrow{display:flex;align-items:center;justify-content:space-between;gap:6px;border:1.5px solid var(--c);background:var(--cs);border-radius:12px;padding:4px 4px 4px 10px}
.subrow .sl{font-family:var(--f-mono);font-weight:700;font-size:18px;color:var(--c)}
.subrow .sl small{font-weight:500;font-size:12px;color:var(--muted);margin-left:3px}
.subrow .stp{border:0;background:none}
.subrow .sb{width:40px;height:42px}
.subrow .cv{min-width:26px;font-size:19px}

/* tarjetas de tutorial */
.lcard{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px 18px;display:flex;flex-direction:column;gap:14px;min-height:300px}
.lcard h2{font-size:26px;font-weight:800;letter-spacing:-.02em}
.lcard p{margin:0;font-size:18px;max-width:46ch}
.lvis{display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:10px;padding:14px 8px;background:var(--bg);border-radius:14px;min-height:130px;overflow-x:auto}
.lvis>*{max-width:100%}
.lvis svg{height:auto}
.ldots{display:flex;gap:6px}
.ldots i{width:8px;height:8px;border-radius:50%;background:var(--sunk)}
.ldots i.on{background:var(--ink)}
.bigf{font-family:var(--f-mono);font-size:40px;font-weight:500;text-align:center}
.ann{display:flex;flex-direction:column;gap:4px;font-size:15px}
.eqline{font-family:var(--f-mono);font-size:22px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center}

/* resumen */
.summary{display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center;padding-block:24px}
.summary h2{font-size:32px;font-weight:800;letter-spacing:-.02em}
.bigstars{display:flex;gap:10px}
.bigstars .ico{width:56px;height:56px}
.bigstars .ico.pop{animation:starpop .45s cubic-bezier(.3,1.6,.5,1)}
.sumstats{display:flex;gap:22px;justify-content:center;flex-wrap:wrap;font-size:14px;color:var(--muted)}
.sumstats b{display:block;font-family:var(--f-mono);font-size:24px;color:var(--ink);font-weight:500}
.rankup{font-weight:600;border:1.5px solid var(--ink);border-radius:10px;padding:6px 12px}
.summary .btns{display:flex;flex-direction:column;gap:10px;width:100%;max-width:360px}
.unlock{border:2px solid var(--ink);border-radius:12px;padding:10px 14px;font-weight:600;display:flex;gap:8px;align-items:center}

/* panel elegir */
.chooser{position:fixed;inset:0;z-index:30;display:flex;align-items:flex-end;justify-content:center;background:rgba(8,12,16,.5)}
.chooser .panel{width:100%;max-width:520px;background:var(--surface);color:var(--ink);border-radius:20px 20px 0 0;padding-top:20px;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:12px;animation:up .22s ease-out}
@media (min-width:600px){.chooser{align-items:center}.chooser .panel{border-radius:20px}}
.chooser h3{font-size:28px;font-weight:800;letter-spacing:-.02em}
.chooser .sub{margin:0;color:var(--muted)}
.chooser .tst .ico{width:24px;height:24px}
.badge{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border:1.5px solid currentColor;border-radius:6px;padding:0 5px}
.pseg{display:flex;gap:4px;flex-wrap:wrap}
.pseg button{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:5px 10px;min-height:44px;font-size:14px;font-weight:600;cursor:pointer;color:var(--muted)}
.pseg button.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.pseg button:disabled{opacity:.4;cursor:default}
.pcount{font-family:var(--f-mono);font-weight:600;margin-left:auto;white-space:nowrap}

/* hoja de feedback */
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:20;padding-bottom:calc(14px + env(safe-area-inset-bottom,0px));padding-top:14px;border-top:3px solid var(--c);background:var(--cs);animation:up .25s ease-out}
.sheet.ok{--c:var(--ok);--cs:var(--ok-soft)} .sheet.bad{--c:var(--bad);--cs:var(--bad-soft)}
.sheet .wrap{display:flex;flex-direction:column;gap:8px}
.shmsg{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.shmsg h3{font-size:24px;color:var(--c);display:flex;align-items:center;gap:8px}
.shnote{margin:0;font-size:15px;max-width:60ch}
.xp{font-family:var(--f-mono);font-weight:600;font-size:16px;animation:float .9s ease-out}
.sheet .btn.primary{background:var(--c);border-color:var(--c);color:var(--surface)}

/* laboratorio */
.seg{display:flex;border:1.5px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.seg button{flex:1;border:0;background:none;padding:10px 4px;min-height:44px;font-weight:600;color:var(--muted);cursor:pointer;font-size:15px}
.seg button.on{background:var(--ink);color:var(--surface)}
.abuild{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;align-items:center}
@media (max-width:600px){.abuild{grid-template-columns:1fr}}
.aread{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.aread .big{font-size:56px;line-height:1}
.aread .ename{font-family:var(--f-display);font-weight:800;font-size:24px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:15px;align-items:baseline}
.kv dt{color:var(--muted);font-size:13px}
.kv dd{margin:0;font-family:var(--f-mono);font-weight:500}
.tag{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--ink);border-radius:999px;padding:2px 12px;font-weight:600;font-size:14px}
.missions{display:flex;flex-direction:column;gap:8px}
.mission{display:flex;align-items:center;gap:10px;justify-content:space-between;border:1.5px solid var(--line);border-radius:12px;padding:8px 12px;background:var(--surface);cursor:pointer;text-align:left;min-height:48px;width:100%}
.mission.on{border-color:var(--ink);box-shadow:0 2px 0 var(--ink)}
.mission.done{background:var(--ok-soft);border-color:var(--ok)}
.mission .mk{font-weight:700;color:var(--ok)}

/* ayuda */
.sec{display:flex;flex-direction:column;gap:10px}
.sec h2{font-size:21px;font-weight:800}
.sec>p{margin:0;color:var(--muted);max-width:60ch}
.legendbig{display:flex;flex-direction:column;gap:8px}
.legendbig>div{display:flex;gap:10px;align-items:center;font-size:15px}
.legendbig .q{min-width:96px;justify-content:center}
.swatch{display:inline-grid;place-items:center;min-width:96px;height:30px;border-radius:8px;font-family:var(--f-mono);font-weight:600;font-size:14px;border:1px solid var(--line);color:var(--cat-ink)}
.toggle{display:flex;align-items:center;gap:10px;font-size:15px;cursor:pointer;min-height:44px}
.toggle input{width:22px;height:22px;accent-color:var(--ink)}
.refgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
.ref{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--surface);display:flex;flex-direction:column;gap:4px}
.ref b{font-family:var(--f-mono);font-size:17px}
.ref span{font-size:14px;color:var(--muted)}

/* herramienta flotante */
.fab{position:fixed;right:max(16px,calc(env(safe-area-inset-right,0px) + 12px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:25;width:56px;height:56px;border-radius:18px;border:0;background:var(--ink);color:var(--surface);display:grid;place-items:center;cursor:pointer;box-shadow:0 6px 18px var(--shadow);transition:bottom .2s ease,transform .15s ease}
.fab:active{transform:scale(.92)}
.fab svg{width:26px;height:26px;grid-area:1/1;transition:transform .18s ease,opacity .18s ease}
.fab .i-min{opacity:0;transform:rotate(-90deg) scale(.5)}
.fab.open .i-tool{opacity:0;transform:rotate(90deg) scale(.5)}
.fab.open .i-min{opacity:1;transform:none}
body.sheet-on .fab{bottom:calc(170px + env(safe-area-inset-bottom,0px))}
.tool{position:fixed;right:max(16px,calc(env(safe-area-inset-right,0px) + 12px));bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:24;width:min(340px,calc(100vw - 32px));max-height:calc(100vh - 120px);overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:10px 12px 12px;display:flex;flex-direction:column;gap:10px;box-shadow:0 12px 36px var(--shadow);transform-origin:calc(100% - 28px) calc(100% + 40px);transform:scale(.2);opacity:0;visibility:hidden;transition:transform .18s cubic-bezier(.3,1.3,.5,1),opacity .14s ease,visibility 0s linear .18s,bottom .2s ease}
.tool.open{transform:none;opacity:1;visibility:visible;transition:transform .18s cubic-bezier(.3,1.3,.5,1),opacity .12s ease,visibility 0s,bottom .2s ease}
body.sheet-on .tool{bottom:calc(238px + env(safe-area-inset-bottom,0px));max-height:calc(100vh - 270px)}
.ttabs{display:flex;gap:4px;background:var(--sunk);border-radius:12px;padding:3px}
.ttabs button{flex:1;border:0;background:none;border-radius:9px;min-height:40px;font-weight:600;font-size:14px;color:var(--muted);cursor:pointer}
.ttabs button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px var(--shadow)}
.mini{overflow-x:auto;border-radius:10px;background:var(--bg);padding:6px}
.mini .pt{grid-template-columns:repeat(18,30px);grid-auto-rows:34px;gap:2px}
.mini .pc{font-size:12px}
.mini .pc small{display:none}
.minfo{font-size:14px;min-height:42px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.minfo b{font-family:var(--f-mono);font-size:18px}
.guard{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;padding:24px 10px;color:var(--muted);font-size:15px}
.guard .ico{width:32px;height:32px}
.cdisp{background:var(--sunk);border-radius:12px;padding:8px 12px;display:flex;flex-direction:column;align-items:flex-end;gap:2px;min-height:68px;justify-content:flex-end;overflow:hidden}
.cexpr{font-family:var(--f-mono);font-size:14px;color:var(--muted);word-break:break-all;text-align:right;min-height:1.2em}
.cres{font-family:var(--f-mono);font-size:26px;font-weight:600;word-break:break-all;text-align:right;line-height:1.15}
.cres.err{color:var(--bad);font-size:16px}
.ckeys{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.ck{min-height:46px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-family:var(--f-mono);font-size:19px;font-weight:500;cursor:pointer;touch-action:manipulation}
.ck:active{transform:scale(.95)}
.ck.op{background:var(--sunk);border-color:var(--sunk)}
.ck.eq{background:var(--ink);border-color:var(--ink);color:var(--surface);font-weight:600}
.ck.use{font-family:var(--f-body);font-size:14px;font-weight:600}
.ck.w2{grid-column:span 2}
.ck.sm{font-size:15px}

/* tabla periódica */
.ptwrap{overflow-x:auto;max-width:100%;-webkit-overflow-scrolling:touch;padding-bottom:4px}
.pt{display:grid;grid-template-columns:repeat(18,minmax(36px,1fr));grid-auto-rows:44px;gap:3px;min-width:max-content}
.pc{border:1px solid var(--line);border-radius:6px;background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05;font-family:var(--f-mono);font-size:14px;font-weight:600;padding:0;cursor:pointer;color:var(--ink);min-width:0}
.pc small{font-size:9px;font-weight:500;color:var(--muted)}
.pc.gap{border-style:dashed;background:none;font-size:9px;color:var(--muted);cursor:default;font-weight:500}
.pc:disabled{cursor:default}

.confetti{position:fixed;inset:0;pointer-events:none;z-index:50;width:100%;height:100%}
@keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.25)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
@keyframes float{0%{transform:translateY(8px);opacity:0}40%{opacity:1}100%{transform:none}}
@keyframes starpop{0%{transform:scale(0) rotate(-30deg)}100%{transform:none}}
@keyframes flash{0%{background:var(--ok-soft)}100%{background:var(--surface)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

@media (max-width:420px){.brand{font-size:19px}.hstats .hxp{display:none}.hstats{gap:8px}}

/* pasos que se tocan */
.tapinfo{font-size:15px;min-height:28px}
.pc.sel{outline:3px solid var(--ink);outline-offset:1px;z-index:1;position:relative}
.pc.nodata{background:var(--surface);border-style:dashed;color:var(--muted)}
.pt.tiny .pc{border-radius:3px;min-width:14px}
.pt.tiny{grid-template-columns:repeat(18,minmax(14px,1fr));min-width:0}
.slots{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.slot{min-width:64px;min-height:52px;border:2px dashed var(--line);border-radius:12px;background:var(--bg);font-family:var(--f-mono);font-size:19px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:4px 10px;color:var(--ink);cursor:pointer}
.slot.full{border-style:solid;border-color:var(--ink);background:var(--surface)}
.slot:disabled{cursor:default}
.sn2{font-size:11px;color:var(--muted);font-weight:600}
.lowhigh{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;max-width:420px}
.cfree{display:flex;flex-wrap:wrap;gap:8px;min-height:52px;align-items:center}
.ccard{min-width:56px;min-height:48px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);font-family:var(--f-mono);font-size:18px;font-weight:600;cursor:pointer;padding:4px 10px;color:var(--ink)}
.ccard.on{border:2.5px solid var(--ink);box-shadow:0 3px 0 var(--ink);transform:translateY(-2px)}
.bins{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.bin{border:1.5px solid var(--line);border-radius:14px;background:var(--bg);display:flex;flex-direction:column;overflow:hidden;min-height:110px}
.binh{border:0;border-bottom:1.5px solid var(--line);background:var(--sunk);min-height:46px;font-weight:600;font-size:15px;cursor:pointer;padding:6px 8px;color:var(--ink)}
.binh:not(:disabled):hover{background:var(--surface)}
.binh:disabled{cursor:default;color:var(--muted)}
.binc{display:flex;flex-wrap:wrap;gap:6px;padding:8px}
.binc .ccard{min-height:44px;font-size:16px}
.sw{display:inline-block;width:14px;height:14px;border-radius:4px;border:1px solid var(--line);vertical-align:-2px;margin-right:4px}
.tlegend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;align-items:center}
.tlegend span{display:inline-flex;align-items:center;gap:2px}
.tlegend .hbar{display:inline-block;width:140px;height:14px;border-radius:7px;background:linear-gradient(90deg,color-mix(in srgb,var(--heat1) 8%,var(--heat0)),var(--heat1))}
.tlegend .nod{border:1px dashed var(--line);border-radius:4px;padding:0 6px;color:var(--muted)}
.trendrow{display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-size:14px;color:var(--muted);margin-top:8px}
.trendrow span{flex:1 1 200px}
.ficha .fhead{display:flex;gap:14px;align-items:center}
.fsym{width:72px;height:72px;border-radius:14px;border:2px solid var(--c);background:var(--cs);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.fsym b{font-family:var(--f-display);font-size:30px;font-weight:800;color:var(--ink)}
.fsym small{font-family:var(--f-mono);font-size:12px;color:var(--c)}
.ficha .kv dd{min-width:0}
.huntmsg{min-height:24px;font-size:15px}
.racehead{display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.clock{font-family:var(--f-display);font-weight:800;font-size:44px;line-height:1;font-variant-numeric:tabular-nums}
.clock.low{color:var(--bad)}
.rscore{font-family:var(--f-mono);font-size:16px;text-align:right}
.rscore b{font-size:28px;display:block}
.flash{animation:flash .5s}
.ok-t{color:var(--ok);font-weight:600} .bad-t{color:var(--bad);font-weight:600}

.view>.inbox,.view>.pseg{flex:0 0 auto}
.ph{font-family:var(--f-mono);font-size:11px;color:var(--muted);display:flex;align-items:center;justify-content:center;font-weight:600}
.sa .v.tx{font-family:var(--f-body)}

/* Lewis */
.dboard{position:relative;width:180px;height:180px;margin:0 auto}
.dboard svg{position:absolute;inset:0}
.dside{position:absolute;width:52px;height:52px;border:2px dashed var(--line);border-radius:12px;background:transparent;cursor:pointer;color:var(--muted);font-size:20px;font-weight:600}
.dside:hover{border-color:var(--ink)}
.ds-t{left:64px;top:2px}.ds-b{left:64px;bottom:2px}.ds-l{left:2px;top:64px}.ds-r{right:2px;top:64px}
.lboard{position:relative;width:100%;margin:0 auto}
.lbtn{position:absolute;transform:translate(-50%,-50%);border:2px dashed transparent;background:transparent;border-radius:50%;cursor:pointer;padding:0}
.lbtn.lb{width:44px;height:44px;border-color:var(--line)}
.lbtn.la{width:48px;height:48px}
.lbtn:hover,.lbtn:focus-visible{border-color:var(--ink)}
.fprev{font-size:15px;color:var(--muted)}
.fprev .mono{font-size:22px;color:var(--ink)}
.lewpick{display:flex;flex-wrap:wrap;gap:6px}
.lewpick button{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;min-height:44px;min-width:56px;padding:4px 10px;font-family:var(--f-mono);font-size:15px;cursor:pointer;color:var(--ink)}
.lewpick button.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.lewpick button.done:not(.on){border-color:var(--ok)}
.lewpick button.done::after{content:' ✓';color:var(--ok)}
.lewpick button.done.on::after{color:inherit}
.pc.miss{background:var(--surface);border-style:dashed;color:var(--muted);font-weight:500}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
.bdg{display:flex;gap:10px;align-items:center;border:1.5px dashed var(--line);border-radius:14px;padding:10px 12px;background:var(--surface);color:var(--muted)}
.bdg .ico{width:28px;height:28px}
.bdg div{display:flex;flex-direction:column;min-width:0}
.bdg b{color:var(--ink)}
.bdg small{font-family:var(--f-mono);font-size:12px}
.bdg.on{border:2px solid var(--ink);color:var(--ink)}
.etile{display:inline-grid;grid-template-rows:auto 1fr auto;justify-items:center;align-items:center;width:64px;height:70px;border:1.5px solid var(--ink);border-radius:8px;background:var(--surface);color:var(--ink);padding:3px 4px 4px;position:relative;line-height:1;vertical-align:middle;flex:0 0 auto}
.etile small{justify-self:start;font-family:var(--f-mono);font-size:11px;font-weight:600}
.etile b{font-family:var(--f-display);font-size:24px;font-weight:800}
.etile i{font-style:normal;font-family:var(--f-body);font-weight:500;font-size:10px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.etile.sm{width:60px;height:64px}
.etile.sm b{font-size:22px}
.etile.nz{grid-template-rows:1fr auto;padding-top:8px}
.etile.lg{width:84px;height:92px;border-width:2px;border-radius:10px}
.etile.lg small{font-size:13px}.etile.lg b{font-size:34px}.etile.lg i{font-size:12px}
.pill .etile{border:0;background:none;width:auto;min-width:60px}
.pill:has(.etile){padding:4px 6px}
.ficha .fhead .etile{flex:0 0 auto}
.minfo .etile{width:56px;height:60px}
/* encabezado del mapa: nivel, XP y estrellas */
.rankcard{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px 14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px}
.rkbadge{width:66px;height:66px;border-radius:50%;background:var(--ink);color:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;box-shadow:0 0 0 4px var(--sunk),0 0 0 6px var(--gold)}
.rkbadge small{font-size:9px;letter-spacing:.14em;font-weight:700}
.rkbadge b{font-family:var(--f-display);font-size:30px;font-weight:800}

/* Regla de las diagonales: lista [[subnivel, electrones]] */
function aufbau(n){const c=[];let r=n;for(const o of SUBS){if(r<=0)break;const k=Math.min(r,SUBCAP[o[1]]);c.push([o,k]);r-=k}return c}
/* Configuración real del átomo neutro */
function econf(Z){
  const c=aufbau(Z);const x=CONF_EXC[Z];if(!x)return c;
  const m=Object.fromEntries(c);for(const k in x)m[k]=x[k];
  return SUBS.filter(s=>m[s]).map(s=>[s,m[s]]);
}
/* Configuración de un ion o átomo con Z protones y e electrones (los cationes pierden primero los del nivel más alto) */
function ionConf(Z,e){
  if(e<=0)return [];
  let c=econf(Math.min(Z,118)).map(x=>x.slice());
  if(e>Z){
    let r=e-Z;const m=Object.fromEntries(c);
    for(const s of SUBS){if(r<=0)break;const cap=SUBCAP[s[1]],have=m[s]||0;if(have<cap){const k=Math.min(cap-have,r);m[s]=have+k;r-=k}}
    return SUBS.filter(s=>m[s]).map(s=>[s,m[s]]);
  }
  let r=Z-e;
  while(r>0){
    // nivel más alto; dentro del nivel, el subnivel de mayor l
    let best=-1,bn=-1,bl=-1;c.forEach((x,i)=>{if(!x[1])return;const n=+x[0][0],l='spdf'.indexOf(x[0][1]);if(n>bn||(n===bn&&l>bl)){bn=n;bl=l;best=i}});
    const k=Math.min(r,c[best][1]);c[best][1]-=k;r-=k;
  }
  return c.filter(x=>x[1]>0);
}

/* ===== Lector de fórmulas: H2O, Ca(OH)2, Al2(SO4)3 ===== */
function parseFormula(str){
  let s=String(str).replace(/\s/g,'').replace(/[₀-₉]/g,c=>String(c.charCodeAt(0)-8320));
  if(!s)throw new Error('Escribe una fórmula.');
  let i=0;
  function seq(){const out={};
    while(i<s.length&&s[i]!==')'){
      let grp;
      if(s[i]==='('){i++;grp=seq();if(s[i]!==')')throw new Error('Falta cerrar un paréntesis.');i++}
      else{const m=/^[A-Z][a-z]?/.exec(s.slice(i));if(!m)throw new Error(/^[a-z]/.test(s.slice(i))?'Los símbolos empiezan con mayúscula: Na, Cl, O.':`No reconozco «${s.slice(i,i+2)}».`);
        let sym=m[0];if(!BY[sym]&&sym.length===2&&BY[sym[0]])sym=sym[0];if(!BY[sym])throw new Error(`No existe el elemento ${m[0]}.`);grp={[sym]:1};i+=sym.length}
      const n=/^\d+/.exec(s.slice(i));let k=1;if(n){k=+n[0];i+=n[0].length;if(k===0)throw new Error('Un subíndice no puede ser 0.')}
      for(const e in grp)out[e]=(out[e]||0)+grp[e]*k;
    }
    return out}
  const r=seq();if(i<s.length)throw new Error('Sobra un paréntesis de cierre.');return r;
}
const sameComp=(a,b)=>{const ka=Object.keys(a),kb=Object.keys(b);return ka.length===kb.length&&ka.every(k=>a[k]===b[k])};
const normF=s=>String(s).replace(/\s/g,'').replace(/[₀-₉]/g,c=>String(c.charCodeAt(0)-8320));

/* =====================================================================
   PASOS Y CORRECTOR
   Tipos de paso:
   · choice  opciones (columna o fila de «pastillas»); cada distractor trae su mensaje de error típico
   · num     número en una casilla (entero exacto o decimal con tolerancia)
   · fields  varias casillas enteras (Z, A, p, n, e…), con trampas por casilla
   · build   constructor con botones − y + (partículas, niveles, subniveles…)
   Propiedades comunes: q (pregunta), key (paso clave), direct (solo en modo directo),
   hint (pista), ex (explicación), traps (errores típicos reconocibles).
   ===================================================================== */
const TOL=()=>CONFIG.tolerancia;
/* Tipos de paso extra (tabla, ordenar, clasificar, fórmulas, Lewis…): STEPX[tipo] = {check, raw, fmt, html, click, read} */
const STEPX={};

/* Opción múltiple. correct: html; wrongs: [{t,msg}] (se quitan repetidas). */
/* clave para comparar opciones: el texto, o la descripción del dibujo si la opción es un SVG */
function optKey(t){t=String(t);if(/<svg/.test(t)){const m=t.match(/aria-label="([^"]*)"/);if(m)return m[1]}return strip(t)}
function choiceStep(q,correct,wrongs,o={}){
  const seen=new Set([optKey(correct)]);const ws=[];
  for(const w of wrongs){if(!w||w.t==null)continue;const k=optKey(w.t);if(seen.has(k))continue;seen.add(k);ws.push(w)}
  const n=o.max||4;const list=[{t:correct,ok:1}].concat(ws.slice(0,n-1));
  if(/etile/.test(correct)&&o.row==null)o=Object.assign({},o,{row:true});
  let opts=o.sort?list.slice().sort(o.sort):(o.keep?list:shuffle(list));
  return Object.assign({type:'choice',q,opts:opts.map(x=>({t:x.t,msg:x.msg||null})),ans:opts.findIndex(x=>x.ok),row:!!o.row},o.extra||{});
}
/* Pastillas numéricas ordenadas */
function pillStep(q,ans,wrongs,o={}){
  const max=o.max||4,min=o.min!=null?o.min:0;
  const ws=wrongs.filter(w=>w&&w.v!=null&&isFinite(w.v)&&w.v!==ans&&w.v>=min);
  const used=new Set([ans]);const out=[];for(const w of ws){if(used.has(w.v))continue;used.add(w.v);out.push(w)}
  for(let k=1;out.length<max-1&&k<40;k++)for(const c of [ans+k,ans-k]){if(out.length<max-1&&c>=min&&!used.has(c)){used.add(c);out.push({v:c})}}
  const num=t=>parseFloat(strip(t).replace('−','-').replace(',','.'));
  const ns=v=>String(v).replace('-','−');
  return choiceStep(q,ns(ans),out.map(w=>({t:ns(w.v),msg:w.msg})),Object.assign({row:true,max,sort:(a,b)=>num(a.t)-num(b.t)},o));
}
/* Número en casilla. Quita trampas que coinciden con la respuesta o entre sí. */
function numStep(q,ans,o={}){
  const isInt=o.int!=null?o.int:Number.isInteger(ans);
  const far=(a,b)=>isInt?a!==b:Math.abs(a-b)/Math.max(Math.abs(b),1e-12)>2*TOL();
  const traps=[];for(const t of o.traps||[]){if(t.v==null||!isFinite(t.v))continue;if(!far(t.v,ans))continue;if(traps.some(x=>!far(x.v,t.v)))continue;traps.push(t)}
  return Object.assign({type:'num',q,ans,int:isInt,unit:o.unit||'',traps},o,{traps,int:isInt});
}
/* Varias casillas enteras */
function fieldsStep(q,fields,ans,traps,o={}){
  const ts=[];for(const t of traps||[]){if(t.v==null||!isFinite(t.v))continue;if(t.v===ans[t.k])continue;if(fields.find(f=>f.k===t.k).given!=null)continue;if(ts.some(x=>x.k===t.k&&x.v===t.v))continue;ts.push(t)}
  return Object.assign({type:'fields',q,fields,ans,traps:ts},o);
}
/* Constructor con − y + */
function buildStep(q,ctrs,ans,o={}){
  const ts=(o.traps||[]).filter(t=>!ctrs.every(c=>t.vals[c.k]===ans[c.k]));
  return Object.assign({type:'build',q,ctrs,ans},o,{traps:ts});
}

function parseIntStrict(s){const v=parseNum(s);return v!=null&&Number.isInteger(v)?v:null}

function checkStep(step,raw){
  if(STEPX[step.type])return STEPX[step.type].check(step,raw);
  if(step.type==='num'){
    const v=parseNum(raw);
    if(v===null)return{invalid:true,msg:'Escribe un número (usa coma para los decimales).'};
    const a=step.ans;
    if(step.int){if(v===a)return{ok:true}}
    else if(Math.abs(v-a)/Math.max(Math.abs(a),1e-12)<=TOL()+1e-9)return{ok:true};
    for(const t of step.traps||[]){const hit=step.int?v===t.v:Math.abs(v-t.v)/Math.max(Math.abs(t.v),1e-12)<=TOL()+1e-9;if(hit)return{ok:false,msg:t.msg,trap:true}}
    if(step.int&&!Number.isInteger(v))return{ok:false,msg:'Acá la respuesta es un número entero.'};
    if(!step.int&&Math.abs(v-a)/Math.abs(a)<=0.04)return{ok:false,near:true,msg:'¡Casi! Revisa los redondeos: usa los datos tal como están.'};
    return{ok:false};
  }
  if(step.type==='choice'){const i=+raw;if(i===step.ans)return{ok:true};const o=step.opts[i];return{ok:false,msg:o&&o.msg||null,trap:!!(o&&o.msg)}}
  if(step.type==='fields'){
    const vals={},wrong=[];let empty=false;
    for(const f of step.fields){if(f.given!=null)continue;const s=raw&&raw[f.k];if(s==null||String(s).trim()===''){empty=true;continue}
      const v=parseNum(s);vals[f.k]=v;if(v!==step.ans[f.k])wrong.push(f.k)}
    if(empty)return{invalid:true,msg:'Completa todas las casillas.'};
    if(Object.values(vals).some(v=>v===null))return{invalid:true,msg:'Escribe solo números en las casillas.'};
    if(!wrong.length)return{ok:true};
    for(const t of step.traps||[]){const v=vals[t.k];if(v==null)continue;if(Math.abs(v-t.v)<1e-9||(!Number.isInteger(t.v)&&Math.abs(v-t.v)/Math.abs(t.v)<0.006))return{ok:false,msg:t.msg,trap:true,wrong}}
    const lbl=wrong.map(k=>step.fields.find(f=>f.k===k).label);
    return{ok:false,wrong,msg:`Revisa ${lbl.length>1?lbl.slice(0,-1).join(', ')+' y '+lbl[lbl.length-1]:lbl[0]}.`};
  }
  if(step.type==='build'){
    const vals=raw||{};const ok=step.ctrs.every(c=>(vals[c.k]||0)===step.ans[c.k]);
    if(ok)return{ok:true};
    for(const t of step.traps||[]){if(step.ctrs.every(c=>t.vals[c.k]==null||(vals[c.k]||0)===t.vals[c.k]))return{ok:false,msg:t.msg,trap:true}}
    if(step.rule){const m=step.rule(vals);if(m)return{ok:false,msg:m,trap:true}}
    return{ok:false,msg:step.wrongMsg||null};
  }
  return{ok:false};
}
/* Respuesta correcta en el formato que escribe el estudiante (para mostrarla y para las pruebas) */
function correctRaw(step){
  if(STEPX[step.type])return STEPX[step.type].raw(step);
  if(step.type==='num')return step.int?String(step.ans):nice(step.ans);
  if(step.type==='choice')return String(step.ans);
  if(step.type==='fields'){const o={};step.fields.forEach(f=>{if(f.given==null)o[f.k]=String(step.ans[f.k])});return o}
  if(step.type==='build')return Object.assign({},step.ans);
  return null;
}
function fmtAns(step){
  if(STEPX[step.type])return STEPX[step.type].fmt(step);
  if(step.type==='num')return `${step.int?step.ans:nice(step.ans)} ${step.unit||''}`;
  if(step.type==='choice')return step.opts[step.ans].t;
  if(step.type==='fields')return step.fields.filter(f=>f.given==null).map(f=>`${f.label} = ${step.ans[f.k]}`).join(' · ');
  if(step.type==='build')return step.ansTxt||step.ctrs.map(c=>`${c.label} ${step.ans[c.k]}`).join(' · ');
  return '';
}

/* =====================================================================
   DIBUJOS (SVG)
   ===================================================================== */
/* Reparte protones y neutrones de forma pareja en el núcleo */
function nucleusParts(p,n){
  const N=p+n,out=[];let ap=0;
  for(let i=0;i<N;i++){const wantP=Math.round((i+1)*p/N);out.push(wantP>ap?'p':'n');if(wantP>ap)ap++}
  return out;
}
/* Átomo completo: núcleo con p⁺ y n⁰, electrones en órbitas.
   o.shells: electrones por nivel (si no, se calcula); o.size: ancho en px */
function atomSVG(p,n,e,o={}){
  const N=p+n,pr=9,c=10.4;
  const parts=nucleusParts(p,n);
  const nucR=N?c*Math.sqrt(N)+pr:0;
  const shells=o.shells||(e>0?(p>=1?shellsOf(ionConf(p,e)):shellsOf(aufbau(e))):[]);
  const ns=Math.max(shells.length,o.minRings||0);
  const r0=Math.max(nucR+20,42),gap=24;
  const R=ns?r0+(ns-1)*gap:nucR;const pad=14,W=2*(R+pad);const cx=W/2,cy=W/2;
  let s=`<svg viewBox="0 0 ${W.toFixed(0)} ${W.toFixed(0)}" width="${Math.min(o.size||300,W).toFixed(0)}" role="img" aria-label="${o.label||`Átomo con ${p} protones, ${n} neutrones y ${e} electrones`}">`;
  for(let k=0;k<ns;k++)s+=`<circle cx="${cx}" cy="${cy}" r="${(r0+k*gap).toFixed(1)}" fill="none" stroke="var(--line)" stroke-width="1.5"/>`;
  parts.forEach((t,i)=>{
    const r=c*Math.sqrt(i+0.5),a=i*2.39996;const x=cx+r*Math.cos(a),y=cy+r*Math.sin(a);
    s+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${pr}" fill="var(${t==='p'?'--pro':'--neu'})" stroke="var(--surface)" stroke-width="1.2"/>`;
    if(t==='p')s+=`<path d="M${(x-4).toFixed(1)} ${y.toFixed(1)}h8M${x.toFixed(1)} ${(y-4).toFixed(1)}v8" stroke="var(--surface)" stroke-width="2" stroke-linecap="round"/>`;
  });
  shells.forEach((k,si)=>{
    const rr=r0+si*gap;for(let j=0;j<k;j++){const a=-Math.PI/2+j*2*Math.PI/k+(si%2?Math.PI/k:0);const x=cx+rr*Math.cos(a),y=cy+rr*Math.sin(a);
      s+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="6.5" fill="var(--ele)" stroke="var(--surface)" stroke-width="1.2"/><path d="M${(x-3).toFixed(1)} ${y.toFixed(1)}h6" stroke="var(--surface)" stroke-width="1.8" stroke-linecap="round"/>`}
  });
  return s+'</svg>';
}
/* Modelo de Bohr: núcleo con un rótulo y electrones por nivel.
   o.label (texto del núcleo), o.hi (índice de nivel a resaltar), o.caps (mostrar n = 1…), o.rings (mínimo de órbitas) */
function bohrSVG(shells,o={}){
  const ns=Math.max(shells.length,o.rings||0),r0=o.r0||44,gap=o.gap||25,R=r0+Math.max(ns-1,0)*gap,pad=o.caps?24:14,W=2*(R+pad),cx=W/2,cy=W/2;
  let s=`<svg viewBox="0 0 ${W} ${W}" width="${Math.min(o.size||300,W)}" role="img" aria-label="${o.aria||'Modelo de Bohr: '+shells.join('-')}">`;
  for(let k=0;k<ns;k++){const rr=r0+k*gap;const hi=o.hi===k;
    s+=`<circle cx="${cx}" cy="${cy}" r="${rr}" fill="none" stroke="${hi?'var(--ink)':'var(--line)'}" stroke-width="${hi?2.5:1.5}" ${hi?'':''}/>`;
    if(o.caps)s+=`<text x="${cx+rr*0.7071+4}" y="${cy-rr*0.7071-4}" font-family="var(--f-mono)" font-size="11" fill="var(--muted)">n=${k+1}</text>`}
  s+=`<circle cx="${cx}" cy="${cy}" r="${r0-16}" fill="var(--pro-soft)" stroke="var(--pro)" stroke-width="2"/>`;
  if(o.label)s+=`<text x="${cx}" y="${cy+5}" text-anchor="middle" font-family="var(--f-mono)" font-size="${o.label.length>5?12:15}" font-weight="600" fill="var(--pro)">${o.label}</text>`;
  shells.forEach((k,si)=>{const rr=r0+si*gap;for(let j=0;j<k;j++){const a=-Math.PI/2+j*2*Math.PI/Math.max(k,1);const x=cx+rr*Math.cos(a),y=cy+rr*Math.sin(a);
    s+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="5.5" fill="var(--ele)" stroke="var(--surface)" stroke-width="1"/>`}});
  return s+'</svg>';
}
/* Diagrama de la regla de las diagonales */
function diagonalSVG(){
  const rows=[['1s'],['2s','2p'],['3s','3p','3d'],['4s','4p','4d','4f'],['5s','5p','5d'],['6s','6p'],['7s']];
  const cw=50,rh=34,W=4*cw+30,H=rows.length*rh+16;
  let s=`<svg viewBox="0 0 ${W} ${H}" width="${W}" role="img" aria-label="Regla de las diagonales: 1s 2s 2p 3s 3p 4s 3d 4p 5s 4d 5p 6s">`;
  // flechas diagonales
  for(let d=0;d<8;d++){let pts=[];rows.forEach((r,i)=>r.forEach((x,j)=>{if(i+j===d)pts.push([16+j*cw+18,12+i*rh+12])}));
    if(pts.length>1){const a=pts[0],b=pts[pts.length-1];s+=`<line x1="${a[0]+12}" y1="${a[1]-10}" x2="${b[0]-10}" y2="${b[1]+8}" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#ah)"/>`}}

  rows.forEach((r,i)=>r.forEach((x,j)=>{const col={s:'--bs',p:'--bp',d:'--bd',f:'--bf'}[x[1]];

/* =====================================================================

/* ---- tocar en la tabla ---- */

/* ---- ordenar ---- */

STEPX.order={
  init:()=>({seq:[]}),

/* ---- clasificar ---- */

/* Mini mapa de la tabla con un casillero resaltado (sin colores ni símbolos) */

/* =====================================================================
   PASOS Y DIBUJOS DEL BLOQUE 3
   · dots     puntos de Lewis tocando los lados del símbolo
   · lewis    constructor de estructuras de Lewis (enlaces y pares libres)
   · formula  fórmula escrita con vista previa (H2O → H₂O)

/* ---- Lewis de un átomo o ion ---- */
function lewisDotSVG(sym,d,o={}){
  const W=o.w||120,c=W/2,fs=sym.length>1?34:40,off=8,R=30;
  let s=`<svg viewBox="0 0 ${W} ${W}" width="${o.size||W}" role="img" aria-label="${o.aria||`Lewis de ${sym}: ${d.t+d.r+d.b+d.l} puntos`}">`;
  s+=`<text x="${c}" y="${c+fs*0.36}" text-anchor="middle" font-family="var(--f-mono)" font-weight="600" font-size="${fs}" fill="var(--ink)">${sym}</text>`;
  const dot=(x,y)=>o.mark==='x'?`<path d="M${x-4} ${y-4}l8 8M${x+4} ${y-4}l-8 8" stroke="var(--ink)" stroke-width="2.4" stroke-linecap="round"/>`:`<circle cx="${x}" cy="${y}" r="4.6" fill="var(--ink)"/>`;
  const side=(n,ax,ay,px,py)=>{if(n===1)return dot(ax,ay);if(n===2)return dot(ax-px*off,ay-py*off)+dot(ax+px*off,ay+py*off);return ''};
  s+=side(d.t,c,c-R,1,0)+side(d.b,c,c+R,1,0)+side(d.l,c-R-(sym.length>1?8:0),c,0,1)+side(d.r,c+R+(sym.length>1?8:0),c,0,1);
  if(o.q)s+=`<text x="${c+40}" y="${c-30}" font-family="var(--f-mono)" font-weight="700" font-size="20" fill="var(--ink)">${chargeTxtFull(o.q)}</text>`;
  return s+'</svg>';
}
/* reparte v puntos: primero uno por lado, después pares */
function dotsFor(v){const d={t:0,r:0,b:0,l:0},o=['t','r','b','l'];for(let k=0;k<v;k++){d[o[k%4]]++}return d}
STEPX.dots={
  init:s=>({d:{t:0,r:0,b:0,l:0}}),

    return `<div class="dboard">${lewisDotSVG(s.sym,d,{size:180,w:120})}${B('t','de arriba')}${B('r','derecho')}${B('b','de abajo')}${B('l','izquierdo')}</div><div class="counter">Pusiste ${sum} punto${sum===1?'':'s'}. Toca un lado para agregar; al tercer toque se vacía.</div>`},
  click(b,s,ps){const k=b.dataset.side;ps.st0.d[k]=(ps.st0.d[k]+1)%3}

function dotsStep(q,sym,o={}){const e=BY[sym],v=valE(sym);
  const tt=[];if(v>=2&&v<=6){const d=v<=4?{t:2,r:v-2,b:0,l:0}:{t:2,r:2,b:2,l:v-6};if(v===5)Object.assign(d,{t:2,r:2,b:1,l:0});tt.push({raw:d,msg:'Primero va un punto por lado; después se forman los pares.'})}
  if(e.Z<=8&&e.Z!==v)tt.push({raw:dotsFor(e.Z),msg:'Usaste todos los electrones. En Lewis solo van los de valencia.'});
  return Object.assign({type:'dots',q,sym,v,Z:e.Z,name:e.name,ans:dotsFor(v)},o,{testTraps:tt});
}

/* ---- Lewis de moléculas ---- */
const LDIR={up:[0,-1],right:[1,0],down:[0,1],left:[-1,0],ur:[.72,-.72],dr:[.72,.72],dl:[-.72,.72],ul:[-.72,-.72]};
function lewisGeom(mol){const cols=Math.max(...mol.a.map(x=>x[1]))+1,rows=Math.max(...mol.a.map(x=>x[2]))+1;const cell=84;
  return{W:cols*cell,H:rows*cell,pos:mol.a.map(x=>[x[1]*cell+cell/2,x[2]*cell+cell/2]),cell}}
function lewisSVG(key,st,o={}){
  const mol=LEWIS[key],g=lewisGeom(mol);
  let s=`<svg viewBox="0 0 ${g.W} ${g.H}" width="100%" role="img" aria-label="${o.aria||`Estructura de Lewis de ${key}`}" style="display:block">`;
  mol.b.forEach(([i,j],k)=>{const n=st.b[k];const [x1,y1]=g.pos[i],[x2,y2]=g.pos[j];const dx=x2-x1,dy=y2-y1,L=Math.hypot(dx,dy),ux=dx/L,uy=dy/L,px=-uy,py=ux;const sh=19;
    const ax=x1+ux*sh,ay=y1+uy*sh,bx=x2-ux*sh,by=y2-uy*sh;
    if(!n){if(o.ghost)s+=`<line x1="${ax}" y1="${ay}" x2="${bx}" y2="${by}" stroke="var(--line)" stroke-width="2" stroke-dasharray="4 5"/>`;return}
    for(let m=0;m<n;m++){const off=(m-(n-1)/2)*8;s+=`<line x1="${ax+px*off}" y1="${ay+py*off}" x2="${bx+px*off}" y2="${by+py*off}" stroke="var(--ink)" stroke-width="3.2" stroke-linecap="round"/>`}});
  mol.a.forEach(([sym],i)=>{const [x,y]=g.pos[i];
    s+=`<text x="${x}" y="${y+9}" text-anchor="middle" font-family="var(--f-mono)" font-weight="600" font-size="26" fill="var(--ink)">${sym}</text>`;
    const used=new Set();mol.b.forEach(([a,b])=>{if(a!==i&&b!==i)return;const [ox,oy]=g.pos[a===i?b:a];const dx=Math.sign(ox-x),dy=Math.sign(oy-y);used.add(dx===1?'right':dx===-1?'left':dy===1?'down':'up')});
    const dirs=['up','down','left','right','ul','ur','dl','dr'].filter(d=>!used.has(d));
    for(let k=0;k<st.lp[i]&&k<dirs.length;k++){const [vx,vy]=LDIR[dirs[k]];const r=sym.length>1?27:22;const cx=x+vx*r,cy=y+vy*r;const ppx=-vy,ppy=vx;
      s+=`<circle cx="${cx+ppx*5}" cy="${cy+ppy*5}" r="3.6" fill="var(--ink)"/><circle cx="${cx-ppx*5}" cy="${cy-ppy*5}" r="3.6" fill="var(--ink)"/>`}
    if(o.badges){const n=lewisAround(mol,st)[i],need=sym==='H'?2:8,ok=n===need;s+=`<text x="${x+24}" y="${y+34}" text-anchor="middle" font-family="var(--f-mono)" font-size="12" font-weight="700" fill="var(${ok?'--ok':'--bad'})">${n}${ok?'✓':'✗'}</text>`}
  });
  return s+'</svg>';
}
/* tablero interactivo: botones sobre los enlaces y sobre los átomos */
function lewisBoardHTML(key,st,o){
  const mol=LEWIS[key],g=lewisGeom(mol);const at=o.attr||'';
  let h=`<div class="lboard" style="max-width:${Math.round(g.W*1.25)}px">${lewisSVG(key,st,{ghost:true,badges:o.badges})}`;
  mol.b.forEach(([i,j],k)=>{const [x1,y1]=g.pos[i],[x2,y2]=g.pos[j];const n=st.b[k];
    h+=`<button type="button" class="lbtn lb" style="left:${((x1+x2)/2/g.W*100).toFixed(2)}%;top:${((y1+y2)/2/g.H*100).toFixed(2)}%" ${at} data-lb="${k}" id="${o.id}_b${k}" aria-label="Enlace ${mol.a[i][0]}–${mol.a[j][0]}: ${['ninguno','simple','doble','triple'][n]}. Toca para cambiarlo"></button>`});
  mol.a.forEach(([sym],i)=>{const [x,y]=g.pos[i];h+=`<button type="button" class="lbtn la" style="left:${(x/g.W*100).toFixed(2)}%;top:${(y/g.H*100).toFixed(2)}%" ${at} data-la="${i}" id="${o.id}_a${i}" aria-label="${sym}: ${st.lp[i]} pares libres. Toca para agregar uno"></button>`});
  return h+'</div>';
}
function lewisCheck(key,st){
  const mol=LEWIS[key],total=lewisTotal(key),used=lewisUsed(mol,st),ar=lewisAround(mol,st);
  if(mol.b.every((b,k)=>st.b[k]===b[2])&&mol.lp.every((x,k)=>st.lp[k]===x))return{ok:true};
  const hBad=mol.a.findIndex((x,i)=>x[0]==='H'&&(ar[i]-2*st.lp[i])>2);
  if(hBad>=0)return{ok:false,msg:'El H solo puede formar un enlace (2 electrones).',trap:true};
  if(mol.a.some((x,i)=>x[0]==='H'&&st.lp[i]>0))return{ok:false,msg:'El H no lleva pares libres: con un enlace ya tiene sus 2 electrones.',trap:true};
  if(used!==total)return{ok:false,msg:`Usaste ${used} electrones y la molécula tiene ${total}.`,trap:true};
  const bad=mol.a.findIndex((x,i)=>ar[i]!==(x[0]==='H'?2:8));
  if(bad>=0){const sy=mol.a[bad][0];return{ok:false,msg:sy==='H'?'Cada H necesita un enlace.':`El ${sy} tiene ${ar[bad]} electrones alrededor: necesita 8. ${ar[bad]<8&&st.lp[bad]===0?'Prueba con un enlace múltiple.':''}`.trim(),trap:true}}
  return{ok:false,msg:'Cumple el octeto, pero no es la estructura más estable: reparte los enlaces de forma pareja.',trap:true};

  init:s=>({b:LEWIS[s.mol].b.map(()=>0),lp:LEWIS[s.mol].a.map(()=>0)}),

  read:ps=>({b:ps.st0.b.slice(),lp:ps.st0.lp.slice()}),
  html(s,ps,i){const mol=LEWIS[s.mol];return `${lewisBoardHTML(s.mol,ps.st0,{attr:`data-xi="${i}"`,id:'x'+i})}<div class="counter">Usaste ${lewisUsed(mol,ps.st0)} de ${lewisTotal(s.mol)} electrones · toca un enlace para cambiarlo y un átomo para agregarle un par</div>`},
  click(b,s,ps){if(b.dataset.lb!=null){const k=+b.dataset.lb;ps.st0.b[k]=(ps.st0.b[k]+1)%4}else if(b.dataset.la!=null){const k=+b.dataset.la;ps.st0.lp[k]=(ps.st0.lp[k]+1)%5}}

function lewisStep(q,mol,o={}){
  const M=LEWIS[mol],ans=STEPX.lewis.raw({mol});const tt=[];
  const hi=M.b.findIndex(b=>M.a[b[0]][0]==='H'||M.a[b[1]][0]==='H');

/* ---- fórmula escrita ---- */
function formulaStep(q,f,o={}){
  const traps=(o.traps||[]).filter(t=>t&&normF(t.f)!==normF(f));const seen=new Set();const ts=[];for(const t of traps){if(seen.has(t.f))continue;seen.add(t.f);ts.push(t)}
  const tt=ts.map(t=>({raw:t.f,msg:t.msg}));if(o.ionic)tt.push({raw:f+'+','msg':'Las cargas no se escriben en la fórmula: el compuesto es neutro.'});

STEPX.formula={
  init:()=>({val:''}),

      if(sameComp(c,s.comp)){if(s.f.includes('(')&&!v.includes('('))return{ok:false,msg:'Los iones poliatómicos van juntos y, si hay más de uno, entre paréntesis.',trap:true};return{ok:false,msg:'Casi: primero va el catión y después el anión, con cada ion junto.',near:true}}}
    else if(sameComp(c,s.comp))return{ok:true};
    for(const t of s.traps||[]){let tc;try{tc=parseFormula(t.f)}catch(e){continue}if(sameComp(c,tc))return{ok:false,msg:t.msg,trap:true}}
    return{ok:false}},
  raw:s=>s.f,
  fmt:s=>`<span class="mono" style="font-size:20px">${fh(s.f)}</span>`,
  read:ps=>ps.st0.val,
  html(s,ps,i){return `<div class="inrow"><div class="inbox"><input data-xin="${i}" id="x${i}_in" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Fórmula" placeholder="ej.: H2O" value="${esc(ps.st0.val)}"></div></div><div class="fprev" aria-live="polite">Se ve así: <span class="mono" id="fp${i}">${ps.st0.val?fh(esc(normF(ps.st0.val))):'—'}</span></div>`},
  click(){},
  input(ps,v,i){ps.st0.val=v;const p=document.getElementById('fp'+i);if(p)p.innerHTML=v?fh(esc(normF(v))):'—'}
};

/* ---- regla de ΔEN ---- */
function bondType(a,b){
  const ka=kindOf(a.s),kb=kindOf(b.s);if(ka==='m'&&kb==='m')return'met';
  const d=dEN(a,b);return d<=CONFIG.umbralApolar?'apo':d<CONFIG.umbralIonico?'pol':'ion';
}
const BTN={apo:'covalente apolar',pol:'covalente polar',ion:'iónico',met:'metálico'};
function rulerSVG(d){
  const W=320,x0=14,x1=W-14,sc=v=>x0+(x1-x0)*v/3.3,a=CONFIG.umbralApolar,i=CONFIG.umbralIonico;
  let s=`<svg viewBox="0 0 ${W} 86" width="${W}" role="img" aria-label="Regla de ΔEN: apolar hasta ${dec(a)}, polar hasta ${dec(i)}, iónico desde ${dec(i)}${d!=null?`; marcado ${dec(d.toFixed(1))}`:''}">`;
  s+=`<rect x="${sc(0)}" y="22" width="${sc(a)-sc(0)}" height="26" fill="var(--bz-a)"/><rect x="${sc(a)}" y="22" width="${sc(i)-sc(a)}" height="26" fill="var(--bz-p)"/><rect x="${sc(i)}" y="22" width="${sc(3.3)-sc(i)}" height="26" fill="var(--bz-i)"/>`;
  s+=`<text x="${(sc(0)+sc(a))/2}" y="16" text-anchor="middle" font-size="11" font-weight="600" fill="var(--ink)">apolar</text><text x="${(sc(a)+sc(i))/2}" y="16" text-anchor="middle" font-size="11" font-weight="600" fill="var(--ink)">covalente polar</text><text x="${(sc(i)+sc(3.3))/2}" y="16" text-anchor="middle" font-size="11" font-weight="600" fill="var(--ink)">iónico</text>`;
  [0,a,i,3.3].forEach(v=>{s+=`<line x1="${sc(v)}" y1="22" x2="${sc(v)}" y2="54" stroke="var(--ink)" stroke-width="1.2"/><text x="${sc(v)}" y="68" text-anchor="middle" font-family="var(--f-mono)" font-size="11" fill="var(--muted)">${dec(v)}</text>`});
  if(d!=null){const x=sc(Math.min(d,3.3));s+=`<path d="M${x} 50l-7 12h14z" fill="var(--ink)"/><text x="${x}" y="82" text-anchor="middle" font-family="var(--f-mono)" font-size="12" font-weight="700" fill="var(--ink)">${dec(d.toFixed(1))}</text>`}
  return s+'</svg>';
}

/* =====================================================================
   BLOQUE 1 · EL ÁTOMO POR DENTRO
   ===================================================================== */
const X=(step,props)=>Object.assign(step,props);

const elWrong=(Z,msg)=>Z>=1&&Z<=118&&Number.isInteger(Z)?{t:elOpt(Z),msg}:null;

/* ---------- Unidad 1 · Partículas del átomo ---------- */
function genPart(lvl){
  if(lvl===1){
    if(Math.random()<0.6){
      const Z=ri(1,10),e=EL[Z],isos=ISOTOPES[e.s];let A=COMMON_A[e.s];if(isos&&Math.random()<0.3)A=pick(isos);const n=A-Z;
      const steps=[
        X(pillStep('¿Cuántos <span class="tp">protones (p⁺)</span> hay en el núcleo?',Z,[{v:n,msg:'Esos son los neutrones (n⁰): no tienen carga.'},{v:A,msg:'Contaste todo el núcleo. Los protones son solo los que tienen +.'}]),{hint:'Cuenta las bolitas naranjas con + del centro.',ex:`p⁺ = <b>${Z}</b>`}),
        X(pillStep('¿Cuántos <span class="tn">neutrones (n⁰)</span>?',n,[{v:A,msg:'Ese es A: protones y neutrones juntos.'},{v:Z,msg:'Esos son los protones. Los neutrones son los grises, sin signo.'}]),{hint:'Cuenta las bolitas grises, sin signo.',ex:`n⁰ = <b>${n}</b>`}),
        X(pillStep('¿Cuántos <span class="te">electrones (e⁻)</span> giran alrededor?',Z,[{v:n,msg:'Esos son los neutrones. Los electrones están afuera, en las órbitas.'},{v:A,msg:'Ese es A. Los electrones son las bolitas azules de afuera.'}]),{hint:'Cuenta las bolitas azules de las órbitas.',ex:`e⁻ = <b>${Z}</b>`}),
        X(choiceStep('¿Qué elemento es?',elOpt(Z),[elWrong(n,'Ese tiene Z igual a los neutrones. El elemento lo dan los protones.'),elWrong(A,'Usaste A. El elemento lo da Z, la cantidad de protones.'),elWrong(Z+1,zMsg(Z+1)+' Cuenta otra vez los p⁺.'),elWrong(Z-1,zMsg(Z-1)+' Cuenta otra vez los p⁺.'),elWrong(Z+2,zMsg(Z+2))]),{key:true,hint:`Z = número de protones. Busca el ${Z} en la tabla.`,ex:`Z = ${Z}: es el <b>${e.name}</b>.`})
      ];
      return{text:'Mira el átomo y cuenta sus partículas.',vis:atomSVG(Z,n,Z,{size:260}),steps,els:[Z],sol:solLine(e.s,A,Z)};
    }
    const Z=ri(1,30),e=EL[Z];
    const am=Object.keys(COMMON_A).map(s=>BY[s]).find(x=>COMMON_A[x.s]===Z&&x.Z!==Z);
    const steps=[
      X(choiceStep('¿Qué cuenta el número atómico Z?','los <span class="tp">protones (p⁺)</span>',[{t:'los <span class="tn">neutrones (n⁰)</span>',msg:'Los neutrones no definen el elemento. Z cuenta los protones.'},{t:'los protones y los neutrones',msg:'Eso es A, el número másico.'},{t:'los electrones del último nivel',msg:'Z cuenta los protones del núcleo.'}]),{hint:'Z es el número de arriba en cada casillero de la tabla.',ex:'Z = cantidad de protones.'}),
      X(choiceStep(`¿Qué elemento tiene Z = ${Z}?`,elOpt(Z),[am?{t:elOpt(am.Z),msg:`El ${am.name} tiene A = ${Z}, pero su Z es ${am.Z}. Fíjate en Z, no en A.`}:null,elWrong(Z+1,zMsg(Z+1)),elWrong(Z-1,zMsg(Z-1)),elWrong(Z+2,zMsg(Z+2)),elWrong(Z-2,zMsg(Z-2))]),{key:true,hint:`Busca en la tabla el casillero con el número ${Z}.`,ex:`Z = ${Z}: <b>${e.name}</b> (${e.s}).`})
    ];
    return{text:'De Z al elemento.',vp:VP(chip('Z',Z,'c-p'),AR,askChip('elemento')),steps,els:[Z],sol:`<p style="margin:0">Z = ${Z} → <b>${e.name}</b>, con ${Z} protones.</p>`};
  }
  if(lvl===2){

        {k:'Z',v:A,msg:'Z no es A. Z es el número de protones: búscalo en la tabla.'},{k:'p',v:A,msg:'Los protones son Z, no A.'},{k:'p',v:n,msg:'Esos son los neutrones. Los protones son Z.'},{k:'e',v:n,msg:'En el átomo neutro, e⁻ = p⁺ (no n⁰).'},{k:'e',v:A,msg:'En el átomo neutro, e⁻ = p⁺ = Z.'}];
      const steps=[

        numStep('Electrones del átomo neutro',Z,{traps:[{v:n,msg:'En el átomo neutro, e⁻ = p⁺.'},{v:A,msg:'En el átomo neutro, e⁻ = p⁺.'}],hint:'Neutro: tantos e⁻ como p⁺.',ex:`e⁻ = p⁺ = <b>${Z}</b>`}),
        fieldsStep('Completa el átomo neutro.',[fld('Z'),fld('A',A),fld('p'),fld('n'),fld('e')],{Z,A,p:Z,n,e:Z},traps,{key:true,direct:true,ex:`Z = p⁺ = e⁻ = ${Z} · n⁰ = ${A} − ${Z} = ${n}`})
      ];
      return{text:'Completa los datos del átomo neutro.',vp:VP(show,AR,askChip('Z, p⁺, n⁰, e⁻')),steps,els:[Z],sol:solLine(e.s,A,Z)};
    }
    const Z=ri(2,12),e=EL[Z],A=COMMON_A[e.s],n=A-Z;
    const steps=[
      numStep(`Protones (p⁺) del ${e.name}`,Z,{traps:[{v:A,msg:'Ese es A. Los protones son Z.'}],hint:'Z en la tabla.',ex:`p⁺ = <b>${Z}</b>`}),
      numStep('Neutrones: n⁰ = A − Z',n,{traps:[{v:A,msg:'Te faltó restar Z.'}],hint:`${A} − ${Z}`,ex:`${A} − ${Z} = <b>${n}</b>`}),
      numStep('Electrones del átomo neutro',Z,{traps:[{v:n,msg:'En el átomo neutro, e⁻ = p⁺.'}],hint:'Tantos e⁻ como p⁺.',ex:`e⁻ = <b>${Z}</b>`}),
      buildStep(`Arma el átomo de ${nucHTML(e.s,A,null)}.`,[{k:'p',label:'p⁺',cls:'c-p',min:0,max:30},{k:'n',label:'n⁰',cls:'c-n',min:0,max:30},{k:'e',label:'e⁻',cls:'c-e',min:0,max:30}],{p:Z,n,e:Z},{
        key:true,direct:true,viz:'atom',
        traps:[{vals:{p:Z,n:A,e:Z},msg:'Pusiste A neutrones. Los neutrones son A − Z.'},{vals:{p:n,n:Z,e:n},msg:'Cambiaste protones por neutrones. Los protones son Z.'},{vals:{p:Z,n,e:0},msg:'Faltan los electrones: en el átomo neutro hay tantos e⁻ como p⁺.'}],
        rule:v=>v.p!==Z?(v.p>=1?`Con ${v.p} protones sería ${EL[v.p].name}. Revisa Z en la tabla.`:'Sin protones no hay elemento. Revisa Z en la tabla.'):v.e!==v.p?'En un átomo neutro, e⁻ = p⁺.':'Revisa los neutrones: n⁰ = A − Z.',
        counter:v=>`A = p⁺ + n⁰ = ${v.p+v.n}`,ansTxt:`${Z} p⁺ · ${n} n⁰ · ${Z} e⁻`,ex:`${Z} p⁺ · ${A} − ${Z} = ${n} n⁰ · ${Z} e⁻`})
    ];
    return{text:'Arma el átomo con − y +.',steps,els:[Z],sol:solLine(e.s,A,Z)};
  }
  if(Math.random()<0.5){
    const Z=pick(zWithA(3,56)),e=EL[Z],A=COMMON_A[e.s],n=A-Z;
    const steps=[
      numStep('Z = A − n⁰',Z,{traps:[{v:A,msg:'Ese es A. Z = A − n⁰.'},{v:A+n,msg:'Se resta: Z = A − n⁰.'},{v:n,msg:'Ese es n⁰. Z = A − n⁰.'}],hint:`${A} − ${n}`,ex:`${A} − ${n} = <b>${Z}</b>`}),
      fieldsStep('Completa:',[fld('Z'),fld('p'),fld('e')],{Z,p:Z,e:Z},[{k:'Z',v:A,msg:'Z no es A: como A = Z + n⁰, Z = A − n⁰.'},{k:'Z',v:A+n,msg:'Se resta: Z = A − n⁰.'},{k:'Z',v:n,msg:'Ese es n⁰. Z = A − n⁰.'},{k:'p',v:n,msg:'Esos son los neutrones. Los protones son Z.'},{k:'p',v:A,msg:'Los protones son Z = A − n⁰.'},{k:'e',v:n,msg:'En el átomo neutro, e⁻ = p⁺.'},{k:'e',v:A,msg:'En el átomo neutro, e⁻ = p⁺.'}],{key:true,direct:true,ex:`Z = ${A} − ${n} = ${Z}`}),
      X(choiceStep('¿Qué elemento es?',elOpt(Z),[elWrong(n,'Ese tiene Z igual a los neutrones. El elemento lo dan los protones.'),elWrong(A,'Usaste A. El elemento lo da Z.'),elWrong(Z+1,zMsg(Z+1)),elWrong(Z-1,zMsg(Z-1)),elWrong(Z+2,zMsg(Z+2))]),{key:true,hint:`Busca Z = ${Z} en la tabla.`,ex:`Z = ${Z}: <b>${e.name}</b>`}),
      numStep('Electrones del átomo neutro',Z,{traps:[{v:n,msg:'En el átomo neutro, e⁻ = p⁺.'},{v:A,msg:'En el átomo neutro, e⁻ = p⁺.'}],hint:'Tantos como protones.',ex:`e⁻ = <b>${Z}</b>`})
    ];
    return{text:'Descubre el átomo con dos datos.',vp:VP(chip('A',A,'c-ink'),chip('n⁰',n,'c-n'),AR,askChip('Z, p⁺, e⁻ y elemento')),steps,els:[Z],sol:solLine(e.s,A,Z)};
  }
  const L3=[['Cl',37],['Cu',65],['Br',81],['C',14],['H',2],['H',3],['O',18],['Mg',26],['Fe',54],['Li',6],['B',10],['K',40],['Ag',109],['Zn',66],['U',235],['Pb',206]];

/* ---------- Unidad 2 · Isótopos ---------- */
const ISOBARS=[[['C',14],['N',14]],[['Ar',40],['Ca',40]],[['Ar',40],['K',40]],[['K',40],['Ca',40]],[['H',3],['He',3]],[['S',36],['Ar',36]]];
const isoShow=(x,asName)=>asName?`<span class="q c-ink"><b>${BY[x[0]].name}-${x[1]}</b></span>`:big(nucHTML(x[0],x[1],BY[x[0]].Z));
function genIso(lvl){
  if(lvl===1){
    const r=Math.random();let a,b;
    if(r<0.5){const s=pick(Object.keys(ISOTOPES));const [x,y]=shuffle(ISOTOPES[s]);a=[s,x];b=[s,y]}
    else if(r<0.8){[a,b]=shuffle(pick(ISOBARS))}
    else{const [s1,s2]=shuffle(Object.keys(ISOTOPES)).slice(0,2);a=[s1,pick(ISOTOPES[s1])];b=[s2,pick(ISOTOPES[s2])]}
    const Za=BY[a[0]].Z,Zb=BY[b[0]].Z,same=Za===Zb,sameA=a[1]===b[1];
    const byTxt=(x,y)=>strip(x.t).localeCompare(strip(y.t));
    const s1=X(choiceStep('¿Tienen el mismo Z (los mismos protones)?',same?'Sí, el mismo Z':'No, distinto Z',[{t:same?'No, distinto Z':'Sí, el mismo Z',msg:same?`Los dos son ${BY[a[0]].name}: Z = ${Za}.`:`Uno tiene Z = ${Za} y el otro, Z = ${Zb}.`}],{sort:byTxt,row:true}),{hint:'Z es el número de abajo, a la izquierda del símbolo (o búscalo en la tabla).',ex:`Z: ${Za} y ${Zb}`});
    let s2;
    if(same)s2=choiceStep('¿Son isótopos?','Sí: mismo Z, distinto A',[{t:'No: tienen distinto A',msg:'Los isótopos tienen justamente distinto A: cambian los neutrones.'},{t:'No: tienen distinto número de protones',msg:'Mira Z: es el mismo. Entre isótopos, los protones no cambian.'}]);
    else if(sameA)s2=choiceStep('¿Son isótopos?','No: tienen distinto Z',[{t:'Sí: tienen el mismo A',msg:'Igual A no alcanza: con distinto Z son elementos distintos.'},{t:'Sí: mismo Z, distinto A',msg:`Mira bien Z: ${Za} y ${Zb}.`}]);
    else s2=choiceStep('¿Son isótopos?','No: tienen distinto Z',[{t:'Sí: tienen distinto A',msg:'Distinto A no alcanza: también tienen que tener el mismo Z.'},{t:'Sí: mismo Z, distinto A',msg:`Mira bien Z: ${Za} y ${Zb}.`}]);
    X(s2,{key:true,hint:'Isótopos = mismo Z (mismo elemento) y distinto número de neutrones.',ex:same?'Mismo Z, distinto A: <b>isótopos</b>.':'Distinto Z: son <b>elementos distintos</b>.'});
    return{text:'¿Son isótopos?',vp:VP(isoShow(a,false),'<span class="vpa">y</span>',isoShow(b,Math.random()<0.3)),steps:[s1,s2],els:uniq([Za,Zb]),
      sol:`<p style="margin:0">${nucHTML(a[0],a[1],Za)}: ${Za} p⁺, ${a[1]-Za} n⁰ · ${nucHTML(b[0],b[1],Zb)}: ${Zb} p⁺, ${b[1]-Zb} n⁰</p>`};
  }
  if(lvl===2){
    if(Math.random()<0.55){
      const s=pick(Object.keys(ISOTOPES)),A=pick(ISOTOPES[s]),e=BY[s],Z=e.Z,n=A-Z;
      const show=Math.random()<0.5?isoShow([s,A],true):big(nucHTML(s,A,null));
      const steps=[
        numStep(`Protones del ${e.name} (Z en la tabla)`,Z,{traps:[{v:A,msg:'Ese es A. Z está en la tabla.'},{v:n,msg:'Esos son los neutrones.'}],hint:'Todos los isótopos de un elemento tienen el mismo Z.',ex:`p⁺ = <b>${Z}</b>`}),
        numStep('Neutrones: n⁰ = A − Z',n,{traps:[{v:A,msg:'Falta restar Z.'},{v:Z,msg:'Esos son los protones.'}],hint:`${A} − ${Z}`,ex:`${A} − ${Z} = <b>${n}</b>`}),
        fieldsStep('Protones y neutrones:',[fld('p'),fld('n')],{p:Z,n},[{k:'p',v:n,msg:'Cambiaste p⁺ y n⁰. Los protones son Z y no cambian entre isótopos.'},{k:'p',v:A,msg:'Los protones son Z, no A.'},{k:'n',v:A,msg:'n⁰ = A − Z: falta restar los protones.'},{k:'n',v:Z,msg:'Esos son los protones. n⁰ = A − Z.'},{k:'n',v:A+Z,msg:'Se resta: n⁰ = A − Z.'}],{key:true,direct:true,ex:`p⁺ = ${Z} · n⁰ = ${A} − ${Z} = ${n}`})
      ];
      return{text:'¿Cuántos protones y neutrones tiene?',vp:VP(show,AR,askChip('p⁺ y n⁰')),steps,els:[Z],sol:solLine(s,A,Z)};
    }
    const s=pick(Object.keys(ISOTOPES)),[A1,A2]=shuffle(ISOTOPES[s]).slice(0,2).sort((a,b)=>a-b),e=BY[s],Z=e.Z,n1=A1-Z,n2=A2-Z;
    const fs=[{k:'n1',label:`n⁰ en ${s}-${A1}`,cls:'c-n'},{k:'n2',label:`n⁰ en ${s}-${A2}`,cls:'c-n'}];
    const steps=[
      numStep(`Z del ${e.name}`,Z,{traps:[{v:A1,msg:'Ese es A. Z está en la tabla.'}],hint:'Los dos isótopos tienen el mismo Z.',ex:`Z = <b>${Z}</b>`}),

/* errores al repartir electrones en los niveles 1 a 3 */
function shellRule(N,who){return vv=>{const a=[vv.s1||0,vv.s2||0,vv.s3||0],sum=a.reduce((x,y)=>x+y,0);

  for(let i=0;i<2;i++)if(a[i+1]>0&&a[i]<(i===0?2:8))return 'Llena cada nivel antes de pasar al siguiente.';
  if(a[2]>8)return 'Hasta el argón, el nivel 3 no tiene más de 8.';return null}}

const cellAt=(g,p)=>EL.find(e=>e&&e.g===g&&e.p===p&&e.known)||null;
const REP=EL.filter(e=>e&&(e.b==='s'||e.b==='p')&&e.Z<=56);
/* Grupo como opción (respeta CONFIG.grupos) */
function groupStep(q,g,traps,o={}){
  const ws=[];const seen=new Set([groupLabel(g)]);
  for(const t of traps){if(t.g==null||t.g<1||t.g>18)continue;const l=groupLabel(t.g);if(seen.has(l))continue;seen.add(l);ws.push({t:l,msg:t.msg,g:t.g})}
  for(const d of [1,-1,2,-2,10,-10]){if(ws.length>=3)break;const x=g+d;if(x<1||x>18)continue;const l=groupLabel(x);if(seen.has(l))continue;seen.add(l);ws.push({t:l,g:x})}
  const gv=t=>{const w=ws.find(x=>x.t===strip(t));return w?w.g:g};
  return choiceStep(q,groupLabel(g),ws,Object.assign({row:true,sort:(a,b)=>gv(a.t)-gv(b.t)},o));
}
const roman=()=>CONFIG.grupos==='romanos';
const plus10=()=>roman()?'Los grupos 13 a 18 son los grupos A: grupo = electrones de valencia + A.':'En los grupos 13 a 18, grupo = electrones de valencia + 10.';

/* ---------- Unidad 5 · Grupo y período ---------- */
function genGP(lvl){
  if(lvl===1){
    const pool=Math.random()<0.7?REP.filter(x=>x.p<=5&&x.Z>2):EL.filter(x=>x&&x.b==='d'&&x.p<=5);
    const e=pick(pool),inv=cellAt(e.p,e.g);
    const traps=[];
    if(inv&&inv.Z!==e.Z)traps.push({z:inv.Z,msg:`Invertiste: ese es el del grupo ${groupLabel(inv.g)}, período ${inv.p}. El grupo es la columna y el período es la fila.`});
    for(const d of [1,-1]){const a=cellAt(e.g,e.p+d);if(a)traps.push({z:a.Z,msg:`Ese está en el período ${a.p}. Los períodos son las filas: cuenta desde arriba.`});
      const b=cellAt(e.g+d,e.p);if(b)traps.push({z:b.Z,msg:`Ese está en el grupo ${groupLabel(b.g)}. Los grupos son las columnas: cuenta desde la izquierda.`})}
    const steps=[
      X(choiceStep('Los períodos de la tabla son…','las filas (horizontales)',[{t:'las columnas (verticales)',msg:'Las columnas son los grupos. Los períodos son las filas.'}],{row:false,sort:(a,b)=>strip(a.t).localeCompare(strip(b.t))}),{hint:'Período = fila. Grupo = columna.',ex:'Período = fila.'}),
      X(tapStep(`Toca el elemento del grupo ${groupLabel(e.g)}, período ${e.p}.`,e.Z,{traps,key:true,hint:`Baja hasta la fila ${e.p} y busca la columna ${groupLabel(e.g)}.`,ex:`Grupo ${groupLabel(e.g)}, período ${e.p}: <b>${e.name}</b>`}))
    ];
    return{text:'Ubica el elemento en la tabla.',vp:VP(chip('grupo',groupLabel(e.g),'c-ink'),chip('período',e.p,'c-ink'),AR,askChip('elemento')),steps,els:[e.Z],hideTable:true,sol:`<p style="margin:0">Columna ${groupLabel(e.g)}, fila ${e.p} → <b>${e.s}</b> (${e.name}).</p>`};
  }
  if(lvl===2){
    const pool=REP.filter(x=>x.Z>=3&&x.Z<=CONFIG.zMaxNiveles&&x.cat!=='gno');
    const e=pick(pool),sh=shellsZ(e.Z),v=sh[sh.length-1],per=sh.length;
    const gTraps=[e.g>=13?{g:roman()?v:v,msg:plus10()}:null,{g:e.Z<=18?e.Z:null,msg:'Ese es el total de electrones. El grupo sale de los de valencia.'},{g:per,msg:'Invertiste: la cantidad de niveles es el período, no el grupo.'}].filter(Boolean);
    const steps=[
      X(pillStep('¿Cuántos electrones de valencia tiene?',v,[{v:e.Z,msg:'Esos son todos. Los de valencia son los del último nivel.'},{v:sh[0],msg:'Los de valencia son los del último nivel.'}]),{hint:'Mira el último número.',ex:`<b>${v}</b>`}),
      X(groupStep('¿En qué grupo está?',e.g,gTraps),{key:true,hint:e.g>=13?plus10():'En los grupos 1 y 2, el grupo es igual a los electrones de valencia.',ex:e.g>=13?(roman()?`${v} de valencia → grupo <b>${groupLabel(e.g)}</b>`:`${v} + 10 = grupo <b>${e.g}</b>`):`Grupo <b>${groupLabel(e.g)}</b>`}),
      X(pillStep('¿En qué período está?',per,[{v,msg:'Ese es el número de electrones del último nivel. El período es la cantidad de niveles.'},{v:e.g<=18&&e.g!==per?e.g:null,msg:'Invertiste: ese es el grupo. El período es la cantidad de niveles.'}]),{key:true,hint:'Cuenta cuántos niveles tiene ocupados.',ex:`${per} niveles → período <b>${per}</b>`})
    ];
    return{text:'Ubícalo con su distribución.',vp:VP(`<span class="q c-e"><b>${sh.join('-')}</b></span>`,AR,askChip('grupo y período')),steps,els:[e.Z],hideTable:true,sol:`<p style="margin:0">${sh.join('-')}: ${per} niveles → período ${per}; ${v} de valencia → grupo ${groupLabel(e.g)}. Es el <b>${e.name}</b>.</p>`};
  }
  // nivel 3: de grupo y período a la distribución
  const pool=REP.filter(x=>x.Z>=3&&x.Z<=CONFIG.zMaxNiveles&&x.cat!=='gno');const e=pick(pool),sh=shellsZ(e.Z),v=sh[sh.length-1],per=sh.length;
  const ans={s1:0,s2:0,s3:0};sh.forEach((k,i)=>ans['s'+(i+1)]=k);

/* ---------- Unidad 6 · Clasificación ---------- */

  if(s==='Br'&&k==='m')return 'El bromo es líquido, pero es un no metal.';
  if(k==='x')return 'Los metaloides son solo seis: B, Si, Ge, As, Sb y Te.';

  return kindOf(s)==='m'?`El ${BY[s].name} está a la izquierda de la escalera: es un metal.`:`El ${BY[s].name} está a la derecha de la escalera: es un no metal.`;
}
function genClas(lvl){

    return{text:'¿Metal, no metal o metaloide?',vp:VP(elTile(e.Z,'lg')),vis:locatorSVG(e.Z),steps,els:[e.Z],hideTable:true,sol:`<p style="margin:0">${s}: <b>${KIND[k].toLowerCase()}</b>.</p>`};
  }
