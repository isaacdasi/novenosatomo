      const cards=uniq([pick(METALS),pick(NONMETALS),pick(METALLOIDS),pick(Math.random()<0.4?['H','Hg','Br']:METALS),pick(NONMETALS.concat(METALS))]).slice(0,5);
      const ans={},msgs={};cards.forEach(s=>{ans[s]=kindOf(s);msgs[s]={};Object.keys(KIND).forEach(k=>{if(k!==ans[s])msgs[s][k]=kindMsg(s,k)})});
      const step=classifyStep('Toca un elemento y después su grupo.',cards.map(s=>({id:s,t:s})),Object.keys(KIND).map(k=>({id:k,t:KIND[k]})),ans,msgs,{key:true,ex:'Metales a la izquierda, no metales arriba a la derecha, metaloides sobre la escalera.'});

    }

      const bins=fams.map(f=>({id:f,t:FAM[f].pl}));const withH=fams.includes('alc')&&Math.random()<0.5;if(withH){cards.push('H');bins.push({id:'otro',t:'Ninguna de estas'})}

        if(s==='H'){msgs[s].alc='El H está en el grupo 1, pero no es un metal alcalino: es un gas no metálico.'}

      const step=classifyStep('Toca un elemento y después su familia.',shuffle(cards).map(s=>({id:s,t:s})),bins,ans,msgs,{key:true,ex:`Alcalinos: grupo ${groupLabel(1)} (sin el H) · alcalinotérreos: ${groupLabel(2)} · halógenos: ${groupLabel(17)} · gases nobles: ${groupLabel(18)}`});
      const hint=X(choiceStep('Los halógenos están en el grupo…',groupLabel(17),[{t:groupLabel(1),msg:'El grupo 1 es el de los alcalinos.'},{t:groupLabel(18),msg:'El 18 es el de los gases nobles.'}],{row:true}),{hint:'Una columna antes de los gases nobles.',ex:`Grupo ${groupLabel(17)}`});
      return{text:'Ordena por familias.',steps:[hint,step],els:cards.map(s=>BY[s].Z),hideTable:true};
    }
    const rep=shuffle(['Na','Cl','Ca','Al','O','K','S','Mg','N','C']).slice(0,2),tr=shuffle(['Fe','Cu','Zn','Ag','Ni','Mn','Cr','Ti','Au']).slice(0,2),inn=shuffle(['Ce','Nd','Eu','Gd','U','Pu','Th']).slice(0,1+(Math.random()<0.5?1:0));

    const step=classifyStep('Toca un elemento y después su grupo.',shuffle(cards).map(s=>({id:s,t:s})),[{id:'rep',t:'Representativo'},{id:'tra',t:'Transición'},{id:'int',t:'Transición interna'}],ans,msgs,{key:true,ex:`Grupos ${groupLabel(1)}, ${groupLabel(2)} y ${groupLabel(13)} a ${groupLabel(18)}: representativos · centro: transición · dos filas de abajo: transición interna.`});
    const hint=X(choiceStep('Los elementos de transición interna están…','en las dos filas de abajo',[{t:'en el centro de la tabla',msg:'En el centro están los de transición.'},{t:'en la última columna',msg:'Ahí están los gases nobles.'}]),{hint:'Lantánidos y actínidos.',ex:'En las dos filas de abajo.'});
    return{text:'Representativo, transición o transición interna.',steps:[hint,step],els:cards.map(s=>BY[s].Z),hideTable:true};
  }
  // nivel 3: pistas → tocar en la tabla
  let clue,ans,traps=[];
  if(Math.random()<0.7){
    const f=pick(Object.keys(FAM));const s=pick(FAM[f].els);const e=BY[s];ans=e.Z;clue=`el ${FAMSHORT[f]} del período ${e.p}`;
    const nb={alc:'alt',alt:'alc',hal:'gno',gno:'hal'}[f];const o=cellAt(FAM[nb].g,e.p);if(o)traps.push({z:o.Z,msg:`Ese es el ${FAMSHORT[nb]} del período ${e.p}.`});

      ['el no metal del grupo 14','C',[['Si','El silicio es un metaloide.'],['N','El nitrógeno está en el grupo 15.']]],['el primer metal de transición (el de menor Z)','Sc',[['Ti','El titanio viene después del escandio.'],['Ca','El calcio es un alcalinotérreo.']]],

/* ---------- Unidad 7 · Propiedades periódicas ---------- */
const PTREND={r:{n:'radio atómico',g:'down',p:'left',why:{g:'Hacia abajo hay más niveles de electrones: el átomo es más grande.',p:'Hacia la derecha hay más protones que atraen a los electrones del mismo nivel: el átomo se achica.'}},
  ie:{n:'energía de ionización',g:'up',p:'right',why:{g:'Arriba los electrones están más cerca del núcleo: cuesta más arrancarlos.',p:'Hacia la derecha hay más protones que sujetan a los electrones.'}},
  en:{n:'electronegatividad',g:'up',p:'right',why:{g:'Los átomos chicos atraen más fuerte los electrones de un enlace.',p:'Más protones en el mismo nivel atraen más a los electrones.'}},
  cm:{n:'carácter metálico',g:'down',p:'left',why:{g:'Abajo los electrones de valencia están más lejos y se pierden con facilidad.',p:'A la izquierda hay pocos electrones de valencia y se pierden fácil.'}}};
const ARROW={up:'↑ hacia arriba',down:'↓ hacia abajo',left:'← hacia la izquierda',right:'→ hacia la derecha'};
/* ¿cuál es mayor según la tendencia? devuelve el elemento */
function trendWinner(k,a,b){const t=PTREND[k];if(a.p===b.p)return (t.p==='right')===(a.g>b.g)?a:b;return (t.g==='down')===(a.p>b.p)?a:b}
function propVal(k,e){return k==='cm'?null:prop(e.s,k)}
/* el dato real coincide con la tendencia y la diferencia no es mínima */
function agrees(k,a,b){
  const w=trendWinner(k,a,b),l=w===a?b:a;
  const keys=k==='cm'?['r','ie']:[k];
  return keys.every(q=>{const vw=prop(w.s,q),vl=prop(l.s,q);if(vw==null||vl==null)return false;const big=q==='ie'&&k==='cm'?vl>vw:vw>vl;const rel=Math.abs(vw-vl)/Math.max(vw,vl);return big&&rel>=(q==='en'?0.03:0.04)});
}
function propPool(k){return REP.filter(e=>e.Z!==1&&prop(e.s,'r')!=null&&prop(e.s,'ie')!=null&&!((k==='en'||k==='cm')&&e.cat==='gno')&&(k!=='en'||e.en!=null))}
function pairFor(k){const pool=propPool(k);for(let t=0;t<400;t++){const a=pick(pool);const same=Math.random()<0.5?'p':'g';const c=pool.filter(b=>b!==a&&(same==='p'?b.p===a.p:b.g===a.g));if(!c.length)continue;const b=pick(c);if(agrees(k,a,b))return[a,b,same]}return null}
function setFor(k,n){const pool=propPool(k);for(let t=0;t<600;t++){const a=pick(pool);const same=Math.random()<0.5?'p':'g';const c=shuffle(pool.filter(b=>b!==a&&(same==='p'?b.p===a.p:b.g===a.g))).slice(0,n-1);if(c.length<n-1)continue;const set=[a,...c];
  let ok=true;for(let i=0;i<set.length&&ok;i++)for(let j=i+1;j<set.length&&ok;j++)if(!agrees(k,set[i],set[j]))ok=false;if(ok)return[set,same]}return null}
const posTxt=e=>`período ${e.p}, grupo ${groupLabel(e.g)}`;
const valTxt=(k,e)=>{if(k==='cm')return '';const v=prop(e.s,k);return `${e.s}: ${k==='en'?fx(v,1):Math.round(v)}${PROPN[k].unit?' '+PROPN[k].unit:''}`};
function arrowStep(q,dir,dims,k,which,o={}){
  const opp={up:'down',down:'up',left:'right',right:'left'};
  return X(choiceStep(q,ARROW[dir],[{t:ARROW[opp[dir]],msg:'Al revés. '+PTREND[k].why[which]}],{row:true,sort:(a,b)=>a.t.localeCompare(b.t)}),Object.assign({ex:PTREND[k].why[which]},o));
}
function genProp(lvl){
  const k=pick(lvl===3?['r','ie','en']:['r','ie','en','cm']),T=PTREND[k];
  if(lvl===1&&Math.random()<0.6){

    const top=set.slice().sort((x,y)=>prop(y.s,kk)-prop(x.s,kk))[0];
    const steps=[
      arrowStep(`En ${same==='p'?'un período':'un grupo'}, ${kk==='r'?'el':'la'} ${T2.n} aumenta…`,same==='p'?T2.p:T2.g,same,kk,same==='p'?'p':'g',{hint:'Recuerda las flechas de la tendencia.'}),
      X(choiceStep(`¿Cuál tiene mayor ${T2.n}?`,elOpt(top.Z),set.filter(e=>e!==top).map(e=>({t:elOpt(e.Z),msg:'Al revés. '+T2.why[same==='p'?'p':'g']}))),{key:true,hint:T2.why[same==='p'?'p':'g'],ex:`<b>${top.name}</b>`})

  }

      arrowStep(`Y en un período, ¿hacia dónde aumenta?`,T.p,'p',k,'p',{key:true,hint:'En un período, hacia la derecha aumentan los protones.'})];
    return{text:`¿Hacia dónde aumenta ${k==='r'||k==='cm'?'el':'la'} ${T.n}?`,vis:trendSVG(null),steps,els:[],sol:`<div class="vis">${trendSVG(k)}</div><p style="margin:0">${T.why.g} ${T.why.p}</p>`};
  }

      sol:`<p style="margin:0">${k==='cm'?`Según la tendencia, gana el <b>${w.name}</b>.`:`Datos: ${valTxt(k,a)} · ${valTxt(k,b)}.`} ${T.why[same==='p'?'p':'g']}</p>`};
  }
  const n=Math.random()<0.5?3:4;const sf=setFor(k,n)||setFor(k,3);const [set,same]=sf;
  const sorted=set.slice().sort((x,y)=>prop(x.s,k)-prop(y.s,k));
  const steps=[
    arrowStep(`En ${same==='p'?'un período':'un grupo'}, ${k==='r'?'el':'la'} ${T.n} aumenta…`,same==='p'?T.p:T.g,same,k,same==='p'?'p':'g',{hint:'Recuerda las flechas de la tendencia.'}),
    orderStep(`Toca de menor a mayor ${T.n}.`,shuffle(set).map(e=>({id:e.s,t:e.s})),sorted.map(e=>e.s),{key:true,lowHigh:['menor','mayor'],revMsg:'Quedó al revés: empieza por el de menor '+T.n+'. '+T.why[same==='p'?'p':'g'],hint:T.why[same==='p'?'p':'g'],ex:sorted.map(e=>valTxt(k,e)).join(' < ')})
  ];
  return{text:`Ordena por ${T.n}.`,vp:VP(...set.map(e=>`<span class="q c-ink"><b>${e.s}</b> · ${same==='p'?'grupo '+groupLabel(e.g):'período '+e.p}</span>`)),steps,els:set.map(e=>e.Z),
    sol:`<p style="margin:0">Datos: ${sorted.map(e=>valTxt(k,e)).join(' · ')}.</p>`};
}
/* Esquema de la tabla con las flechas de tendencia (k null: sin flechas) */
function trendSVG(k){
  const cw=13,ch=11,g=2,ox=26,oy=28;const W=ox+18*(cw+g)+8,H=oy+7*(ch+g)+8;
  let s=`<svg viewBox="0 0 ${W} ${H}" width="${Math.min(W*1.35,340)}" role="img" aria-label="${k?`${PTREND[k].n}: aumenta ${ARROW[PTREND[k].g]} en el grupo y ${ARROW[PTREND[k].p]} en el período`:'Esquema de la tabla periódica'}"><defs><marker id="tah${k||'x'}" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--ink)"/></marker></defs>`;
  for(let z=1;z<=118;z++){const e=EL[z];if(e.b==='f')continue;const x=ox+(e.g-1)*(cw+g),y=oy+(e.p-1)*(ch+g);s+=`<rect x="${x}" y="${y}" width="${cw}" height="${ch}" rx="2" fill="var(--sunk)" stroke="var(--line)"/>`}
  if(k){const T=PTREND[k];const ax1=ox,ax2=ox+18*(cw+g)-g,ay=12;const [hx1,hx2]=T.p==='right'?[ax1,ax2]:[ax2,ax1];
    s+=`<line x1="${hx1}" y1="${ay}" x2="${hx2}" y2="${ay}" stroke="var(--ink)" stroke-width="3" marker-end="url(#tah${k})"/>`;
    const vx=12,vy1=oy,vy2=oy+7*(ch+g)-g;const [y1,y2]=T.g==='down'?[vy1,vy2]:[vy2,vy1];
    s+=`<line x1="${vx}" y1="${y1}" x2="${vx}" y2="${y2}" stroke="var(--ink)" stroke-width="3" marker-end="url(#tah${k})"/>`}
  else{s+=`<text x="${ox}" y="16" font-size="11" font-family="var(--f-mono)" fill="var(--muted)">período →</text><text x="4" y="${oy+48}" font-size="11" font-family="var(--f-mono)" fill="var(--muted)" transform="rotate(-90 12 ${oy+48})">grupo ↓</text>`}
  return s+'</svg>';
}

const LEWIS_ATOMS=['H','Li','Be','B','C','N','O','F','Na','Mg','Al','Si','P','S','Cl'];
const BONDS_USUAL={H:1,C:4,N:3,O:2,F:1,Cl:1,S:2,P:3,Si:4};

/* ---------- Unidad 8 · Lewis de átomos ---------- */
function genLewA(lvl){
  if(lvl===1){
    const s=pick(LEWIS_ATOMS),e=BY[s],v=valE(s),sh=shellsZ(e.Z);
    const steps=[
      X(choiceStep('En la estructura de Lewis se dibujan…','solo los electrones de valencia',[{t:'todos los electrones',msg:'Solo van los de valencia: los del último nivel.'},{t:'los electrones del primer nivel',msg:'Van los del último nivel, que son los que forman enlaces.'}]),{hint:'Los que participan en los enlaces.',ex:'Solo los de valencia.'}),
      X(pillStep(`¿Cuántos puntos lleva el ${e.name}?`,v,[{v:e.Z,msg:'Usaste todos los electrones. En Lewis solo van los de valencia.'},{v:sh[0],msg:'Esos son los del primer nivel. Van los del último.'},{v:sh.length,msg:'Esa es la cantidad de niveles.'}]),{key:true,hint:`Distribución: ${sh.join('-')}. Mira el último nivel.`,ex:`<b>${v}</b> puntos`})
    ];
    return{text:'¿Cuántos puntos lleva?',vp:VP(elTile(e.Z,'lg'),`<span class="q c-e"><b>${sh.join('-')}</b></span>`),steps,els:[e.Z],sol:`<div class="vis">${lewisDotSVG(s,dotsFor(v),{size:110})}</div>`};
  }
  if(lvl===2){
    const s=pick(LEWIS_ATOMS.filter(x=>x!=='H')),e=BY[s],v=valE(s),sh=shellsZ(e.Z);
    const steps=[
      X(pillStep(`¿Cuántos electrones de valencia tiene el ${e.name}?`,v,[{v:e.Z,msg:'Esos son todos. Los de valencia son los del último nivel.'},{v:sh[0],msg:'Esos son los del primer nivel.'}]),{hint:`Distribución ${sh.join('-')}: mira el último nivel.`,ex:`<b>${v}</b>`}),
      dotsStep(`Dibuja el ${s}: toca los lados para poner los puntos.`,s,{key:true,hint:'Primero uno por lado (arriba, derecha, abajo, izquierda). Después, en pares.',ex:`${v} puntos: ${v<=4?'uno por lado':'uno por lado y después pares'}`})
    ];
    return{text:`Dibuja el Lewis del ${e.name}.`,vp:VP(elTile(e.Z,'lg')),steps,els:[e.Z],sol:`<div class="vis">${lewisDotSVG(s,dotsFor(v),{size:110})}</div>`};
  }
  if(Math.random()<0.55){
    const [s,q]=pick(IONS20.filter(([x])=>x!=='H')),e=BY[s],v=valE(s);
    const right=q>0?lewisDotSVG(s,dotsFor(0),{q,size:90,aria:`${s} con carga ${chargeTxt(q)} y sin puntos`}):lewisDotSVG(s,dotsFor(8),{q,size:90,aria:`${s} con 8 puntos y carga ${chargeTxtFull(q)}`});
    const wr=q>0?[{t:lewisDotSVG(s,dotsFor(v),{q,size:90,aria:`${s} con ${v} puntos y carga`}),msg:`Al perder ${q} electrón${q>1?'es':''}, el ${s} queda sin puntos de valencia.`},{t:lewisDotSVG(s,dotsFor(v),{size:90,aria:`${s} neutro con ${v} puntos`}),msg:'Así es el átomo neutro. El ion perdió sus electrones de valencia.'},{t:lewisDotSVG(s,dotsFor(8),{q:-q,size:90,aria:`${s} con 8 puntos y carga negativa`}),msg:'Los metales pierden electrones: quedan positivos.'}]
      :[{t:lewisDotSVG(s,dotsFor(v),{q,size:90,aria:`${s} con ${v} puntos y carga`}),msg:`Ganó ${-q} electrón${q<-1?'es':''}: ahora tiene 8 puntos.`},{t:lewisDotSVG(s,dotsFor(8),{size:90,aria:`${s} con 8 puntos sin carga`}),msg:`Falta la carga: ganó ${-q} electrón${q<-1?'es':''}, así que es ${chargeTxtFull(q)}.`},{t:lewisDotSVG(s,dotsFor(8),{q:-q,size:90,aria:`${s} con 8 puntos y carga positiva`}),msg:'Ganó electrones: la carga es negativa.'}];
    const steps=[
      X(pillStep(`¿Cuántos electrones de valencia le quedan al ${ionTxt(s,q)}?`,q>0?0:8,[{v,msg:q>0?'Esos son los del átomo neutro: el catión los perdió.':'Esos son los del átomo neutro: el anión ganó más.'}]),{hint:q>0?`Perdió ${q}.`:`Ganó ${-q}.`,ex:`<b>${q>0?0:8}</b>`}),
      X(choiceStep(`¿Cuál es el Lewis del ${ionHTML(s,q)}?`,right,wr,{row:true}),{key:true,hint:q>0?'El catión pierde sus electrones de valencia.':'El anión completa 8 puntos y lleva su carga.',ex:q>0?'Sin puntos, con su carga.':'8 puntos y su carga.'})
    ];
    return{text:'Lewis de un ion.',vp:VP(big(ionHTML(s,q))),steps,els:[e.Z],sol:`<div class="vis">${right}</div>`};
  }
  const s=pick(Object.keys(BONDS_USUAL)),e=BY[s],v=valE(s),n=BONDS_USUAL[s];
  const steps=[
    X(pillStep(`¿Cuántos electrones le faltan al ${e.name} para completar ${s==='H'?2:8}?`,n,[{v,msg:'Esos son los que tiene. ¿Cuántos le faltan?'}]),{hint:s==='H'?'El H se completa con 2.':`${8} − ${v}`,ex:`<b>${n}</b>`}),
    X(pillStep(`¿Cuántos enlaces suele formar el ${e.name}?`,n,[{v,msg:`Tiene ${v} de valencia: le faltan ${n}, así que forma ${n} enlace${n>1?'s':''}.`},{v:8,msg:'Cada enlace le aporta un electrón: forma tantos enlaces como electrones le faltan.'}]),{key:true,hint:'Un enlace por cada electrón que le falta.',ex:`<b>${n}</b> enlace${n>1?'s':''}`})
  ];
  return{text:'¿Cuántos enlaces forma?',vp:VP(elTile(e.Z,'lg')),vis:lewisDotSVG(s,dotsFor(v),{size:110}),steps,els:[e.Z],sol:`<p style="margin:0">${s}: ${v} de valencia → le faltan ${n} → ${n} enlace${n>1?'s':''}.</p>`};
}

/* ---------- Unidad 9 · Electronegatividad y tipo de enlace ---------- */
const ENPOOL=['H','Li','Na','K','Rb','Cs','Mg','Ca','Sr','Ba','Al','C','N','O','F','P','S','Cl','Br','I','Se','Cu','Zn','Ag','Fe'].map(s=>BY[s]).filter(e=>e.en!=null);
function bondPairOK(a,b){
  const t=bondType(a,b);if(t==='met')return true;
  const ka=kindOf(a.s),kb=kindOf(b.s);
  if((ka==='m')!==(kb==='m'))return t==='ion';   /* metal + no metal: tiene que dar iónico */
  return t!=='ion';                                /* no metal + no metal: nunca iónico */
}
function enPair(want){for(let k=0;k<600;k++){const a=pick(ENPOOL);const b=Math.random()<0.12&&kindOf(a.s)!=='m'?a:pick(ENPOOL);if(!bondPairOK(a,b))continue;const t=bondType(a,b);if(want&&!want.includes(t))continue;if(a===b&&t==='met')continue;return[a,b,t]}return null}
const bondLbl=(a,b)=>`${a.s}–${b.s}`;
function classStep(a,b,t,o={}){
  const d=dEN(a,b),hi=a.en>=b.en?a:b,met=kindOf(a.s)==='m'?a:b;
  const msg=x=>{if(t==='met')return 'Los dos son metales: el enlace es metálico.';if(x==='met')return 'El enlace metálico es solo entre metales.';
    if(t==='apo')return `ΔEN = ${fx(d,1)}: es ${dec(CONFIG.umbralApolar)} o menos, así que es covalente apolar.`;
    if(t==='pol')return x==='ion'?`ΔEN = ${fx(d,1)} es menor que ${dec(CONFIG.umbralIonico)}: comparten electrones, covalente polar.`:`ΔEN = ${fx(d,1)} es mayor que ${dec(CONFIG.umbralApolar)}: el ${hi.name} atrae más los electrones. Es polar.`;
    return `ΔEN = ${fx(d,1)}: es ${dec(CONFIG.umbralIonico)} o más, así que el ${met.name} cede electrones. Es iónico.`};
  const opts=['apo','pol','ion','met'];
  return X(choiceStep(`¿Qué tipo de enlace es ${bondLbl(a,b)}?`,BTN[t],opts.filter(x=>x!==t).map(x=>({t:BTN[x],msg:msg(x)})),{sort:(x,y)=>opts.indexOf(Object.keys(BTN).find(k=>BTN[k]===x.t))-opts.indexOf(Object.keys(BTN).find(k=>BTN[k]===y.t))}),Object.assign({hint:t==='met'?'¿Los dos son metales?':`Usa la regla: ${dec(CONFIG.umbralApolar)} o menos, apolar; ${dec(CONFIG.umbralIonico)} o más, iónico; en el medio, polar.`,ex:t==='met'?'Metal con metal: <b>metálico</b>.':`ΔEN = ${fx(d,1)} → <b>${BTN[t]}</b>`},o));
}
function genEN(lvl){
  if(lvl===1){
    let a,b;do{a=pick(ENPOOL);b=pick(ENPOOL)}while(a===b||dEN(a,b)<0.2);const hi=a.en>b.en?a:b,lo=hi===a?b:a;
    const steps=[
      X(choiceStep('La electronegatividad mide…','cuánto atrae un átomo los electrones de un enlace',[{t:'cuántos electrones tiene',msg:'Eso es Z (en el átomo neutro).'},{t:'el tamaño del átomo',msg:'Eso es el radio.'}]),{hint:'Piensa en un enlace: ¿quién tira más fuerte de los electrones?',ex:'Atracción sobre los electrones del enlace.'}),
      X(choiceStep('¿Cuál es más electronegativo?',elOpt(hi.Z),[{t:elOpt(lo.Z),msg:`El de mayor valor es el más electronegativo: ${fx(hi.en,1)} > ${fx(lo.en,1)}.`}],{sort:(x,y)=>strip(x.t).localeCompare(strip(y.t))}),{key:true,hint:'Compara los dos números.',ex:`<b>${hi.s}</b>: ${fx(hi.en,1)}`})
    ];
    return{text:'¿Cuál atrae más los electrones?',vp:VP(chip(a.s,fx(a.en,1),'c-ink'),chip(b.s,fx(b.en,1),'c-ink')),steps,els:[a.Z,b.Z],sol:`<p style="margin:0">${hi.s} (${fx(hi.en,1)}) &gt; ${lo.s} (${fx(lo.en,1)})</p>`};
  }
  if(lvl===2){
    const [a,b,t]=enPair(Math.random()<0.15?['met']:['apo','pol','ion']);const d=dEN(a,b);

  const g=gcd(c.q,-a.q);if(g>1)t.push({f:part(c,-a.q)+part(a,c.q),msg:`Hay que simplificar: ${fh(part(c,-a.q)+part(a,c.q))} → ${fh(sa.f)}.`});
  if(a.poly&&na>1)t.push({f:part(c,nc)+a.f+na,msg:`Falta el paréntesis: ${fh(sa.f)}. Sin él, el ${na} multiplicaría solo al último átomo.`});
  if(c.poly&&nc>1)t.push({f:c.f+nc+part(a,na),msg:`Falta el paréntesis: ${fh(sa.f)}.`});
  return t;
}
function saltSteps(sa,o={}){
  const {c,a,nc,na}=sa;
  return[
    X(pillStep(`¿Cuántos ${ionTxt(c.f,c.q).replace(/(\d)/g,m=>subU(m))} hacen falta?`,nc,[{v:c.q!==nc?c.q:null,msg:'Al revés: el catión lleva como subíndice la carga del anión.'},{v:nc===1?null:1,msg:'Faltó cruzar las cargas.'}]),{hint:`La carga del anión: ${chargeTxtFull(a.q)} → ${-a.q}${gcd(c.q,-a.q)>1?', y después se simplifica':''}.`,ex:`<b>${nc}</b>`}),
    X(pillStep(`¿Y cuántos ${ionTxt(a.f,a.q).replace(/(\d)/g,m=>subU(m))}?`,na,[{v:-a.q!==na?-a.q:null,msg:'Al revés: el anión lleva como subíndice la carga del catión.'}]),{hint:`La carga del catión: ${chargeTxtFull(c.q)}${gcd(c.q,-a.q)>1?', simplificada':''}.`,ex:`<b>${na}</b>`}),
    X(pillStep(`Comprueba: ${nc} × (${chargeTxtFull(c.q)}) + ${na} × (${chargeTxtFull(a.q)}) = ?`,0,[{v:nc*c.q,msg:'Suma las dos partes: la positiva y la negativa.'}],{min:-6}),{hint:'Positivo más negativo.',ex:`${nc*c.q} − ${na*-a.q} = <b>0</b>`}),
    formulaStep(o.q||'Escribe la fórmula de la sal.',sa.f,{key:true,strict:true,ionic:true,traps:saltTraps(sa),hint:'Primero el catión, después el anión, cada uno con su subíndice.',ex:`${fh(sa.f)} · ${sa.name}`})
  ];
}
function genSal(lvl){
  if(lvl===1){
    const sa=pick(SALTS.filter(x=>x.c.q===-x.a.q));
    return{text:'Forma la sal.',vp:VP(big(ionF(sa.c)),'<span class="vpa">+</span>',big(ionF(sa.a))),steps:saltSteps(sa),els:saltEls(sa),sol:`<p style="margin:0">${fh(sa.f)}: cargas ${chargeTxtFull(sa.c.q)} y ${chargeTxtFull(sa.a.q)} se anulan. ${cap1(sa.name)}.</p>`};
  }
  if(lvl===2){
    const sa=pick(SALTS.filter(x=>x.c.q!==-x.a.q&&!x.a.poly&&!x.c.poly));
    const steps=saltSteps(sa);
    return{text:'Forma la sal: cruza las cargas.',vp:VP(big(ionF(sa.c)),'<span class="vpa">+</span>',big(ionF(sa.a))),steps,els:saltEls(sa),sol:`<p style="margin:0">${fh(sa.f)} · ${sa.nc} × (${chargeTxtFull(sa.c.q)}) + ${sa.na} × (${chargeTxtFull(sa.a.q)}) = 0 · ${sa.name}</p>`};
  }
  const v=Math.random();
  if(v<0.4){
    const sa=pick(SALTS.filter(x=>(x.a.poly&&x.na>1)||(x.c.poly&&x.nc>1)));
    return{text:'Sal con un ion poliatómico.',vp:VP(big(ionF(sa.c)),'<span class="vpa">+</span>',big(ionF(sa.a))),steps:saltSteps(sa),els:saltEls(sa),sol:`<p style="margin:0">${fh(sa.f)} · ${sa.name}</p>`};
  }
  if(v<0.7){
    const sa=pick(SALTS.filter(x=>x.c.vari||Math.random()<0.25)),{c,a}=sa;
    const qStep=X(chargeStep(`¿Qué carga tiene el ion de ${BY[c.el||c.f]?BY[c.el||c.f].name:c.st} en «${sa.name}»?`,c.q,[{v:-c.q,msg:'Los metales forman iones positivos.'},{v:c.q===2?3:2,msg:c.vari?(CONFIG.nomenclatura==='tradicional'?`-ico indica la carga mayor y -oso la menor.`:`El número romano dice la carga: (${ROMAN[c.q]}) = ${c.q}+.`):'Recuerda los iones: Na⁺ y K⁺ (1+), Mg²⁺ y Ca²⁺ (2+), Al³⁺ (3+).'}]),{key:true,hint:c.vari?(CONFIG.nomenclatura==='tradicional'?'-oso: carga menor · -ico: carga mayor.':'El número romano es la carga.'):'Piensa cuántos electrones pierde ese metal.',ex:`<b>${chargeTxtFull(c.q)}</b>`});
    const st=saltSteps(sa,{q:`Escribe la fórmula del ${sa.name}.`});
    return{text:`Del nombre a la fórmula: ${sa.name}.`,steps:[qStep,...st],els:saltEls(sa),sol:`<p style="margin:0">${ionF(c)} + ${ionF(a)} → ${fh(sa.f)}</p>`};
  }
  const sa=pick(SALTS.filter(x=>x.c.vari)),{c,a}=sa;
  const other=CATIONS.find(x=>x.vari&&x.el===c.el&&x.q!==c.q)||CATIONS.find(x=>x.vari&&x.f!==c.f);
  const wrongName=CONFIG.nomenclatura==='tradicional'?`${a.n} ${other.tr}`:`${a.n} de ${other.st}`;
  const noNum=`${a.n} de ${BY[c.el].name}`;
  const steps=[
    X(chargeStep(`En ${fh(sa.f)}, ¿qué carga tiene el ${BY[c.el].name}?`,c.q,[{v:-c.q,msg:'El metal es el catión: carga positiva.'},{v:c.q===2?3:2,msg:`Los ${sa.na} ${a.f} aportan ${sa.na*a.q} en total; el metal compensa con +${sa.na*-a.q}${sa.nc>1?` repartido en ${sa.nc}`:''}.`}]),{hint:`Carga total del anión: ${sa.na} × (${chargeTxtFull(a.q)}). La sal es neutra.`,ex:`<b>${chargeTxtFull(c.q)}</b>`}),
    X(choiceStep(`¿Cómo se llama ${fh(sa.f)}?`,sa.name,[{t:wrongName,msg:CONFIG.nomenclatura==='tradicional'?'La terminación indica la carga: -oso la menor, -ico la mayor.':`El ${BY[c.el].name} tiene carga ${c.q}+: se escribe (${ROMAN[c.q]}).`},{t:noNum,msg:CONFIG.nomenclatura==='tradicional'?`El ${BY[c.el].name} tiene dos cargas posibles: se indica con -oso o -ico.`:`El ${BY[c.el].name} puede tener más de una carga: hay que indicarla con número romano.`}]),{key:true,hint:'Primero el anión, después el metal con su carga.',ex:`<b>${sa.name}</b>`})
  ];
  return{text:'De la fórmula al nombre.',vp:VP(`<span class="vbig mono">${fh(sa.f)}</span>`),steps,els:saltEls(sa),sol:`<p style="margin:0">${fh(sa.f)}: ${BY[c.el].name} ${chargeTxtFull(c.q)} → ${sa.name}.</p>`};
}
function saltEls(sa){const o=[];for(const f of [sa.c.f,sa.a.f])for(const e in parseFormula(f))o.push(BY[e].Z);return uniq(o)}

/* ---------- Unidad · Polaridad de moléculas (un solo nivel) ---------- */
const GEON={lineal:'lineal',angular:'angular',trigonal:'trigonal plana',piramidal:'piramidal',tetraedrica:'tetraédrica'};
const GEOR={lineal:'2 átomos unidos al central y ningún par libre en él',angular:'2 átomos unidos al central y 1 o 2 pares libres en él',trigonal:'3 átomos unidos al central y ningún par libre',piramidal:'3 átomos unidos al central y 1 par libre',tetraedrica:'4 átomos unidos al central y ningún par libre'};
const POLMOL={H2:{},Cl2:{},O2:{},N2:{},HCl:{},CS2:{geo:'lineal'},CH4:{geo:'tetraedrica'},SiH4:{geo:'tetraedrica'},C2H2:{},C2H4:{},C2H6:{},
  H2O:{geo:'angular'},NH3:{geo:'piramidal'},PCl3:{geo:'piramidal'},OF2:{geo:'angular'},CO2:{geo:'lineal'},CCl4:{geo:'tetraedrica'},HCN:{geo:'lineal'},CHCl3:{geo:'tetraedrica'},CH2O:{geo:'trigonal'}};
function polInfo(k){
  const M=LEWIS[k],P=POLMOL[k],bt={};
  M.b.forEach(([i,j])=>{const a=BY[M.a[i][0]],b=BY[M.a[j][0]];const [x,y]=a.en>=b.en?[b,a]:[a,b];bt[x.s+'–'+y.s]=[x,y,dEN(x,y)]});
  const types=Object.values(bt).sort((p,q)=>q[2]-p[2]);const polarB=types[0][2]>CONFIG.umbralApolar;const di=M.a.length===2;
  const outer=M.b.filter(b=>b[0]===0||b[1]===0).map(b=>M.a[b[0]===0?b[1]:b[0]][0]);
  const sym=!di&&!!P.geo&&['lineal','trigonal','tetraedrica'].includes(P.geo)&&uniq(outer).length===1;
  const polar=polarB&&(di||!sym);
  const why=!polarB?'Todos sus enlaces son apolares: no hay cargas parciales, así que la molécula es apolar.'
    :di?'Tiene un solo enlace y es polar: la molécula queda con un lado δ+ y otro δ−.'
    :sym?`Los enlaces son polares, pero la forma ${GEON[P.geo]} es simétrica y sus efectos se anulan.`
    :uniq(outer).length>1?'Los átomos unidos al central no son todos iguales: las cargas parciales no se anulan.'
    :`Por la forma ${GEON[P.geo]}, las cargas parciales no se anulan.`;
  return{M,P,types,polarB,di,outer,lpC:M.lp[0],sym,polar,why};
}
function genPol(){
  const keys=Object.keys(POLMOL),withPol=keys.filter(k=>polInfo(k).polarB);
  const k=Math.random()<0.75?pick(withPol):pick(keys.filter(x=>!withPol.includes(x)));
  const I=polInfo(k),[lo,hi,d]=I.types[0],els=uniq(I.M.a.map(x=>x[0]));const bl=`${lo.s}–${hi.s}`;
  const steps=[];
  steps.push(X(numStep(`ΔEN del enlace ${bl}${I.types.length>1?' (el más polar de la molécula)':''}`,d,{int:false,traps:[{v:+(lo.en+hi.en).toFixed(1),msg:'Se resta, no se suma: ΔEN es la diferencia.'},{v:-d,msg:'Resta el mayor menos el menor: ΔEN no es negativa.'}],hint:`El mayor menos el menor: ${fx(hi.en,1)} − ${fx(lo.en,1)}`,ex:`${fx(hi.en,1)} − ${fx(lo.en,1)} = <b>${fx(d,1)}</b>`})));
  steps.push(X(choiceStep(`¿El enlace ${bl} es…?`,I.polarB?'covalente polar':'covalente apolar',[{t:I.polarB?'covalente apolar':'covalente polar',msg:I.polarB?`ΔEN = ${fx(d,1)} es mayor que ${dec(CONFIG.umbralApolar)}: es polar.`:`ΔEN = ${fx(d,1)} es ${dec(CONFIG.umbralApolar)} o menos: es apolar.`}],{keep:true}),{hint:`${dec(CONFIG.umbralApolar)} o menos: apolar. Entre ${dec(CONFIG.umbralApolar)} y ${dec(CONFIG.umbralIonico)}: polar.`,ex:I.polarB?'Covalente <b>polar</b>.':'Covalente <b>apolar</b>.'}));
  if(I.polarB&&!I.di&&I.P.geo){
    const g=I.P.geo,c=I.M.a[0][0],n=I.outer.length,lp=I.lpC;
    steps.push(X(choiceStep(`Mira el dibujo. ¿Qué forma tiene la molécula?`,cap1(GEON[g]),shuffle(Object.keys(GEON).filter(x=>x!==g)).map(x=>({t:cap1(GEON[x]),msg:`${cap1(GEON[x])} es con ${GEOR[x]}. Cuenta en el ${c}: ${n} átomos unidos y ${lp} par${lp===1?'':'es'} libre${lp===1?'':'s'}.`}))),{hint:`Cuenta en el ${c} (el átomo central) cuántos átomos tiene unidos y cuántos pares libres.`,ex:`El ${c} tiene ${n} átomos unidos y ${lp} par${lp===1?'':'es'} libre${lp===1?'':'s'}: <b>${GEON[g]}</b>.`}));
  }
  steps.push(X(choiceStep(`¿La molécula ${delN(k).replace(/^de la |^del /,'de ')} es…?`.replace('molécula de ','molécula de '),I.polar?'polar':'apolar',[{t:I.polar?'apolar':'polar',msg:I.why}],{keep:true,row:true}),{key:true,hint:'Sin enlaces polares: apolar. Con enlaces polares: mira si la forma es simétrica.',ex:`<b>${I.polar?'Polar':'Apolar'}</b>. ${I.why}`}));
  const g=lewisGeom(I.M);
  return{text:`¿${cap1(LEWIS[k].n)} (${fh(k)}): polar o apolar?`,vp:VP(`<span class="vbig mono">${fh(k)}</span>`,...els.map(x=>chip(x,fx(BY[x].en,1),'c-ink'))),
    vis:`<div style="width:min(100%,${Math.round(g.W*1.15)}px)">${lewisSVG(k,STEPX.lewis.raw({mol:k}))}</div>`,steps,els:els.map(x=>BY[x].Z),
    sol:`<p style="margin:0">${I.types.map(t=>`${t[0].s}–${t[1].s}: ΔEN = ${fx(t[2],1)} (${t[2]>CONFIG.umbralApolar?'polar':'apolar'})`).join(' · ')}${I.P.geo&&!I.di?` · forma ${GEON[I.P.geo]}`:''}. <b>${I.polar?'Polar':'Apolar'}</b>: ${I.why}</p>`};
}

    {t:'Cómo saber la forma',p:'Mira el átomo central en la estructura de Lewis y cuenta cuántos átomos tiene unidos y cuántos pares libres.',v:`<div class="pc2"><b>2 + 0 pares</b><span>lineal (CO₂)</span><b>2 + pares</b><span>angular (H₂O)</span><b>3 + 0 pares</b><span>trigonal plana (CH₂O)</span><b>3 + 1 par</b><span>piramidal (NH₃)</span><b>4 + 0 pares</b><span>tetraédrica (CH₄)</span></div>`},

    ['El subíndice indica…','cuántos átomos de ese elemento',[['cuántas moléculas hay','Eso lo indica el coeficiente, adelante.'],['la carga del átomo','Las cargas no van en la fórmula.']],'Subíndice: átomos. Coeficiente: moléculas.']

const probSig=p=>strip((p.text||'')+'|'+(p.vp||'')+'|'+p.steps.filter(s=>s.key).map(s=>s.q+'='+fmtAns(s)).join('|'));
const RECENT={};
function genProblem(pl,used,sigs){
  let err=null;const rec=RECENT[pl.u+pl.l]||(RECENT[pl.u+pl.l]=[]);const last=rec[rec.length-1];
  let best=null,ok2=null,ok3=null;
  for(let k=0;k<60;k++){let p=null;try{p=pl.c?genConcept(pl.u,used):UK[pl.u].gen(pl.l)}catch(e){err=e;continue}
    const sg=probSig(p);if(pl.c){best=p;break}
    const inRound=sigs&&sigs.has(sg);
    if(!inRound&&!rec.includes(sg)){best=p;break}
    if(!inRound&&!ok2)ok2=p;if(sg!==last&&!ok3)ok3=p;}
  const prob=best||ok2||ok3;if(!prob)throw err||new Error('No se pudo generar el ejercicio');
  const sg=probSig(prob);sigs&&sigs.add(sg);rec.push(sg);if(rec.length>25)rec.shift();
  prob.unit=pl.u;prob.lvl=pl.l;return prob;
}
function nextProblem(){
  const pl=G.practice?{u:G.uid,l:G.l,c:Math.random()<0.15&&UK[G.uid].concepts}:G.plan[G.i];
  if(!G.sigs){G.sigs=new Set();G.introSeen=new Set()}
  const prob=genProblem(pl,G.used,G.sigs);
  const mode=(!G.final&&pl.l===1&&!prob.concept)?'guided':'direct';
  G.S=makeSession(prob,mode);G.phase='play';G.showSol=false;G.exitArm=false;renderPlay(true);window.scrollTo({top:0});toolSync();
}
function exitPlay(){G=null;document.body.classList.remove('sheet-on');document.body.classList.remove('playing');renderAll();showView('map');window.scrollTo({top:0});toolSync()}
function scoreOf(S){const rev=S.ps.some(p=>p.st==='rev');const e=S.errors;return rev?0:(e===0&&!S.usedSteps)?1:e<=1?0.75:0.5}
function exerciseDone(){
  const S=G.S;const sc=scoreOf(S);
  if(sc===1)G.combo++;else G.combo=0;G.maxCombo=Math.max(G.maxCombo,G.combo);
  const xp=Math.round(10*sc)+(G.combo>=3?5:0);G.xp+=xp;G.res.push(sc);G.lastXp=xp;G.lastSc=sc;G.phase='done';G.showSol=sc===0;
  if(sc>0){const before=BADGES.filter(badgeDone).map(b=>b.id);(S.prob.els||[]).forEach(z=>{const s=EL[z]&&EL[z].s;if(s&&!P.album[s]){P.album[s]=1;G.newEls.push(s)}});
    BADGES.filter(b=>badgeDone(b)&&!before.includes(b.id)).forEach(b=>(G.newBadges=G.newBadges||[]).push(b.n))}
  if(G.practice)P.xp+=xp;
  save();
  if(sc>0)sfx.ok(G.combo);else sfx.bad();
  renderPlay();
  setTimeout(()=>{const b=document.querySelector('.sheet .btn.primary');b&&b.focus({preventScroll:true})},50);
}
function finishRound(){
  const n=G.plan.length,sum=G.res.reduce((a,b)=>a+b,0),r=sum/n;
  const s=r>=0.9?3:r>=0.7?2:r>=0.5?1:0;G.stars=s;
  const prevRank=rankOf(P.xp),prevStars=st(G.id);
  const before={};NODES().forEach(x=>before[x]=unlocked(x));const unitsBefore=Object.fromEntries(UNITS.map(u=>[u.id,unitOpen(u.id)]));
  P.stars[G.id]=Math.max(prevStars,s);
  G.msgs=[];G.toGo=null;
  if(G.final){if(s>=1&&prevStars===0)G.msgs.push(`${IC.trophy} ¡Ganaste el trofeo del bloque ${BLOCKS.find(b=>b.id===G.bid).n}!`)}
  else{
    UNITS.forEach(u=>{if(!unitsBefore[u.id]&&unitOpen(u.id))G.msgs.push(`${IC.star(true)} Desbloqueaste: ${u.name}`)});
    BLOCKS.forEach(b=>{const id='B-'+b.id;if(!before[id]&&unlocked(id))G.msgs.push(`${IC.trophy} Desbloqueaste: Desafío del bloque ${b.n}`)});
    if(G.l<uL(G.uid)&&!before[`${G.uid}-${G.l+1}`]&&unlocked(`${G.uid}-${G.l+1}`))G.msgs.push(`${IC.star(true)} Desbloqueaste: nivel ${LVLN[G.l+1]}`);
    const us=unitStars(G.uid),nx=UNITS[UK[G.uid].n];
    const need=needOf(UK[G.uid]);if(!G.msgs.length&&us<need&&!P.unlockAll&&nx)G.toGo=`Llevas ${us} de ${need} estrellas en ${UK[G.uid].name}. Te faltan ${need-us} para abrir «${nx.name}».`;
    else if(!G.msgs.length&&s===0)G.toGo='Con 1 estrella se abre el nivel siguiente. ¡Inténtalo otra vez!';
  }
  G.bonus=s*10;P.xp+=G.xp+G.bonus;P.plays++;if(s>=1)P.last=G.id;save();
  G.newRank=rankOf(P.xp)>prevRank?RANKS[rankOf(P.xp)][1]:null;
  G.correct=G.res.filter(x=>x>0).length;G.phase='summary';renderPlay();window.scrollTo({top:0});
  const bs=[...document.querySelectorAll('.bigstars .ico')];bs.forEach(el=>el.style.visibility='hidden');
  const play=()=>{bs.forEach((el,i)=>{setTimeout(()=>{el.style.visibility='visible';if(i<s){el.classList.add('pop');sfx.star(i)}},350+i*380)});
    setTimeout(()=>{if(s>=1){sfx.win();confetti(s===3?120:60)}},350+3*380)};
  const items=pendingReveal();if(items.length)setTimeout(()=>reveal(items,play),300);else play();
}

/* ---------- constructores ---------- */
function vizHTML(step,v){
  if(step.viz==='atom')return atomSVG(v.p||0,v.n||0,v.e||0,{size:240,label:`Átomo con ${v.p} protones, ${v.n} neutrones y ${v.e} electrones`});
  if(step.viz==='ion')return bohrSVG(v.e>0?shellsOf(ionConf(step.Z,v.e)):[],{label:`${step.Z} p⁺`,size:220,rings:3});
  if(step.viz==='shells'){const a=[v.s1||0,v.s2||0,v.s3||0];return bohrSVG(a,{label:`${step.Z} p⁺`,rings:3,size:250,aria:`Electrones por nivel: ${a.join('-')}`})}
  return '';
}
function ctrHTML(id,c,val,locked){
  const dis=locked?' disabled':'';
  return `<div class="stp"><button type="button" class="sb" data-bw="${id}" data-k="${c.k}" data-d="-1" aria-label="Quitar ${strip(c.label)}"${dis||(val<=(c.min||0)?' disabled':'')}>−</button><span class="cv" aria-live="polite">${val}</span><button type="button" class="sb" data-bw="${id}" data-k="${c.k}" data-d="1" aria-label="Agregar ${strip(c.label)}"${dis||(val>=c.max?' disabled':'')}>+</button></div>`;
}
function builderHTML(id,step,v,locked){
  let h='';const viz=vizHTML(step,v);if(viz)h+=`<div class="vis">${viz}</div>`;
  if(step.viz==='subs')h+=`<div class="subs">${step.ctrs.slice().sort((a,b)=>a.k[0]-b.k[0]||'spdf'.indexOf(a.k[1])-'spdf'.indexOf(b.k[1])).map(c=>`<div class="subrow ${c.cls}"><span class="sl">${c.label}<small>${c.cap||''}</small></span>${ctrHTML(id,c,v[c.k]||0,locked)}</div>`).join('')}</div>`;
  else h+=`<div class="ctrs">${step.ctrs.map(c=>`<div class="ctr ${c.cls}"><span class="cl">${c.label}</span>${ctrHTML(id,c,v[c.k]||0,locked)}${c.cap?`<span class="cap">${c.cap}</span>`:''}</div>`).join('')}</div>`;
  if(step.counter)h+=`<div class="counter">${step.counter(v)}</div>`;

function playStepHTML(S,i){

  let h=`<li class="step ${cls}${ps.shake?' shake':''}">`;ps.shake=false;

  if(ps.st==='open'){
    if(ps.hl&&s.hint)h+=`<div class="fb hint">${s.hint}</div>`;
    if(ps.fb)h+=`<div class="fb ${ps.fb.kind||'bad'}" role="status">${ps.fb.msg}</div>`;
    h+=stepWorkHTML(S,i);
    const links=[];
    if(S.mode==='guided'&&!ps.hl&&s.hint)links.push(`<button type="button" class="btn link" data-act="hint" data-i="${i}">Ver pista</button>`);
    if(ps.tries>=2)links.push(`<button type="button" class="btn link" data-act="rev" data-i="${i}">Mostrar la respuesta</button>`);
    if(links.length)h+=`<div class="row">${links.join('')}</div>`;

    h+=`<div class="sa"><span class="v${s.type==="choice"&&!s.row?" tx":""}">${mark}${fmtAns(s)}</span>${s.ex&&s.type!=='choice'?`<span class="ex">${s.ex}</span>`:''}</div>`;

}

function playSubmit(i,raw){
  const S=G.S,s=S.steps[i],ps=S.ps[i];if(G.phase!=='play'||ps.st!=='open')return;
  const r=checkStep(s,raw);
  if(s.type==='num')ps.raw=raw;if(s.type==='fields')ps.raw=Object.assign({},raw);
  if(r.invalid){ps.fb={msg:r.msg,kind:'info'};renderPlay();return}
  if(r.ok){ps.st='ok';ps.fb=null;ps.wrong=[];S.cur++;if(S.cur>=S.steps.length)exerciseDone();else{sfx.step();renderPlay(true)}return}
  ps.tries++;S.errors++;sfx.bad();if(r.trap&&r.msg)S.trapMsg=r.msg;
  ps.wrong=r.wrong||[];
  const msg=r.msg||(S.mode==='guided'&&s.hint?s.hint:ps.tries===1?'No es correcto. Revisa y prueba otra vez.':(S.mode==='direct'&&!G.final&&!S.prob.concept&&S.prob.steps.some(x=>!x.direct&&!x.key)?'Todavía no. Prueba «Resolver paso a paso».':'Todavía no. Revisa con calma.'));
  ps.fb={msg,kind:r.near?'near':'bad'};ps.shake=true;renderPlay();
  const inp=document.getElementById('in'+i);if(inp){inp.focus({preventScroll:true});inp.select()}
}

const CALC={expr:'',res:null,just:false,lastIn:null,prev:false};
function calcEval(src){
  let i=0;const t=src;const peek=()=>t[i];
  function num(){let a='';while(/[0-9,]/.test(t[i]||''))a+=t[i++];if(!a||a===',')throw 0;let v=parseFloat(a.replace(',','.'));
    if(t[i]==='E'){i++;let sg=1;if(t[i]==='−'){sg=-1;i++}else if(t[i]==='+')i++;let e='';while(/[0-9]/.test(t[i]||''))e+=t[i++];if(!e)throw 0;v*=Math.pow(10,sg*+e)}return v}
  function fac(){if(peek()==='−'){i++;return -fac()}if(peek()==='+'){i++;return fac()}if(peek()==='('){i++;const v=ex();if(peek()===')')i++;return v}return num()}
  function term(){let v=fac();while(peek()==='×'||peek()==='÷'){const o=t[i++];const w=fac();v=o==='×'?v*w:v/w}return v}
  function ex(){let v=term();while(peek()==='+'||peek()==='−'){const o=t[i++];const w=term();v=o==='+'?v+w:v-w}return v}
  const v=ex();if(i<t.length)throw 0;if(!isFinite(v))throw 1;return v;
}
function calcFmt(v){if(v===0)return '0';const a=Math.abs(v);if(a>=1e7||a<1e-4){let [m,e]=v.toExponential(5).split('e');m=m.replace(/\.?0+$/,'');return dec(m)+'×10^'+(+e)}return dec(String(parseFloat(v.toPrecision(10))))}
const calcShow=x=>esc(x).replace(/E/g,'×10^');
function calcRender(){
  const e=document.getElementById('cExpr'),r=document.getElementById('cRes');if(!e)return;
  if(CALC.just){e.innerHTML=calcShow(CALC.expr)+' =';r.className='cres';r.innerHTML=CALC.res===null?'—':calcFmt(CALC.res).replace(/\^(-?\d+)/,'<sup>$1</sup>')}
  else{e.innerHTML=CALC.res!==null&&CALC.prev?'Ans = '+calcFmt(CALC.res):'';r.className='cres';r.innerHTML=CALC.expr?calcShow(CALC.expr):'0'}
}
function calcKey(k){
  if(k==='C'){CALC.expr='';CALC.just=false;CALC.prev=false}
  else if(k==='B'){if(CALC.just){CALC.just=false;CALC.expr=''}else CALC.expr=CALC.expr.slice(0,-1)}
  else if(k==='='){if(!CALC.expr)return;try{CALC.res=calcEval(CALC.expr);CALC.just=true;sfx.click()}catch(err){const r=document.getElementById('cRes');r.className='cres err';r.textContent=err===1?'No se puede dividir por cero':'Revisa la cuenta';return}}
  else if(k==='U'){calcUse();return}
  else{if(CALC.just){CALC.just=false;CALC.prev=true;if('+−×÷'.includes(k))CALC.expr=calcFmt(CALC.res).replace('×10^','E');else CALC.expr=''}CALC.expr+=k}
  calcRender();
}
function calcUse(){
  let v=CALC.just?CALC.res:null;if(v===null){try{v=calcEval(CALC.expr)}catch(e){v=null}}
  const inp=CALC.lastIn&&document.body.contains(CALC.lastIn)?CALC.lastIn:document.querySelector('#v-play .step.s-open input');
  const b=document.getElementById('cUse');
  if(v===null||!inp){b.textContent=inp?'Primero calcula':'No hay casilla abierta';setTimeout(()=>{b.textContent='Usar en el ejercicio'},1400);return}
  inp.value=calcFmt(v);inp.dispatchEvent(new Event('input',{bubbles:true}));sfx.step();toggleTool(false);inp.focus({preventScroll:true});
}

  box.innerHTML=`<div class="vis">${atomSVG(LA.p,LA.n,LA.e,{size:300})}</div>${labAtomReadout()}`;
  document.getElementById('laCtrs').innerHTML=LACTR.map(c=>`<div class="ctr ${c.cls}"><span class="cl">${c.label}</span><div class="stp"><button type="button" class="sb" data-lk="${c.k}" data-d="-1" aria-label="Quitar ${c.label}"${LA[c.k]<=0?' disabled':''}>−</button><span class="cv">${LA[c.k]}</span><button type="button" class="sb" data-lk="${c.k}" data-d="1" aria-label="Agregar ${c.label}"${LA[c.k]>=c.max?' disabled':''}>+</button></div></div>`).join('');
  document.getElementById('laMis').innerHTML=labAtomMission();
  const m=MISSIONS.find(x=>x.id===LA.mission);
  if(m&&LA.p===m.p&&m.n.includes(LA.n)&&LA.e===m.e&&LA.lastDone!==m.id){LA.lastDone=m.id;if(!P.missions[m.id]){P.missions[m.id]=1;save();const lc=document.getElementById('laCount');if(lc)lc.textContent=Object.keys(P.missions).length+'/'+MISSIONS.length}sfx.ok(3);document.querySelectorAll('.mission').forEach(b=>{if(b.dataset.ms===m.id)b.classList.add('done')})}
}

function heatRange(k){const v=Object.keys(PROPS).map(s=>PROPS[s][PROPN[k].i]).filter(x=>x!=null);return[Math.min(...v),Math.max(...v)]}
function cellStyle(e,mode){
  if(mode==='cat')return{style:`background:var(--cat-${e.cat});color:var(--cat-ink)`};

}

/* ---------- Cazador de elementos ---------- */
const HUNT={phase:'idle',left:90,score:0,hits:0,streak:0,q:null,iv:null,msg:null,last:null};
function huntQuestion(){
  const gens=[
    ()=>{const e=pick(EL.filter(x=>x&&x.known&&x.g&&x.Z<=86));return{t:`grupo ${groupLabel(e.g)}, período ${e.p}`,z:e.Z}},
    ()=>{const f=pick(Object.keys(FAM));const s=pick(FAM[f].els);return{t:`el ${FAMSHORT[f]} del período ${BY[s].p}`,z:BY[s].Z}},
    ()=>{const z=ri(3,CONFIG.zMaxNiveles);return{t:`distribución ${shellsZ(z).join('-')}`,z}},
    ()=>{const z=ri(1,56);return{t:`Z = ${z}`,z}},
    ()=>pick([{t:'el más electronegativo',z:9},{t:'el de mayor radio del período 3',z:11},{t:'el de menor energía de ionización del período 2',z:3},{t:'el gas noble más liviano',z:2},{t:'el metal líquido',z:80},{t:'el halógeno líquido',z:35},{t:'el metaloide del período 3',z:14},{t:'el primer elemento de transición',z:21}]),
    ()=>{const s=pick(['Na','K','Fe','Cu','Ag','Au','Hg','Pb','Sn','Ca','Mg','Zn','I','Br','Ne','He','U','Pt']);return{t:`el ${BY[s].name}`,z:BY[s].Z}}
  ];
  let q;do{q=pick(gens)()}while(HUNT.q&&q.t===HUNT.q.t);return q;
}
function renderHunt(el){
  const best=P.labBest.hunt||0;
  if(HUNT.phase==='idle'||HUNT.phase==='end'){
    el.innerHTML=`<article class="card" style="align-items:center;text-align:center"><h2 style="font-size:28px">${HUNT.phase==='end'?(HUNT.record?'¡Nuevo récord!':'¡Tiempo!'):'Cazador de elementos'}</h2>
      ${HUNT.phase==='end'?`<div class="sumstats"><span><b>${HUNT.score}</b>puntos</span><span><b>${HUNT.hits}</b>cazados</span><span><b>${best}</b>récord</span></div>`:`<p style="margin:0;max-width:40ch">Tienes 90 segundos para tocar en la tabla el elemento que se pide. Tres seguidos dan puntos extra.</p><p style="margin:0" class="mono">Récord: <b>${best}</b> puntos</p>`}
      <button type="button" class="btn primary big" id="huntGo" style="max-width:320px">${HUNT.phase==='end'?'Jugar otra vez':'¡Empezar!'}</button></article>`;return}
  el.innerHTML=`<div class="racehead"><span class="clock" id="huntClock">${Math.ceil(HUNT.left)}</span><span class="rscore">puntos<b id="huntScore">${HUNT.score}</b></span></div>

    <div class="row" style="justify-content:flex-end"><button type="button" class="btn small" id="huntSkip">Saltar</button></div></article>`;
}
function huntTick(){HUNT.left=90-(Date.now()-HUNT.t0)/1000;const c=document.getElementById('huntClock');if(c){c.textContent=Math.max(0,Math.ceil(HUNT.left));c.classList.toggle('low',HUNT.left<=10)}

/* --- lo que llega de la nube no es confiable: se reconstruye campo por campo --- */
function sanP(o){
  const r=P0();if(!o||typeof o!=='object')return r;
  const int=(v,max)=>Number.isInteger(v)&&v>=0&&v<=max?v:0;
  const kOk=k=>/^[A-Za-z0-9_-]{1,24}$/.test(k);
  r.xp=int(o.xp,1e7);r.plays=int(o.plays,1e6);
  if(o.stars&&typeof o.stars==='object')for(const k in o.stars)if(kOk(k)){const v=int(o.stars[k],3);if(v)r.stars[k]=v}
  if(o.plv&&typeof o.plv==='object')for(const k in o.plv)if(UK[k]){const v=int(o.plv[k],3);if(v)r.plv[k]=v}
  if(o.seen&&typeof o.seen==='object')for(const k in o.seen)if(UK[k]&&o.seen[k])r.seen[k]=1;
  if(o.album&&typeof o.album==='object')for(const k in o.album)if(BY[k]&&o.album[k])r.album[k]=1;
  if(o.missions&&typeof o.missions==='object')for(const k in o.missions)if(MISSIONS.some(m=>m.id===k)&&o.missions[k])r.missions[k]=1;
  if(o.labBest&&typeof o.labBest==='object'){const h=int(o.labBest.hunt,1e5);if(h)r.labBest.hunt=h}
  if(typeof o.last==='string'&&kOk(o.last))r.last=o.last;
  return r;
}
/* --- combinar dos progresos: el avance nunca se pierde --- */
function mergeP(a,b){
  const r=sanP(a);const c=sanP(b);
  r.xp=Math.max(r.xp,c.xp);r.plays=Math.max(r.plays,c.plays);
  for(const k in c.stars)r.stars[k]=Math.max(r.stars[k]||0,c.stars[k]);
  for(const f of ['seen','album','missions'])Object.assign(r[f],c[f]);
  for(const k in c.plv)if(!r.plv[k])r.plv[k]=c.plv[k];
  r.labBest.hunt=Math.max(r.labBest.hunt||0,c.labBest.hunt||0)||undefined;if(!r.labBest.hunt)delete r.labBest.hunt;
  if(!r.last&&c.last)r.last=c.last;
  return r;
}

const paraSubir=()=>{const o=sanP(P);delete o.mute;delete o.unlockAll;return JSON.stringify(o)};

/* --- Firestore REST --- */
async function nubeLeer(code){
  const r=await fetch(`${FB.base}/${docPath(code)}?key=${FB.apiKey}`,{cache:'no-store'});
  if(r.status===404)return{existe:false};
  if(!r.ok)throw new Error('http '+r.status);
  const d=await r.json(),f=d.fields||{};let p=null;
  try{p=f.p&&f.p.stringValue?JSON.parse(f.p.stringValue):null}catch(e){p=null}
  return{existe:true,p,xp:+(f.xp&&f.xp.integerValue||0),grupo:f.g&&f.g.stringValue||'',updateTime:d.updateTime};
}
async function nubeEscribir(code,keepalive){
  const p=paraSubir();
  const body={writes:[{update:{name:docPath(code),fields:{p:{stringValue:p},xp:{integerValue:String(P.xp)}}},
    updateMask:{fieldPaths:['p','xp']},updateTransforms:[{fieldPath:'t',setToServerValue:'REQUEST_TIME'}],
    currentDocument:NUBE.updateTime?{updateTime:NUBE.updateTime}:{exists:true}}]};
  const r=await fetch(`${FB.base}/projects/${FB.projectId}/databases/(default)/documents:commit?key=${FB.apiKey}`,
    {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body),keepalive:!!keepalive});
  if(r.ok){const d=await r.json();NUBE.updateTime=d.writeResults&&d.writeResults[0]&&d.writeResults[0].updateTime||null;NUBE.subido=p;return 'ok'}
  if(r.status===404)return 'borrado';
  if(r.status===400||r.status===409||r.status===403)return 'cambio';  // otro dispositivo guardó antes
  throw new Error('http '+r.status);
}

/* --- subir: combina con lo que haya en la nube y reintenta una vez --- */
async function nubeSubir(forzar,keepalive){
  if(!NUBE.code||NUBE.ocupado||NUBE.borrado)return;
  if(paraSubir()===NUBE.subido){nubeEstado('ok');return}
  if(typeof navigator!=='undefined'&&navigator.onLine===false){nubeEstado('pend');return}
  NUBE.ocupado=true;clearTimeout(NUBE.timer);NUBE.timer=null;nubeEstado('sync');
  try{
    let res=await nubeEscribir(NUBE.code,keepalive);
    if(res==='cambio'){
      const d=await nubeLeer(NUBE.code);
      if(!d.existe)res='borrado';
      else{const keep={mute:P.mute,unlockAll:P.unlockAll};P=Object.assign(mergeP(P,d.p),keep);NUBE.updateTime=d.updateTime;localSave();renderAll();res=await nubeEscribir(NUBE.code,keepalive)}
    }
    NUBE.ultimo=Date.now();
    if(res==='ok')nubeEstado('ok');
    else if(res==='borrado'){NUBE.borrado=true;nubeEstado('borrado')}
    else nubeEstado('pend');
  }catch(e){nubeEstado('pend')}
  finally{NUBE.ocupado=false}
}
function nubeProgramar(){
  if(!NUBE.code||NUBE.borrado)return;
  if(paraSubir()===NUBE.subido)return;
  nubeEstado(NUBE.estado==='off'?'off':'pend');
  if(NUBE.timer)return;
  const espera=Math.max(4000,FB.cada-(Date.now()-NUBE.ultimo));
  NUBE.timer=setTimeout(()=>{NUBE.timer=null;nubeSubir()},espera);
}

  d.querySelector('#lgGuest').addEventListener('click',()=>{lsSet(NUBE_K.sesion,'-');d.remove()});
  d.querySelector('#lgForm').addEventListener('submit',async e=>{e.preventDefault();
    const code=inp.value.trim().toUpperCase(),go=d.querySelector('#lgGo');
    const wait=Math.ceil((NUBE.bloqHasta-Date.now())/1000);
    if(wait>0){msg.textContent=`Demasiados intentos. Espera ${wait} s y vuelve a probar.`;return}
    if(!CODE_RX.test(code)){inp.classList.add('bad');msg.textContent=code.length<5?'El código tiene 5 caracteres.':'Revisa el código: no usa O, 0, I, 1 ni L.';return}
    go.disabled=true;go.textContent='Buscando tu código…';
    const r=await loginCon(code);
    go.disabled=false;go.textContent='Entrar';
    if(r==='ok'){d.remove();return}
    inp.classList.add('bad');
    if(r==='noexiste'){NUBE.fallos++;if(NUBE.fallos>=5){NUBE.fallos=0;NUBE.bloqHasta=Date.now()+30000}msg.textContent='Ese código no existe. Revísalo con tu docente.'}
    else msg.textContent='No hay conexión. Revisa internet o juega sin código por ahora.';
  });
  setTimeout(()=>inp.focus(),60);
}
async function loginCon(code){
  let d=null;
  try{d=await nubeLeer(code)}catch(e){
    const loc=cargarLocal(NUBE_K.cod(code));if(!loc)return 'red';
    entrar(code,loc,null,null);nubeEstado('off');return 'ok';
  }
  if(!d.existe)return 'noexiste';
  const loc=cargarLocal(NUBE_K.cod(code));
  entrar(code,loc,d.p,d.updateTime);
  const inv=cargarLocal(NUBE_K.invitado);
  if(inv&&inv.xp>0&&!loc)ofrecerSumar(inv);
  return 'ok';
}
function entrar(code,loc,nube,updateTime){
  const m=P.mute;
  NUBE.code=code;NUBE.borrado=false;NUBE.updateTime=updateTime;
  KEY=NUBE_K.cod(code);lsSet(NUBE_K.sesion,code);
  P=mergeP(loc||P0(),nube);P.mute=loc?loc.mute:m;P.unlockAll=loc?!!loc.unlockAll:false;
  NUBE.subido=nube?(()=>{const o=sanP(nube);delete o.mute;delete o.unlockAll;return JSON.stringify(o)})():'';nubePlays=P.plays;
  localSave();nubeEstado(paraSubir()===NUBE.subido?'ok':'pend');
  window.scrollTo(0,0);showView('map');renderAll();renderHelp();typeof renderLab==='function'&&renderLab();
  if(paraSubir()!==NUBE.subido)nubeSubir(true);
}
function ofrecerSumar(inv){
  const t=document.createElement('div');t.className='sumar';t.setAttribute('role','dialog');t.setAttribute('aria-label','Progreso sin código');
  t.innerHTML=`<p>En este dispositivo hay progreso sin código (<b>${inv.xp} XP</b>). ¿Lo sumamos a tu código?</p><div class="row"><button type="button" class="btn primary small" data-s="1">Sumarlo</button><button type="button" class="btn small" data-s="0">No, gracias</button></div>`;
  document.body.appendChild(t);
  t.addEventListener('click',e=>{const b=e.target.closest('[data-s]');if(!b)return;
    if(b.dataset.s==='1'){const keep={mute:P.mute,unlockAll:P.unlockAll};P=Object.assign(mergeP(P,inv),keep);localSave();lsDel(NUBE_K.invitado);renderAll();nubeSubir(true)}
    t.remove()});
}

/* --- eventos: conexión y cierre --- */
if(typeof window!=='undefined'){
  window.addEventListener('online',()=>{if(NUBE.code&&NUBE.estado!=='ok')nubeSubir(true)});
  window.addEventListener('offline',()=>{if(NUBE.code)nubeEstado('off')});
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'&&NUBE.code)nubeSubir(true,true)});
  window.addEventListener('pagehide',()=>{if(NUBE.code)nubeSubir(true,true)});
}

/* --- arranque --- */
function nubeArranque(){
  const s=lsGet(NUBE_K.sesion);
  if(s&&CODE_RX.test(s)){
    const loc=cargarLocal(NUBE_K.cod(s));
    NUBE.code=s;KEY=NUBE_K.cod(s);P=loc||Object.assign(P0(),{mute:P.mute});nubePlays=P.plays;nubeEstado('sync');
    init();
    nubeLeer(s).then(d=>{
      if(!d.existe){NUBE.borrado=true;nubeEstado('borrado');return}
      const keep={mute:P.mute,unlockAll:P.unlockAll};P=Object.assign(mergeP(P,d.p),keep);NUBE.updateTime=d.updateTime;
      const o=sanP(d.p);delete o.mute;delete o.unlockAll;NUBE.subido=d.p?JSON.stringify(o):'';
      localSave();renderAll();nubeEstado(paraSubir()===NUBE.subido?'ok':'pend');if(paraSubir()!==NUBE.subido)nubeSubir(true);
    }).catch(()=>nubeEstado('off'));
    return;
  }
  init();
  if(s!=='-')loginAbrir();
}

/* ===== ARRANQUE ===== */
if(typeof document!=='undefined'&&document.getElementById('v-map'))nubeArranque();
</script>
