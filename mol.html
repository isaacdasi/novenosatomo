<head>

<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
img{max-width:100%}
[hidden]{display:none!important}
/* encabezado del mapa: nivel, XP y estrellas */
.rankcard{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px 14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px}
.rkbadge{width:66px;height:66px;border-radius:50%;background:var(--ink);color:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;box-shadow:0 0 0 4px var(--sunk),0 0 0 6px var(--gold)}
.rkbadge small{font-size:9px;letter-spacing:.14em;font-weight:700}
.rkbadge b{font-family:var(--f-display);font-size:30px;font-weight:800}
.rkinfo{display:flex;flex-direction:column;gap:6px;min-width:0}
.rkn{font-family:var(--f-display);font-weight:800;font-size:22px;letter-spacing:-.01em;line-height:1.1}
.rkn small{display:block;font-family:var(--f-mono);font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin-bottom:2px}
.rkinfo .rs{font-size:13px;color:var(--muted);font-family:var(--f-mono)}
.rkstars{grid-column:1/-1;display:flex;align-items:center;gap:10px 14px;border-top:1px solid var(--line);padding-top:12px;flex-wrap:wrap}
.rkst{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-mono);background:var(--gold-soft);border-radius:999px;padding:4px 12px 4px 8px}
.rkst .ico{width:22px;height:22px}
.rkst b{font-size:20px}
.rkst small{color:var(--muted);font-size:13px}
.rkgoal{font-size:14px;color:var(--muted);flex:1 1 200px;min-width:0}
.rkgoal b{color:var(--ink)}
.gobtn{justify-content:space-between;text-align:left;min-height:68px;padding:10px 12px 10px 20px;box-shadow:0 4px 0 var(--muted);animation:nudge 3.4s ease-in-out 1.2s infinite}
.gobtn .gotx{display:flex;flex-direction:column;gap:2px;min-width:0}
.gobtn small{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;opacity:.75}
.gobtn b{font-family:var(--f-display);font-size:19px;font-weight:800;line-height:1.15}
.gobtn .goic{width:44px;height:44px;border-radius:50%;background:var(--surface);color:var(--ink);display:grid;place-items:center;flex:0 0 auto}
.gobtn .goic .ico{width:22px;height:22px}
.tile.next{animation:dopa 4s linear infinite alternate,dopahue 9s linear infinite,nudge 3.4s ease-in-out 1.6s infinite}
@media (prefers-reduced-motion:reduce){.tile.next,.tile.next::after{animation:none}}
@keyframes nudge{0%,76%,100%{transform:none}80%{transform:translateX(-3px) rotate(-1.5deg)}84%{transform:translateX(3px) rotate(1.5deg)}88%{transform:translateX(-2px) rotate(-1deg)}92%{transform:translateX(2px) rotate(.8deg)}96%{transform:none}}
.albtn{display:flex;align-items:center;gap:12px;width:100%;border:2px solid var(--ink);border-radius:18px;background:var(--surface);padding:10px 12px;cursor:pointer;text-align:left;color:var(--ink);box-shadow:0 3px 0 var(--ink);font:inherit}
.albtn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.albicon{width:46px;height:46px;border-radius:14px;background:var(--gold-soft);color:var(--ink);display:grid;place-items:center;flex:0 0 auto}
.albicon .ico{width:26px;height:26px}
.altx{flex:1;display:flex;flex-direction:column;gap:4px;min-width:0}
.altx b{font-family:var(--f-display);font-size:18px;font-weight:800;line-height:1.1}
.altx .mono{font-size:13px;color:var(--muted)}
.albar{height:7px;background:var(--sunk);border-radius:4px;overflow:hidden}
.albar i{display:block;height:100%;background:var(--gold);border-radius:4px}
.alminis{display:flex;padding-left:8px;flex:0 0 auto}
.alminis i{font-style:normal;font-family:var(--f-mono);font-weight:700;font-size:12px;width:30px;height:36px;border-radius:7px;display:grid;place-items:center;border:2px solid var(--surface);margin-left:-9px;color:var(--cat-ink);background:var(--sunk);box-shadow:0 1px 3px var(--shadow)}
.alminis i:nth-child(odd){transform:rotate(-6deg)} .alminis i:nth-child(even){transform:rotate(5deg) translateY(-2px)}
@media (max-width:400px){.alminis i:nth-child(n+4){display:none}}


/* revelado de elementos nuevos (siempre oscuro, a propósito) */
.reveal{position:fixed;inset:0;z-index:45;background:rgba(7,11,17,.93);color:#F3F6F9;display:flex;align-items:center;justify-content:center;padding:calc(20px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));overflow:hidden;cursor:pointer;animation:rvfade .2s ease-out}
.rv-in{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;max-width:420px;width:100%}
.rv-count{font-family:var(--f-mono);font-size:13px;letter-spacing:.1em;color:#9AA7B4;min-height:18px}
.rv-stage{position:relative;width:260px;height:240px;display:grid;place-items:center}
.rv-rays{position:absolute;inset:-60px;border-radius:50%;background:repeating-conic-gradient(from 0deg,color-mix(in srgb,var(--rc) 55%,transparent) 0deg 9deg,transparent 9deg 22deg);-webkit-mask:radial-gradient(circle,#000 18%,transparent 66%);mask:radial-gradient(circle,#000 18%,transparent 66%);opacity:0;transform:scale(.4);transition:opacity .4s,transform .5s cubic-bezier(.2,1.4,.4,1);animation:rvspin 9s linear infinite}
.rv-box{position:absolute;width:118px;height:132px;border-radius:18px;border:3px solid #F3F6F9;background:#1B2430;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:64px;color:#F3F6F9;box-shadow:0 0 40px rgba(255,255,255,.18);animation:rvshake .75s ease-in-out;transition:transform .25s ease-in,opacity .25s ease-in}
.rv-prize{position:absolute;opacity:0;transform:scale(.2) rotate(-20deg);transition:transform .55s cubic-bezier(.2,1.6,.4,1),opacity .2s}
.rv-tile{display:grid;grid-template-rows:auto 1fr auto;justify-items:center;align-items:center;width:136px;height:150px;border-radius:18px;border:3px solid #F3F6F9;color:var(--cat-ink);padding:8px 8px 10px;box-shadow:0 0 0 6px rgba(255,255,255,.08),0 18px 50px rgba(0,0,0,.5)}
.rv-tile small{justify-self:start;font-family:var(--f-mono);font-size:16px;font-weight:700}
.rv-tile b{font-family:var(--f-display);font-size:58px;font-weight:800;line-height:1}
.rv-tile i{font-style:normal;font-size:14px;font-weight:600}
.rv-badge{width:130px;height:130px;border-radius:50%;display:grid;place-items:center;background:var(--gold);color:#1B1300;box-shadow:0 0 0 8px rgba(242,193,78,.25),0 18px 50px rgba(0,0,0,.5)}
.rv-badge .ico{width:70px;height:70px}
.rv-txt{display:flex;flex-direction:column;gap:4px;opacity:0;transform:translateY(12px);transition:opacity .35s .15s,transform .35s .15s}
.rv-kick{font-family:var(--f-mono);font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#F2C14E}
.rv-txt h2{font-size:34px;font-weight:800;letter-spacing:-.02em;color:#F3F6F9}
.rv-sub{color:#B9C4CF;font-size:15px}
.rv-btns{display:flex;flex-direction:column;align-items:center;gap:4px;width:100%;max-width:300px;opacity:0;transition:opacity .3s .3s}
.reveal .btn.primary{background:#F3F6F9;border-color:#F3F6F9;color:#0E141A}
.reveal .btn.link{color:#B9C4CF}
.reveal.open .rv-box{transform:scale(1.7);opacity:0}
.reveal.open .rv-prize{opacity:1;transform:none}
.reveal.open .rv-rays{opacity:1;transform:none}
.reveal.open .rv-txt{opacity:1;transform:none}
.reveal.open .rv-btns{opacity:1}
@keyframes rvspin{to{rotate:360deg}}
@keyframes rvfade{from{opacity:0}}
@keyframes rvshake{0%,100%{transform:none}10%{transform:rotate(-8deg) scale(1.02)}20%{transform:rotate(8deg) scale(1.04)}30%{transform:rotate(-10deg) scale(1.06)}40%{transform:rotate(10deg) scale(1.08)}50%{transform:rotate(-12deg) scale(1.1)}60%{transform:rotate(12deg) scale(1.12)}70%{transform:rotate(-8deg) scale(1.14)}80%{transform:rotate(6deg) scale(1.16)}90%{transform:scale(1.2)}}
@media (prefers-reduced-motion:reduce){.rv-box{display:none}}

/* salir · llama de los desafíos · químicos · visor de niveles · guía */
.flame{display:block;width:100%;height:100%}
.btn .flame{display:inline-block;width:16px;height:22px;flex:0 0 auto;vertical-align:-4px}
.flame .fo{fill:#F2762E}.flame .fi{fill:#FFD25A}
.tflame{position:absolute;top:-8px;right:-6px;width:16px;height:22px;pointer-events:none;transform-origin:50% 100%;animation:flick 7s ease-in-out infinite}
.tflame.big{width:20px;height:27px;top:-10px;right:-4px}
.final{position:relative}
.pflame{width:22px;height:30px;flex:0 0 auto;transform-origin:50% 100%;animation:flick 2.6s ease-in-out infinite}
@keyframes flick{0%,70%,100%{transform:none}74%{transform:scale(1.15,1.25) skewX(-6deg)}78%{transform:scale(.95,1.05) skewX(5deg)}82%{transform:scale(1.1,1.2) skewX(-3deg)}88%{transform:scale(1,1.08)}}
.flare{position:fixed;bottom:calc(-10px + env(safe-area-inset-bottom,0px));width:76px;height:104px;margin-left:-38px;z-index:30;pointer-events:none;transform-origin:50% 100%;animation:flare 1.9s ease-out forwards;filter:drop-shadow(0 0 18px rgba(242,118,46,.6))}
@keyframes flare{0%{transform:translateY(40px) scale(.3);opacity:0}18%{opacity:1;transform:translateY(-30px) scale(1.1,1.25)}35%{transform:translateY(-60px) scale(.95,1.1) skewX(6deg)}55%{transform:translateY(-110px) scale(1,1.15) skewX(-5deg);opacity:.9}100%{transform:translateY(-240px) scale(.4);opacity:0}}
@media (prefers-reduced-motion:reduce){.tflame,.pflame{animation:none}}
.chav{position:relative;display:inline-grid;place-items:center;border-radius:50%;overflow:hidden;background:var(--sunk);color:var(--ink);flex:0 0 auto;width:48px;height:48px}
.chav .catface{width:70%;height:70%;display:block}
.chav .chini{font-family:var(--f-display);font-weight:800;font-size:18px;letter-spacing:-.02em}
.chav .chimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;image-rendering:auto}
.chav.lg{width:66px;height:66px}.chav.lg .chini{font-size:24px}
.chav.xl{width:150px;height:150px;border:4px solid #F2C14E;background:#1B2430;color:#F3F6F9;box-shadow:0 0 0 8px rgba(242,193,78,.25),0 18px 50px rgba(0,0,0,.5)}.chav.xl .chini{font-size:54px}
.rkav{position:relative;border:0;padding:0;background:none;cursor:pointer;border-radius:50%;box-shadow:0 0 0 4px var(--sunk),0 0 0 6px var(--gold)}
.rkav .rknum{position:absolute;right:-6px;bottom:-4px;min-width:26px;height:26px;border-radius:13px;background:var(--ink);color:var(--surface);font-family:var(--f-display);font-weight:800;font-size:14px;display:grid;place-items:center;border:2px solid var(--surface);padding:0 5px}
.rklv{font-size:13px;padding:2px 0}
.lvls{position:fixed;inset:0;z-index:50;background:rgba(10,16,24,.5);display:flex;align-items:flex-end;justify-content:center}
.lvpanel{background:var(--surface);width:min(560px,100%);max-height:88vh;overflow-y:auto;border-radius:24px 24px 0 0;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
@media (min-width:600px){.lvls{align-items:center}.lvpanel{border-radius:24px}}
.lvhead{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;margin-bottom:10px}
.lvhead .sub{margin:2px 0 0;color:var(--muted);font-size:14px}
.lvlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.lv{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;border:1.5px solid var(--line);border-radius:16px;padding:10px 12px;opacity:.6}
.lv.got{opacity:1}
.lv.cur{border:2.5px solid var(--gold);background:var(--gold-soft);opacity:1}
.lvtx{display:flex;flex-direction:column;gap:2px;min-width:0}
.lvn{font-family:var(--f-display);font-weight:800;font-size:17px;line-height:1.15}
.lvn small{display:block;font-family:var(--f-mono);font-size:11px;font-weight:600;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.lvy{font-family:var(--f-body);font-weight:500;font-size:12px;color:var(--muted)}
.lvd{font-size:13px;color:var(--muted);line-height:1.35}
.lvneed{display:flex;align-items:center;gap:3px;font-family:var(--f-mono);font-size:14px}
.lvneed .ico{width:16px;height:16px}
.guia{position:fixed;inset:0;z-index:70;background:var(--bg);display:flex;align-items:center;justify-content:center;overflow-y:auto;padding:calc(20px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.gcard{width:100%;max-width:440px;background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:18px 22px 20px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px}
.gcard h2{font-size:26px;font-weight:800;letter-spacing:-.02em;margin:4px 0 0;text-wrap:balance}
.gcard p{margin:0;font-size:16px;max-width:36ch}
.gcard .gnote{font-size:14px;color:var(--muted);background:var(--sunk);border-radius:12px;padding:10px 12px}
.gtop{display:flex;align-items:center;justify-content:space-between;width:100%;min-height:36px}
.gtop .ldots{display:flex;gap:6px}
.gtop .ldots i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.gtop .ldots i.on{background:var(--ink);width:22px;border-radius:4px}
.gbtns{display:flex;gap:10px;width:100%;margin-top:6px}
.gbtns .btn.primary{flex:1}
.gv{min-height:150px;display:grid;place-items:center}
.gblocks{display:flex;flex-direction:column;gap:6px;width:100%}
.gblocks span{display:flex;gap:10px;align-items:baseline;border:1.5px solid var(--line);border-radius:12px;padding:8px 12px;text-align:left}
.gblocks b{font-family:var(--f-mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);flex:0 0 auto}
.gstars{display:flex;align-items:center;gap:6px;min-height:60px}
.gstars .ico{width:28px;height:28px}
.gplus{font-size:22px;color:var(--muted);margin:0 4px}
.gcol{display:flex;align-items:center;gap:14px;min-height:60px}

.exitbtn{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;height:44px;padding:0 12px 0 9px;font:inherit;font-size:14px;font-weight:600;cursor:pointer;flex:0 0 auto}
.exitbtn .ico{width:18px;height:18px}
.tclose{flex:0 0 auto!important;width:40px;display:grid;place-items:center;color:var(--muted)!important}
.tclose .ico{width:18px;height:18px}
.btn .flame{display:inline-block;width:16px;height:22px;flex:0 0 auto;vertical-align:-4px}
.chav .catface{width:70%;height:70%;display:block}
.askn{margin:4px 0 -4px;font-weight:600}
.chalbtn{border:0!important;color:#fff!important;font-weight:800!important;font-size:19px!important;letter-spacing:.02em;gap:10px;background:linear-gradient(90deg,#B3001B,#FF2D2D,#FF7A00,#FF2D2D,#B3001B);background-size:300% 100%;text-shadow:0 1px 3px rgba(0,0,0,.4);animation:dopa 1.8s linear infinite,chalpulse 1.1s ease-in-out infinite}
.chalbtn .flame{width:20px!important;height:27px!important;animation:flick 1.3s ease-in-out infinite}
@keyframes chalpulse{0%,100%{box-shadow:0 0 0 0 rgba(255,45,45,.7),0 4px 0 #7A0012}50%{box-shadow:0 0 0 10px rgba(255,45,45,0),0 0 28px 6px rgba(255,90,0,.55),0 4px 0 #7A0012}}
@keyframes dopa{0%{background-position:0% 50%}100%{background-position:100% 50%}}
@keyframes dopahue{0%{filter:hue-rotate(0deg) saturate(1.1)}100%{filter:hue-rotate(360deg) saturate(1.1)}}
.tile.next .tl,.tile.next .tnum{color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.35)}
.tile.next .st-on{fill:#fff;stroke:#fff}.tile.next .st-off{stroke:#fff}
.ttabs{display:flex;gap:4px;background:var(--sunk);border-radius:12px;padding:3px}
.ttabs button{flex:1;border:0;background:none;border-radius:9px;min-height:40px;font-weight:600;font-size:14px;color:var(--muted);cursor:pointer}
.ttabs button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px var(--shadow)}
.block{display:flex;flex-direction:column;gap:10px}
.bhead{display:flex;align-items:baseline;gap:10px;padding-top:8px}
.bhead .bn{font-family:var(--f-mono);font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.bhead h2{font-size:22px;font-weight:800;letter-spacing:-.01em}
.final .trophy{display:flex;align-items:center;gap:6px}
.final .trophy .ico{width:28px;height:28px}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
.bdg{display:flex;gap:10px;align-items:center;border:1.5px dashed var(--line);border-radius:14px;padding:10px 12px;background:var(--surface);color:var(--muted)}
.bdg .ico{width:28px;height:28px}
.bdg div{display:flex;flex-direction:column;min-width:0}
.bdg b{color:var(--ink)}
.bdg small{font-family:var(--f-mono);font-size:12px}
.bdg.on{border:2px solid var(--ink);color:var(--ink)}

/* Mol a Mol 2.0: álbum de sustancias y reacciones, tabla de masas, misiones */
.k-el{background:var(--k-el)}.k-ox{background:var(--k-ox)}.k-ac{background:var(--k-ac)}.k-hi{background:var(--k-hi)}.k-sa{background:var(--k-sa)}.k-or{background:var(--k-or)}.k-mo{background:var(--k-mo)}
.klegend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted)}
.klegend span{display:inline-flex;align-items:center;gap:6px}
.klegend .sw{width:14px;height:14px;border-radius:4px;border:1px solid var(--line)}
.subgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}

.rxlist{display:flex;flex-direction:column;gap:8px}
.rxc{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;overflow-x:auto}
.rxc>b{font-size:15px}
.rxc.miss{border-style:dashed;color:var(--muted)}
.rxq{font-family:var(--f-mono);letter-spacing:.1em}
.alminis i{font-family:var(--f-mono);font-size:11px;width:auto;min-width:30px;padding:0 4px;color:var(--k-ink)}
.rv-tile.rv-sub{width:auto;min-width:150px;padding:14px 18px;grid-template-rows:1fr auto;color:var(--k-ink)}
.rv-tile.rv-sub b{font-family:var(--f-mono);font-size:44px;font-weight:700}
.rv-tile.rv-sub b sub{font-size:.55em}
.rv-rx{display:block;background:#F3F6F9;color:#17212B;border-radius:16px;padding:16px 14px;max-width:92vw;overflow-x:auto;box-shadow:0 0 0 6px rgba(255,255,255,.08),0 18px 50px rgba(0,0,0,.5)}
.rv-stage{width:min(320px,92vw)}
.msub{margin:4px 2px 8px;font-size:13px;color:var(--muted)}
.mgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;max-height:300px;overflow-y:auto}
.mcell{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:4px 2px;text-align:center;display:flex;flex-direction:column}

function parseFormula(str,opts={}){
  str=String(str).replace(/\s/g,'').replace(/[₀-₉]/g,c=>String(c.charCodeAt(0)-8320));
  if(!str)throw new Error('Escribe una fórmula.');
  const parts=str.split(/[·•*]/);const total={};
  for(const part of parts){
    let mult=1,body=part;const m=part.match(/^(\d+)(.+)$/);
    if(m&&parts.length>1&&part!==parts[0]){mult=opts.noParen?1:+m[1];body=m[2]}
    const c=parseGroup(body,opts);
    for(const k in c)total[k]=(total[k]||0)+c[k]*mult;
  }
  return total;
}
function parseGroup(s,opts){
  let i=0;
  function seq(){
    const out={};
    while(i<s.length&&s[i]!==')'&&s[i]!==']'){
      let grp,isPar=false;
      if(s[i]==='('||s[i]==='['){i++;grp=seq();if(s[i]!==')'&&s[i]!==']')throw new Error('Falta cerrar un paréntesis.');i++;isPar=true}
      else{const m=/^[A-Z][a-z]?/.exec(s.slice(i));if(!m)throw new Error('No reconozco "'+s.slice(i,i+3)+'". Los símbolos empiezan con mayúscula (Na, Cl, O).');
        if(!(m[0] in AM)){const one=m[0][0];if(m[0].length===2&&one in AM){grp={[one]:1};i+=1}else throw new Error('Elemento desconocido: '+m[0]+'.')}
        else{grp={[m[0]]:1};i+=m[0].length}}
      const n=/^\d+/.exec(s.slice(i));let k=1;if(n){k=+n[0];i+=n[0].length}
      if(isPar&&opts.noParen)k=1;
      for(const e in grp)out[e]=(out[e]||0)+grp[e]*k;
    }
    return out;
  }
  const r=seq();if(i<s.length)throw new Error('Sobra un paréntesis de cierre.');return r;
}

function parseRx(key,eq,ctx){

  const side=(t,sd)=>t.split(' + ').map(x=>{const m=x.trim().match(/^(\d+)?\s*(.+)\((g|l|s|aq)\)$/);const f=m[2];
    let name=NAMES[f]||f;if(f==='HCl'&&m[3]==='g')name='cloruro de hidrógeno';if(f==='H2O'&&m[3]==='g')name='vapor de agua';
    return{c:+(m[1]||1),f,st:m[3],side:sd,M:mm(f),name,h:fh(f)}});
  const reac=side(L,'r'),prod=side(R,'p');const all=reac.concat(prod);
  const sum=all.reduce((a,s)=>a+s.c,0);
  return{key,ctx,reac,prod,all,sum,trivial:all.every(s=>s.c===1),blvl:sum<=6?1:sum<=12?2:3};

function roles(A,B){

function genMM(lvl){
  const f=pick(lvl===1?P1.filter(x=>!['O2','N2','H2','Cl2'].includes(x)):lvl===2?P2:P3);const s=S(f);
  const c=parseFormula(f),np=parseFormula(f,{noParen:true}),els=Object.keys(c);const steps=[];
  if(/[(·]/.test(f)){
    const cand=els.filter(e=>np[e]!==c[e]);const e=pick(cand.length?cand:els);
    steps.push({q:`¿Cuántos átomos de ${e} hay en ${s.h}?`,type:'num',ans:c[e],unit:'átomos',tol:1e-6,
      hint:'El número de afuera del paréntesis multiplica todo lo de adentro.',
      ex:`${e}: <b>${c[e]} átomos</b>`,traps:np[e]!==c[e]?[{v:np[e],msg:'Te faltó multiplicar por el número de afuera del paréntesis.'}]:[]});
  } else {
    const e=els.reduce((a,b)=>c[a]*AM[a]>=c[b]*AM[b]?a:b);const contrib=c[e]*AM[e];
    steps.push({q:`¿Cuánto aporta el ${e}?`,type:'num',ans:contrib,unit:'g/mol',
      hint:`Masa atómica del ${e} (${fmM(AM[e])}) × cantidad de átomos de ${e}.`,
      ex:`${c[e]} × ${fmM(AM[e])} = <b>${fmM(contrib)} g/mol</b>`,traps:c[e]>1?[{v:AM[e],msg:'Esa es la masa de un solo átomo. Multiplica por el subíndice.'}]:[]});
  }
  const traps=[];const vnp=mmC(np);if(Math.abs(vnp-s.M)>0.05)traps.push({v:vnp,msg:'No multiplicaste por el número de afuera del paréntesis.'});
  const ns=Math.round(els.reduce((a,e)=>a+AM[e],0)*100)/100;if(Math.abs(ns-s.M)>0.05)traps.push({v:ns,msg:'Sumaste cada elemento una sola vez. Faltan los subíndices.'});
  if(f.includes('·'))traps.push({v:mm(f.split('·')[0]),msg:'Te faltó sumar el agua (5 H₂O).'});
  steps.push({...stepM(s,true),traps});
  return{text:`Masa molar de ${s.name}.`,vp:VP(`<span class="qs">${MS(s.h)}</span><span class="vpa">=</span>`,ASK('M')),els:[f],steps,sol:tableMM(f)};
}

function genPart(lvl){

  const pool=MOLEC.filter(f=>Object.keys(parseFormula(f)).length>1);
  if(lvl===1){

    if(v==='atm'){const s2=S(pick(pool));const c=parseFormula(s2.f);const tot=Object.values(c).reduce((x,y)=>x+y,0);
      return{text:`¿Cuántos átomos tiene una molécula de ${s2.name}?`,vp:VP(`<span class="vbig">${s2.h}</span>`),els:[],
        steps:[{q:`Átomos en 1 molécula de ${s2.h}`,type:'num',ans:tot,unit:'átomos',key:true,tol:0,hint:'Suma los subíndices (si no hay número, es 1).',ex:`${Object.entries(c).map(([e,k])=>`${e} ${k}`).join(' + ')} = <b>${tot}</b>`}]}}

    const k=pick([1,2,3,0.5,5]);const N=k*NA;
    return{text:'¿Cuántos moles son?',vp:VP(Q(fmt(N),'part',s),AR,ASK('mol',s)),consts:C,els:[],
      steps:[{q:`Moles de ${s.h}`,type:'num',ans:k,unit:'mol',key:true,hint:'¿Cuántas veces entra 6,022 × 10²³? Divide.',ex:`${fmt(N)} ÷ 6,022 × 10<sup>23</sup> = <b>${dec(k)} mol</b>`,traps:[{v:N*NA,msg:'Multiplicaste. De moléculas a moles se <b>divide</b>.'}]}]};

      steps:[{q:`Moles de átomos de ${e}`,type:'num',ans:n*c[e],unit:'mol',key:true,hint:`Cada molécula de ${s.h} tiene ${c[e]} átomo${c[e]>1?'s':''} de ${e}.`,ex:`${dec(n)} × ${c[e]} = <b>${fmt(n*c[e])} mol</b> de átomos de ${e}`,traps:c[e]>1?[{v:n,msg:`Esos son los moles de moléculas. Cada una tiene ${c[e]} átomos de ${e}.`}]:[]}]};
    const nn=roundSF(rnd(0.1,4),3),N=nn*NA,At=N*c[e];
    return{text:`¿Cuántos átomos de ${ELN[e]} hay?`,vp:VP(Q(fmt(nn),'mol',s),AR,ASK('at',null,'átomos de '+e)),els:[],consts:C,
      steps:[{q:`Moléculas de ${s.h}`,type:'num',ans:N,unit:w,sci:true,hint:'× Nₐ',ex:`${fmt(nn)} × 6,022 × 10<sup>23</sup> = <b>${fmt(N)}</b>`},
        {q:`Átomos de ${e}`,type:'num',ans:At,unit:'átomos',key:true,sci:true,hint:`Moles × Nₐ, y después × ${c[e]} (átomos de ${e} por molécula).`,ex:`${fmt(N)} × ${c[e]} = <b>${fmt(At)}</b>`,traps:c[e]>1?[{v:N,msg:`Esas son moléculas. Cada una tiene ${c[e]} átomos de ${e}.`}]:[]}]};

  return{text:'¿Cuántos gramos son?',vp:VP(Q(fmt(N),'part',s),Mq,AR,ASK('g',s)),els:[],consts:C,
    steps:[{q:`Moles de ${s.h}`,type:'num',ans:n,unit:'mol',hint:'Divide por Nₐ.',ex:`${fmt(N)} ÷ 6,022 × 10<sup>23</sup> = <b>${fmt(n)} mol</b>`,traps:[{v:N*NA,msg:'De moléculas a moles se divide por Nₐ.'}]},
      {q:`Masa de ${s.h}`,type:'num',ans:m,unit:'g',key:true,hint:'Moléculas → moles (÷ Nₐ) → gramos (× M).',ex:`${fmt(n)} mol × ${fmM(s.M)} g/mol = <b>${fmt(m)} g</b>`,traps:[{v:n/s.M,msg:'De moles a gramos se multiplica por la masa molar.'}]}],
    chain:chainHTML([fmt(N),u('moléculas',s)],[['1',u('mol',s),'6,022 × 10<sup>23</sup>',u('moléculas',s)],[fmM(s.M),u('g',s),'1',u('mol',s)]],[fmt(m),u('g',s)])};

const VQ={n:'<b class="vn">n</b>',m:'<b class="vm">m</b>',M:'<b class="vM"><span class="mb">M</span></b>'};
const EQF={n:[`${VQ.n} = ${VQ.m} ÷ ${VQ.M}`,`${VQ.n} = ${VQ.M} ÷ ${VQ.m}`,`${VQ.n} = ${VQ.m} × ${VQ.M}`],
           m:[`${VQ.m} = ${VQ.n} × ${VQ.M}`,`${VQ.m} = ${VQ.n} ÷ ${VQ.M}`,`${VQ.m} = ${VQ.M} ÷ ${VQ.n}`],
           M:[`${VQ.M} = ${VQ.m} ÷ ${VQ.n}`,`${VQ.M} = ${VQ.n} ÷ ${VQ.m}`,`${VQ.M} = ${VQ.m} × ${VQ.n}`]};
function eqFormStep(t){const order=shuffle([0,1,2]);return{q:'¿Qué ecuación usas?',type:'choice',opts:order.map(i=>EQF[t][i]),ans:order.indexOf(0),
  hint:'En el triángulo, tapa la magnitud que buscas: lo que queda te dice si divides o multiplicas.',ex:EQF[t][0],
  wrong:'Revisa con las unidades: g ÷ (g/mol) = mol, y mol × (g/mol) = g.'}}
function genEq(lvl){
  const small=P1.filter(x=>!['O2','N2','H2','Cl2'].includes(x));
  if(lvl===3&&Math.random()<0.4){
    const cands=shuffle(small.concat(P2));const s=S(cands[0]);const opts=[s];
    for(const f of cands.slice(1)){const t=S(f);if(opts.every(o=>Math.abs(o.M-t.M)/o.M>0.1))opts.push(t);if(opts.length===4)break}
    const n=roundSF(rnd(0.15,3),3),m=roundSF(n*s.M,3),Mc=m/n;const order=shuffle(opts);
    return{text:'Una sustancia desconocida: ¿cuál puede ser?',vp:VP(Q(fmt(m),'g'),'<span class="vpa">y</span>',Q(fmt(n),'mol'),AR,ASK('M')),els:order.map(o=>o.f),
      steps:[eqFormStep('M'),{q:`${MB} de la sustancia`,type:'num',ans:Mc,unit:'g/mol',hint:`${MB} = m ÷ n`,ex:`${fmt(m)} g ÷ ${fmt(n)} mol = <b>${fmt(Mc)} g/mol</b>`,
          traps:[{v:n/m,msg:`Invertiste la división: ${MB} = m ÷ n (gramos sobre moles).`},{v:m*n,msg:'Multiplicaste. La masa molar es gramos <b>por cada</b> mol: se divide.'}]},
        {q:'¿Cuál es la sustancia?',type:'choice',opts:order.map(o=>`${o.h} · ${o.name}`),ans:order.indexOf(s),key:true,
          hint:'Calcula la masa molar de cada opción y busca la que coincide.',ex:`${MB} = ${fmt(Mc)} g/mol → <b>${s.h}</b> (${fmM(s.M)} g/mol)`,
          wrong:'Calcula la masa molar de cada opción con las masas atómicas y compárala con la que obtuviste.'}],
      sol:`<p style="margin:0">${MB} = m ÷ n = ${fmt(m)} ÷ ${fmt(n)} = <b>${fmt(Mc)} g/mol</b>. La que coincide es ${s.h} (${fmM(s.M)} g/mol).</p>`};
  }
  const s=S(pick(lvl===1?small:lvl===2?small.concat(P2):P2.concat(P3)));const t=pick(['n','m','M']);const M=s.M;
  let n,m,uv=null;
  if(lvl===1){n=pick([0.5,1,1.5,2,2.5,3,4,5]);m=Math.round(n*M*100)/100}
  else if(lvl===2){n=roundSF(rnd(0.12,4.5),3);m=roundSF(n*M,3)}
  else{uv=pick(t==='n'?['mg','kg']:t==='m'?['mmol']:['mg','kg','mmol']);
    n=uv==='mg'?roundSF(rnd(0.002,0.09),3):uv==='kg'?roundSF(rnd(5,60),3):roundSF(rnd(2,90),3)/1000;m=roundSF(n*M,3)}
  const mDisp=uv==='mg'?Q(fmt(m*1000),'g',null,'mg'):uv==='kg'?Q(fmt(m/1000),'g',null,'kg'):Q(fmt(m),'g');
  const nDisp=uv==='mmol'?Q(fmt(n*1000),'mol',null,'mmol'):Q(fmt(n),'mol');
  const MDisp=Q(fmM(M),'M');
  const steps=[];
  if(uv==='mg')steps.push({q:`Pasa ${fmt(m*1000)} mg a gramos`,type:'num',ans:m,unit:'g',hint:'1000 mg = 1 g: divide por 1000.',ex:`${fmt(m*1000)} ÷ 1000 = <b>${fmt(m)} g</b>`,traps:[{v:m*1e6,msg:'Multiplicaste. Los gramos son más grandes que los miligramos: <b>divide</b> por 1000.'}]});
  if(uv==='kg')steps.push({q:`Pasa ${fmt(m/1000)} kg a gramos`,type:'num',ans:m,unit:'g',hint:'1 kg = 1000 g: multiplica por 1000.',ex:`${fmt(m/1000)} × 1000 = <b>${fmt(m)} g</b>`,traps:[{v:m/1e6,msg:'Dividiste. Un kilo tiene 1000 gramos: <b>multiplica</b> por 1000.'}]});
  if(uv==='mmol')steps.push({q:`Pasa ${fmt(n*1000)} mmol a mol`,type:'num',ans:n,unit:'mol',hint:'1000 mmol = 1 mol: divide por 1000.',ex:`${fmt(n*1000)} ÷ 1000 = <b>${fmt(n)} mol</b>`,traps:[{v:n*1e6,msg:'Multiplicaste. Un mol tiene 1000 mmol: <b>divide</b> por 1000.'}]});
  steps.push(eqFormStep(t));
  const conv=uv?[{v:(t==='n'?(uv==='mg'?m*1000/M:m/1000/M):t==='m'?n*1000*M:(uv==='mg'?m*1000/n:uv==='kg'?m/1000/n:m/(n*1000))),msg:uv==='mmol'?'Olvidaste pasar los mmol a mol.':`Olvidaste pasar los ${uv} a gramos.`}]:[];
  let key,text,vp,chain=null;
  if(t==='n'){text=`¿Cuántos moles de ${s.name} son?`;vp=VP(mDisp,`<span class="qs">${s.h}</span>`,MDisp,AR,ASK('mol'));
    key={q:`Cantidad de sustancia (n) de ${s.h}`,type:'num',ans:n,unit:'mol',key:true,hint:'n = m ÷ M̄',ex:`n = ${fmt(m)} g ÷ ${fmM(M)} g/mol = <b>${fmt(n)} mol</b>`,
      traps:[{v:m*M,msg:'Multiplicaste. Para obtener moles se <b>divide</b> la masa por la masa molar.'},{v:M/m,msg:'Invertiste la división: es m ÷ M̄.'},...conv]};
    chain=chainHTML([fmt(m),u('g',s)],[['1',u('mol',s),fmM(M),u('g',s)]],[fmt(n),u('mol',s)])}
  else if(t==='m'){text=`¿Qué masa de ${s.name} es?`;vp=VP(nDisp,`<span class="qs">${s.h}</span>`,MDisp,AR,ASK('g'));
    key={q:`Masa (m) de ${s.h}`,type:'num',ans:n*M,unit:'g',key:true,hint:'m = n × M̄',ex:`m = ${fmt(n)} mol × ${fmM(M)} g/mol = <b>${fmt(n*M)} g</b>`,
      traps:[{v:n/M,msg:'Dividiste. Para obtener gramos se <b>multiplica</b>: m = n × M̄.'},{v:M/n,msg:'La cuenta es n × M̄.'},...conv]};
    chain=chainHTML([fmt(n),u('mol',s)],[[fmM(M),u('g',s),'1',u('mol',s)]],[fmt(n*M),u('g',s)])}
  else{text='Una muestra de una sustancia. ¿Cuál es su masa molar?';vp=VP(mDisp,'<span class="vpa">y</span>',nDisp,AR,ASK('M'));
    const Ma=m/n;key={q:`Masa molar (${MB})`,type:'num',ans:Ma,unit:'g/mol',key:true,hint:'M̄ = m ÷ n',ex:`${MB} = ${fmt(m)} g ÷ ${fmt(n)} mol = <b>${fmt(Ma)} g/mol</b>`,
      traps:[{v:n/m,msg:`Invertiste la división: ${MB} = m ÷ n.`},{v:m*n,msg:'Multiplicaste. La masa molar es gramos por cada mol: se divide.'},...conv]}}
  key.hint=key.hint.replace('M̄',MB);
  steps.push(key);
  return{text,vp,els:[],steps,chain,sol:t==='M'?`<p style="margin:0">${MB} = m ÷ n = ${fmt(m)} g ÷ ${fmt(n)} mol = <b>${fmt(m/n)} g/mol</b></p>`:null};
}

function rxForLvl(lvl){const pool=RX.filter(r=>lvl===1?r.sum<=7:lvl===2?r.sum<=13:true);return pick(pool)}
function genMolMol(lvl){
  const rx=lvl===1?pick(RX.filter(r=>!r.trivial&&r.sum<=9)):rxForLvl(lvl);let A,B;[A,B]=twoSpecies(rx);
  if(lvl===1){let g=0;while(A.c===B.c&&g++<20)[A,B]=twoSpecies(rx)}

  return{text:roles(A,B)+(rx.reac.length>1?' El resto está en exceso.':''),vp:VP(Q(fmt(nA),'mol',A),AR,ASK('mol',B)),rx,ctx:rx.ctx,els:[],

      ex:`${B.c} ÷ ${A.c} = <b>${fmt(B.c/A.c)}</b>`,traps:A.c!==B.c?[{v:A.c/B.c,msg:'Invertida: arriba lo que buscas, abajo lo que tienes.'}]:[]},ratioStep(A,B,nA,true)],

/* ---------- Leer una ecuación (guía de Estequiometría, ejercicios 1-4) ---------- */
const COMB_KEYS=['ch4','c2h6','c3h8','c4h10','etanol','metanol','glu','octano'];
const sideTxt=xs=>xs.map(x=>x.h).join(' + ');
function readStep(A,B,key){const verb=B.side==='r'?'reaccionan':'se forman';
  return{q:`Por cada ${A.c} mol de ${A.h}, ¿cuántos mol de ${B.h} ${verb}?`,type:'num',ans:B.c,unit:'mol',tol:0,key:!!key,hint:'Lee el coeficiente que está delante de cada sustancia: son moles.',ex:`El coeficiente de ${B.h} es <b>${B.c}</b>.`,
    traps:A.c!==B.c?[{v:A.c,msg:`Ese es el coeficiente de ${A.h}. Busca el de ${B.h}.`}]:[]}}
function genLect(lvl){
  if(lvl===1){
    const rx=pick(RX.filter(r=>r.reac.length>=1&&r.prod.length>=1&&r.all.length<=4&&!r.trivial));const A=rx.reac[0];
    const others=rx.all.filter(x=>x!==A);const B=pick(others.filter(x=>x.side==='r').length?others.filter(x=>x.side==='r'):others);const Cc=pick(rx.prod.filter(x=>x!==B));
    const mix=[rx.reac[0],rx.prod[0]];const opts=shuffle([sideTxt(rx.reac),sideTxt(rx.prod),sideTxt(mix)]);
    const steps=[{q:'¿Cuáles son los reactivos?',type:'choice',opts,ans:opts.indexOf(sideTxt(rx.reac)),key:true,hint:'Los reactivos están a la izquierda de la flecha; los productos, a la derecha.',ex:`Reactivos: <b>${sideTxt(rx.reac)}</b> · productos: ${sideTxt(rx.prod)}`,wrong:'Los reactivos son lo que está antes de la flecha.'},
      readStep(A,B,true)];
    if(Cc&&Cc!==B)steps.push(readStep(A,Cc,true));
    const lect=`${rx.reac.map(x=>`${x.c} mol de ${x.h}`).join(' reaccionan con ')} para dar ${rx.prod.map(x=>`${x.c} mol de ${x.h}`).join(' y ')}`;
    return{text:'Lee la ecuación en cantidad química.',rx,ctx:rx.ctx,els:[],steps,sol:`<p style="margin:0">Se lee: «${lect}».</p>`};
  }
  if(lvl===2){
    const rx=pick(RX.filter(r=>!r.trivial&&r.blvl<=2&&r.all.length<=5));const[A,B]=twoSpecies(rx);
    return{text:'Balancea la ecuación y léela en cantidad química.',ctx:rx.ctx,rx,showEq:false,els:[],
      steps:[{q:'Balancéala: toca − y + hasta que cada elemento quede igual a los dos lados.',type:'coef',rx,ans:rx.all.map(s=>s.c),key:true,hint:'Primero metales, luego no metales, después H y al final O.'},
        {q:`Lectura: por cada mol de ${A.h}, ¿cuántos mol de ${B.h}?`,type:'num',ans:B.c/A.c,unit:'mol',key:true,hint:`Coeficiente de ${B.h} ÷ coeficiente de ${A.h}.`,ex:`${B.c} ÷ ${A.c} = <b>${fmt(B.c/A.c)}</b>`,traps:A.c!==B.c?[{v:A.c/B.c,msg:'Al revés: el coeficiente de lo que buscas va arriba.'}]:[]}],
      sol:eqHTML(rx)};
  }
  /* nivel 3: combustión completa (ejercicio 2 de la guía) */
  const rx=RXK[pick(COMB_KEYS.filter(k=>RXK[k]))];const fuel=rx.reac.find(x=>x.f!=='O2'),O2=rx.reac.find(x=>x.f==='O2');
  const prods=['CO₂ y H₂O','CO y H₂','C y H₂O','CO₂ y H₂'];const order=shuffle(prods);
  return{text:`Plantea la combustión completa del ${fuel.name} (${fuel.h}).`,ctx:'con suficiente oxígeno',rx,showEq:false,els:[],
    steps:[{q:'¿Qué productos forma la combustión completa?',type:'choice',opts:order,ans:order.indexOf(prods[0]),key:true,hint:'El carbono termina en dióxido de carbono y el hidrógeno, en agua.',ex:'Combustión completa: <b>CO₂ y H₂O</b>.',wrong:'En una combustión completa, todo el C pasa a CO₂ y todo el H a H₂O.'},
      {q:'Balancea la combustión.',type:'coef',rx,ans:rx.all.map(s=>s.c),key:true,hint:'Primero el C, después el H y al final el O.'},
      {q:`¿Cuántos mol de O₂ reaccionan por cada mol de ${fuel.h}?`,type:'num',ans:O2.c/fuel.c,unit:'mol',key:true,hint:`Coeficiente de O₂ ÷ coeficiente de ${fuel.h}.`,ex:`${O2.c} ÷ ${fuel.c} = <b>${fmt(O2.c/fuel.c)} mol</b>`}],
    sol:eqHTML(rx)};
}

/* ---------- Moléculas, litros y kilos (guía de Estequiometría) ---------- */
const VMC='V<sub>m</sub> = 22,4 L/mol (CN)';
function genVol(lvl){
  const MqS=s=>Q(fmM(s.M),'M',null,`g/mol <span class="qs">${s.h}</span>`);
  const gasRx=RX.filter(r=>r.all.some(x=>x.st==='g'));
  const pickAB=(rx,needGasB)=>{let A,B,g=0;do{[A,B]=twoSpecies(rx);g++}while(g<60&&(needGasB&&B.st!=='g'));return[A,B]};
  const rStep=(A,B,nA)=>ratioStep(A,B,nA,false);
  const v=lvl===1?pick(['molN','molV']):lvl===2?pick(['NgB','mV','mN']):pick(['kgMol','tMass','mVreac']);
  const rx=pick(v==='molV'||v==='mV'||v==='mVreac'?gasRx:RX.filter(r=>!r.trivial||r.all.length>2));
  const[A,B]=pickAB(rx,v==='molV'||v==='mV'||v==='mVreac');
  const base={rx,ctx:rx.ctx,els:[]};
  const head=roles(A,B)+(rx.reac.length>1?' El resto está en exceso.':'');
  if(v==='molN'){const nA=roundSF(rnd(0.2,6),3),nB=nA*B.c/A.c,N=nB*NA;
    return{...base,text:head,vp:VP(Q(fmt(nA),'mol',A),AR,ASK('part',B)),consts:['Nₐ = 6,022 × 10²³'],
      steps:[rStep(A,B,nA),{q:`Moléculas de ${B.h}`,type:'num',ans:N,unit:'moléculas',key:true,sci:true,hint:'Razón molar y después × Nₐ.',ex:`${fmt(nB)} mol × 6,022 × 10<sup>23</sup> = <b>${fmt(N)}</b>`,traps:[{v:nA*NA,msg:'Faltó la razón molar (los coeficientes).'}]}],
      chain:chainHTML([fmt(nA),u('mol',A)],[[B.c,u('mol',B),A.c,u('mol',A)],['6,022 × 10<sup>23</sup>',u('moléculas',B),'1',u('mol',B)]],[fmt(N),u('moléculas',B)])}}
  if(v==='molV'){const nA=roundSF(rnd(0.2,6),3),nB=nA*B.c/A.c,V=nB*VM;
    return{...base,text:head+' Da el volumen del gas en condiciones normales.',vp:VP(Q(fmt(nA),'mol',A),AR,ASK('L',B)),consts:[VMC],
      steps:[rStep(A,B,nA),{q:`Volumen de ${B.h} (CN)`,type:'num',ans:V,unit:'L',key:true,hint:'En condiciones normales, cada mol de gas ocupa 22,4 L.',ex:`${fmt(nB)} mol × 22,4 L/mol = <b>${fmt(V)} L</b>`,traps:[{v:nA*VM,msg:'Faltó la razón molar.'},{v:nB/VM,msg:'Dividiste. De moles a litros se <b>multiplica</b> por 22,4.'}]}],
      chain:chainHTML([fmt(nA),u('mol',A)],[[B.c,u('mol',B),A.c,u('mol',A)],['22,4',u('L',B),'1',u('mol',B)]],[fmt(V),u('L',B)])}}
  if(v==='NgB'){const N=roundSF(rnd(1,9),3)*Math.pow(10,ri(22,24)),nA=N/NA,nB=nA*B.c/A.c,mB=nB*B.M;
    return{...base,text:head,vp:VP(Q(fmt(N),'part',A),AR,ASK('g',B),MqS(B)),consts:['Nₐ = 6,022 × 10²³'],
      steps:[{q:`Moles de ${A.h}`,type:'num',ans:nA,unit:'mol',hint:'Divide por Nₐ.',ex:`${fmt(N)} ÷ 6,022 × 10<sup>23</sup> = <b>${fmt(nA)} mol</b>`,traps:[{v:N*NA,msg:'De moléculas a moles se divide.'}]},rStep(A,B,nA),
        {q:`Masa de ${B.h}`,type:'num',ans:mB,unit:'g',key:true,hint:'moléculas → mol A → mol B → gramos.',ex:`${fmt(nB)} mol × ${fmM(B.M)} g/mol = <b>${fmt(mB)} g</b>`,traps:[{v:nA*B.M,msg:'Faltó la razón molar.'}]}],
      chain:chainHTML([fmt(N),u('moléculas',A)],[['1',u('mol',A),'6,022 × 10<sup>23</sup>',u('moléculas',A)],[B.c,u('mol',B),A.c,u('mol',A)],[fmM(B.M),u('g',B),'1',u('mol',B)]],[fmt(mB),u('g',B)])}}
  if(v==='mN'){const mA=roundSF(rnd(0.2,3)*A.M,3),nA=mA/A.M,nB=nA*B.c/A.c,N=nB*NA;
    return{...base,text:head,vp:VP(Q(fmt(mA),'g',A),MqS(A),AR,ASK('part',B)),consts:['Nₐ = 6,022 × 10²³'],
      steps:[stepN(A,mA),rStep(A,B,nA),{q:`Moléculas de ${B.h}`,type:'num',ans:N,unit:'moléculas',key:true,sci:true,hint:'g → mol A → mol B → × Nₐ.',ex:`${fmt(nB)} × 6,022 × 10<sup>23</sup> = <b>${fmt(N)}</b>`,traps:[{v:nA*NA,msg:'Faltó la razón molar.'},{v:mA*NA,msg:'Primero pasa los gramos a moles.'}]}],
      chain:chainHTML([fmt(mA),u('g',A)],[['1',u('mol',A),fmM(A.M),u('g',A)],[B.c,u('mol',B),A.c,u('mol',A)],['6,022 × 10<sup>23</sup>',u('moléculas',B),'1',u('mol',B)]],[fmt(N),u('moléculas',B)])}}
  if(v==='mV'||v==='mVreac'){const mA=roundSF(rnd(0.2,3)*A.M,3),nA=mA/A.M,nB=nA*B.c/A.c,V=nB*VM;
    return{...base,text:head+' Da el volumen del gas en condiciones normales.',vp:VP(Q(fmt(mA),'g',A),MqS(A),AR,ASK('L',B)),consts:[VMC],
      steps:[stepN(A,mA),rStep(A,B,nA),{q:`Volumen de ${B.h} (CN)`,type:'num',ans:V,unit:'L',key:true,hint:'g → mol A → mol B → × 22,4 L/mol.',ex:`${fmt(nB)} mol × 22,4 L/mol = <b>${fmt(V)} L</b>`,traps:[{v:nA*VM,msg:'Faltó la razón molar.'},{v:mA*VM,msg:'Primero pasa los gramos a moles.'}]}],
      chain:chainHTML([fmt(mA),u('g',A)],[['1',u('mol',A),fmM(A.M),u('g',A)],[B.c,u('mol',B),A.c,u('mol',A)],['22,4',u('L',B),'1',u('mol',B)]],[fmt(V),u('L',B)])}}
  if(v==='kgMol'){const kg=roundSF(rnd(0.2,9),2),mA=kg*1000,nA=mA/A.M,nB=nA*B.c/A.c;
    return{...base,text:head,vp:VP(Q(dec(kg),'g',A,'kg'),MqS(A),AR,ASK('mol',B)),
      steps:[{q:`Pasa ${dec(kg)} kg a gramos`,type:'num',ans:mA,unit:'g',hint:'1 kg = 1000 g: multiplica por 1000.',ex:`${dec(kg)} × 1000 = <b>${fmt(mA)} g</b>`,traps:[{v:kg/1000,msg:'Dividiste. Un kilo tiene 1000 gramos: <b>multiplica</b>.'}]},
        stepN(A,mA),{...ratioStep(A,B,nA,true),traps:[{v:kg/A.M*B.c/A.c,msg:'Olvidaste pasar los kilos a gramos.'},...(A.c!==B.c?[{v:nA,msg:'Faltó la razón molar.'}]:[])]}],
      chain:chainHTML([fmt(mA),u('g',A)],[['1',u('mol',A),fmM(A.M),u('g',A)],[B.c,u('mol',B),A.c,u('mol',A)]],[fmt(nB),u('mol',B)])}}
  /* tMass: toneladas de A → toneladas de B (la proporción de masas no cambia de unidad) */
  const t=roundSF(rnd(1,150),3),mA=t*1e6,nA=mA/A.M,nB=nA*B.c/A.c,mB=nB*B.M,tB=mB/1e6;
  return{...base,text:head+' Da el resultado en toneladas.',vp:VP(Q(fmt(t),'g',A,'t'),MqS(A),AR,ASK('g',B,'t'),MqS(B)),
    steps:[{q:`Pasa ${fmt(t)} t a gramos`,type:'num',ans:mA,unit:'g',sci:true,hint:'1 t = 1000 kg = 1 000 000 g.',ex:`${fmt(t)} × 10<sup>6</sup> = <b>${fmt(mA)} g</b>`},
      stepN(A,mA),ratioStep(A,B,nA),{q:`Masa de ${B.h}`,type:'num',ans:mB,unit:'g',sci:true,hint:'mol × M',ex:`${fmt(nB)} × ${fmM(B.M)} = <b>${fmt(mB)} g</b>`},
      {q:`Masa de ${B.h} en toneladas`,type:'num',ans:tB,unit:'t',key:true,hint:'Divide por 1 000 000.',ex:`<b>${fmt(tB)} t</b>`,traps:[{v:t*B.c/A.c,msg:'Usaste los coeficientes con masas. Primero pasa a moles.'},{v:t,msg:'La masa no pasa igual de una sustancia a otra.'}]}]};
}

function genLim(lvl){
  const pool=RX.filter(r=>r.reac.length===2&&r.reac[0].f!==r.reac[1].f&&(lvl===1?r.sum<=9:true));
  const rx=pick(pool);const[A,B]=rx.reac;const prods=rx.prod.filter(p=>p.f!=='H2O');const P=pick(prods.length?prods:rx.prod);
  const r=Math.random()<0.5?rnd(0.4,0.75):rnd(1.35,2.4);
  let nA=roundSF(rnd(0.3,3),2),nB=roundSF(r*nA*B.c/A.c,2);let mA,mB;
  if(lvl>=2){mA=roundSF(nA*A.M,3);mB=roundSF(nB*B.M,3);nA=mA/A.M;nB=mB/B.M}
  const needB=nA*B.c/A.c;const lim=nB<needB?B:A,exc=lim===A?B:A;const nLim=lim===A?nA:nB,nExc=lim===A?nB:nA;
  const nP=nLim*P.c/lim.c,mP=nP*P.M;const nPexc=nExc*P.c/exc.c;
  const t=lvl===1?'mol':'g';const vA=lvl===1?nA:mA,vB=lvl===1?nB:mB;
  const steps=[];
  if(lvl>=2)steps.push(stepM(A),stepN(A,mA),stepM(B),stepN(B,mB));
  steps.push({q:`¿Cuántos mol de ${B.h} necesitas para que reaccione todo el ${A.h}?`,type:'num',ans:needB,unit:'mol',hint:`Moles de ${A.h} × <span class="co">${B.c}</span>/<span class="co">${A.c}</span>.`,
    ex:`Necesitas <b>${fmt(needB)} mol</b> y tienes ${fmt(nB)} mol de ${B.h}.`,traps:[{v:nA*A.c/B.c,msg:'Razón molar invertida.'}]});
  const smallerMassIsExc=lvl>=2&&((mA<mB?A:B)===exc);
  steps.push({q:'¿Cuál se acaba primero (limitante)?',type:'choice',opts:[`${A.h} · ${A.name}`,`${B.h} · ${B.name}`],ans:lim===A?0:1,key:true,
    hint:`Si tienes menos ${B.h} del que necesitas, ${B.h} se acaba primero.`,
    ex:`Limitante: <b>${lim.h}</b>.`,wrong:smallerMassIsExc?'Menos gramos no significa acabarse primero. Compara en <b>moles</b>.':'Compara lo que necesitas con lo que tienes.'});
  steps.push({q:`${lvl===1?'Moles':'Gramos'} de ${P.h} que se forman`,type:'num',ans:lvl===1?nP:mP,unit:t,key:true,
    hint:'El producto se calcula con el limitante.',
    ex:lvl===1?`${fmt(nLim)} × ${P.c}/${lim.c} = <b>${fmt(nP)} mol</b>`:`${fmt(nLim)} mol × ${P.c}/${lim.c} × ${fmM(P.M)} = <b>${fmt(mP)} g</b>`,
    traps:[{v:lvl===1?nPexc:nPexc*P.M,msg:'Usaste el reactivo en exceso. El producto sale del <b>limitante</b>.'},{v:lvl===1?(nPexc+nP):(nPexc+nP)*P.M,msg:'No se suman los dos reactivos: solo cuenta el limitante.'},...(lvl>1?[{v:nP,msg:'Eso está en moles; pásalo a gramos.'}]:[])]});
  if(lvl===3){const used=nLim*exc.c/lim.c,left=(nExc-used)*exc.M;
    steps.push({q:`Moles de ${exc.h} que reaccionan`,type:'num',ans:used,unit:'mol',hint:`Moles del limitante × ${exc.c}/${lim.c}.`,ex:`${fmt(nLim)} × ${exc.c}/${lim.c} = <b>${fmt(used)} mol</b>`});
    steps.push({q:`Gramos de ${exc.h} que sobran`,type:'num',ans:left,unit:'g',key:true,hint:'Sobra = había − reaccionó. Luego a gramos.',
      ex:`(${fmt(nExc)} − ${fmt(used)}) mol × ${fmM(exc.M)} = <b>${fmt(left)} g</b>`,
      traps:[{v:used*exc.M,msg:'Eso es lo que <b>reacciona</b>. Lo que sobra es lo inicial menos eso.'},{v:nExc*exc.M,msg:'Esa es la masa inicial. Réstale lo que reaccionó.'}]});}
  return{text:lvl===3?'¿Cuál se acaba primero, cuánto producto se forma y cuánto sobra?':'¿Cuál se acaba primero y cuánto producto se forma?',
    vp:VP(Q(fmt(vA),t,A),'<span class="vpa">+</span>',Q(fmt(vB),t,B),AR,ASK(t,P)),
    rx,ctx:rx.ctx,els:lvl>=2?[A.f,B.f,P.f]:[],steps,
    sol:`<div class="tw"><table class="t"><thead><tr><th>Reactivo</th><th>Hay (mol)</th><th>Coef.</th><th>mol ÷ coef.</th></tr></thead><tbody>
      <tr><td>${A.h}</td><td>${fmt(nA)}</td><td class="co">${A.c}</td><td>${fmt(nA/A.c)}</td></tr><tr><td>${B.h}</td><td>${fmt(nB)}</td><td class="co">${B.c}</td><td>${fmt(nB/B.c)}</td></tr></tbody></table></div>
      <p style="margin:0">El menor <i>mol ÷ coef.</i> es el limitante: <b>${lim.h}</b>.</p>`,
    chain:lvl>=2?chainHTML([fmt(lim===A?mA:mB),u('g',lim)],[['1',u('mol',lim),fmM(lim.M),u('g',lim)],[P.c,u('mol',P),lim.c,u('mol',lim)],[fmM(P.M),u('g',P),'1',u('mol',P)]],[fmt(mP),u('g',P)]):null};
}

function genRend(lvl){
  if(lvl===1){const S0=S(pick(P2));const th=roundSF(rnd(15,120),3),y=rnd(0.62,0.96),ac=roundSF(th*y,3),p=ac/th*100;
    return{text:`Se esperaban ${fmt(th)} g de ${S0.name} y se obtuvieron ${fmt(ac)} g. ¿Rendimiento?`,vp:VP('<span class="qs">teórico</span>',Q(fmt(th),'g'),'<span class="qs">real</span>',Q(fmt(ac),'g'),AR,ASK('pct')),els:[],
      steps:[{q:'Rendimiento',type:'num',ans:p,unit:'%',key:true,hint:'real ÷ teórico × 100',ex:`${fmt(ac)} ÷ ${fmt(th)} × 100 = <b>${fmt(p)} %</b>`,
        traps:[{v:th/ac*100,msg:'Al revés: es real ÷ teórico. No puede pasar de 100 %.'},{v:ac/th,msg:'Falta multiplicar por 100.'},{v:100-p,msg:'Ese es el porcentaje que se <b>perdió</b>.'}]}]}}
  const pool=RX.filter(r=>r.prod.some(p=>p.st!=='g'&&p.f!=='H2O'));const rx=pick(pool);
  const P=pick(rx.prod.filter(p=>p.st!=='g'&&p.f!=='H2O'));const A=pick(rx.reac);
  const mA=roundSF(rnd(0.2,2.5)*A.M,3),nA=mA/A.M,nP=nA*P.c/A.c,th=nP*P.M;
  const thStep={q:`Gramos teóricos de ${P.h}`,type:'num',ans:th,unit:'g',hint:`g ${A.h} → mol ${A.h} → mol ${P.h} → g ${P.h}.`,
    ex:`${fmt(mA)} ÷ ${fmM(A.M)} × ${P.c}/${A.c} × ${fmM(P.M)} = <b>${fmt(th)} g</b>`,traps:[{v:mA*P.M/A.M,msg:'Faltó la razón molar.'},{v:nP,msg:'Eso está en moles; pásalo a gramos.'}]};
  const v=lvl===2?pick(['p','a']):pick(['p','a','need']);
  const chain=chainHTML([fmt(mA),u('g',A)],[['1',u('mol',A),fmM(A.M),u('g',A)],[P.c,u('mol',P),A.c,u('mol',A)],[fmM(P.M),u('g',P),'1',u('mol',P)]],[fmt(th),u('g',P)+' teórico']);
  if(v==='p'){const y=rnd(0.6,0.95),ac=roundSF(th*y,3),p=ac/th*100;
    return{text:`Reacciona todo el ${A.name} y se obtienen ${fmt(ac)} g de ${P.name}. ¿Rendimiento?`,vp:VP(Q(fmt(mA),'g',A),AR,Q(fmt(ac),'g',P,'g reales'),AR,ASK('pct')),rx,ctx:rx.ctx,els:[A.f,P.f],
      steps:[stepM(A),stepN(A,mA),ratioStep(A,P,nA),{...thStep},{q:'Rendimiento',type:'num',ans:p,unit:'%',key:true,hint:'real ÷ teórico × 100',ex:`${fmt(ac)} ÷ ${fmt(th)} × 100 = <b>${fmt(p)} %</b>`,
        traps:[{v:th/ac*100,msg:'Al revés: real ÷ teórico.'},{v:ac/mA*100,msg:'Divide por los gramos <b>teóricos</b> del producto, no por el reactivo.'}]}],chain}}
  if(v==='a'){const p=Math.round(rnd(62,95)),ac=th*p/100;
    return{text:`Reacciona todo el ${A.name}. Con un rendimiento del ${p} %, ¿cuántos gramos de ${P.name} se obtienen?`,vp:VP(Q(fmt(mA),'g',A),`<span class="q t-pct"><b>${p}</b> %</span>`,AR,ASK('g',P,'g reales')),rx,ctx:rx.ctx,els:[A.f,P.f],
      steps:[stepM(A),stepN(A,mA),ratioStep(A,P,nA),{...thStep},{q:`Gramos reales de ${P.h}`,type:'num',ans:ac,unit:'g',key:true,hint:'real = teórico × rendimiento ÷ 100',ex:`${fmt(th)} × ${p}/100 = <b>${fmt(ac)} g</b>`,
        traps:[{v:th/(p/100),msg:'Dividiste. Con pérdidas se obtiene <b>menos</b> que el teórico: multiplica.'},{v:th,msg:'Ese es el teórico. Aplica el rendimiento.'}]}],chain}}
  const p=Math.round(rnd(65,92)),want=roundSF(th*rnd(0.6,1.4),3),thNeed=want/(p/100),nPn=thNeed/P.M,nAn=nPn*A.c/P.c,mAn=nAn*A.M;
  return{text:`Quieres obtener ${fmt(want)} g de ${P.name} con un rendimiento del ${p} %. ¿Cuánto ${A.name} usas?`,vp:VP(ASK('g',A),AR,Q(fmt(want),'g',P,'g reales'),`<span class="q t-pct"><b>${p}</b> %</span>`),rx,ctx:rx.ctx,els:[A.f,P.f],
    steps:[{q:`Gramos teóricos de ${P.h}`,type:'num',ans:thNeed,unit:'g',hint:'Como se pierde parte, apunta más alto: real ÷ (rendimiento/100).',ex:`${fmt(want)} ÷ ${dec(p/100)} = <b>${fmt(thNeed)} g</b>`,traps:[{v:want*p/100,msg:'Si se pierde producto, necesitas producir <b>más</b>: divide.'}]},
      stepM(P),{q:`Moles de ${P.h}`,type:'num',ans:nPn,unit:'mol',hint:'÷ masa molar',ex:`${fmt(thNeed)} ÷ ${fmM(P.M)} = <b>${fmt(nPn)} mol</b>`},
      ratioStep(P,A,nPn),stepM(A),{q:`Gramos de ${A.h}`,type:'num',ans:mAn,unit:'g',key:true,hint:'mol producto → mol reactivo → g reactivo',ex:`${fmt(nAn)} mol × ${fmM(A.M)} = <b>${fmt(mAn)} g</b>`,
        traps:[{v:mAn*(p/100)*(p/100),msg:'Aplicaste el rendimiento al revés: con pérdidas necesitas <b>más</b> reactivo.'},{v:mAn*p/100,msg:'Faltó el rendimiento: con pérdidas necesitas más reactivo.'}]}]};
}

function parseNum(s){
  if(s==null)return null;
  s=String(s).trim().replace(/\s+/g,'').replace(/,/g,'.').replace(/[−–]/g,'-').replace(/%$/,'');
  s=s.replace(/[×xX*·]10\^?\(?([+-]?\d+)\)?$/,'e$1').replace(/^10\^\(?([+-]?\d+)\)?$/,'1e$1');
  if(!/^[+-]?(\d+\.?\d*|\.\d+)(e[+-]?\d+)?$/i.test(s))return null;
  return parseFloat(s);
}
function checkStep(step,raw){
  if(step.type==='num'){
    const v=parseNum(raw);
    if(v===null)return{invalid:true,msg:'Escribe un número. Para potencias usa el botón × 10ⁿ (ej.: 3,01×10^23).'};
    const a=step.ans,tol=step.tol??0.01;const rel=Math.abs(v-a)/Math.abs(a);
    if(rel<=tol+1e-9)return{ok:true};
    for(const t of step.traps||[]){if(!t.v||!isFinite(t.v))continue;if(Math.abs(t.v-a)/Math.abs(a)<0.02)continue;if(Math.abs(v-t.v)/Math.abs(t.v)<=0.012)return{ok:false,msg:t.msg,trap:true}}
    if(tol>=0.005&&rel<=0.04)return{ok:false,near:true,msg:'¡Casi! Revisa los redondeos: usa las masas de los datos y no redondees a mitad de camino.'};
    const l=Math.log10(Math.abs(v/a));const L=Math.round(l);
    if(v>0&&L!==0&&Math.abs(l-L)<0.012)return{ok:false,msg:`Los dígitos están bien, pero corridos ×10<sup>${L}</sup>. Revisa la coma o la potencia.`};
    return{ok:false};
  }
  if(step.type==='choice'){const i=+raw;if(i===step.ans)return{ok:true};return{ok:false,msg:step.wrong||null}}
  if(step.type==='coef'){
    const co=raw;const inv=inventory(step.rx,co);const bad=orderEls(Object.keys(inv)).filter(e=>inv[e].L!==inv[e].R);
    if(bad.length)return{ok:false,msg:`Todavía no: ${bad.map(e=>`${e} (${inv[e].L} y ${inv[e].R})`).join(', ')}.`};
    const g=co.reduce((a,b)=>gcd(a,b));if(g>1)return{ok:false,near:true,msg:`¡Balanceada! Pero todos se pueden dividir por ${g}. Usa los números más chicos.`};
    return{ok:true};
  }
  return{ok:false};
}
function fmtAns(step){
  if(step.type==='num'){if(step.unit==='g/mol')return `${fmM(step.ans)} g/mol`;if(Number.isInteger(step.ans)&&step.tol<0.001)return `${step.ans} ${step.unit||''}`;return `${fmt(step.ans)} ${step.unit||''}`}
  if(step.type==='choice')return step.opts[step.ans];
  if(step.type==='coef')return eqHTML(step.rx);
  return '';
}

function solveBalance(rx,maxIn){
  const els=Object.keys(inventory(rx,rx.all.map(()=>1)));const comp=rx.all.map(s=>parseFormula(s.f));const n=rx.all.length;
  if(n>6)return null;const max=maxIn||(n<=4?30:n===5?16:12);const co=new Array(n).fill(1);let best=null,bestSum=1e9;

  const e=bad[0];const{L,R}=inv[e];

let G=null;
function makeSession(prob,mode){
  const steps=mode==='guided'?prob.steps:prob.steps.filter(s=>s.key);
  return{prob,mode,steps,ps:steps.map(s=>({st:'open',tries:0,raw:'',fb:null,hl:0,co:s.type==='coef'?s.rx.all.map(()=>1):null,t0:Date.now()})),cur:0,errors:0,usedSteps:false};
}
function startNode(id){
  if(!unlocked(id))return;closeChooser();
  const fin=id.startsWith('B-');const uid=fin?null:id.split('-')[0],lp=fin?'0':id.split('-')[1];
  const base={i:0,res:[],combo:0,maxCombo:0,xp:0,S:null,phase:'play',showSol:false,exitArm:false,used:new Set(),newSubs:[],newRxs:[],newBadges:[]};
  if(lp==='p'){
    let l=(P.plv&&P.plv[uid])||1;if(!unlocked(`${uid}-${l}`))l=1;
    G=Object.assign(base,{id,practice:true,uid,l,plan:[]});
  } else {
    const l=+lp;const n=fin?10:7;let plan=[];
    if(fin){const us=unitsOf(id.slice(2));for(let k=0;k<n;k++)plan.push({u:us[k%us.length].id,l:k<n/2?2:3,c:false});plan=shuffle(plan)}
    else{for(let k=0;k<n;k++)plan.push({u:uid,l,c:false});if(l<3)plan[ri(1,n-1)].c=true}
    G=Object.assign(base,{id,final:fin,bid:fin?id.slice(2):null,uid,l,plan});
  }
  document.body.classList.add('playing');showView('play');window.scrollTo({top:0});nextProblem();
}
function openLesson(uid,then){
  closeChooser();
  G={id:null,lessonOnly:true,phase:'lesson',lessonUid:uid,lc:0,then:then||null,plan:[],res:[]};
  document.body.classList.add('playing');showView('play');window.scrollTo({top:0});renderPlay();
}
function openChooser(id){
  if(!unlocked(id))return;
  if(id.startsWith('B-')){startNode(id);return}
  const [uid,l]=id.split('-');
  if(!P.seen[uid]){openLesson(uid,id);return}   /* la primera vez, el tutorial aparece solo */
  const prac=l==='p';const c=document.getElementById('chooser');const mx=prac?3:maxOf(id);
  c.innerHTML=`<div class="panel" role="dialog" aria-modal="true" aria-labelledby="chT"><div class="eyebrow">Unidad ${UK[uid].n} · ${UK[uid].name}</div><h3 id="chT">${prac?'Práctica libre':LVLN[l]}${isChal(id)?` <span class="hflame">${FLAME}</span>`:''}</h3>
    ${prac?'<p class="sub">Ejercicios sin fin y sin estrellas en juego. Practica a tu ritmo.</p>':`<span class="tst" style="gap:4px">${stars(st(id),mx)}</span><p class="sub">7 ejercicios. ${isChal(id)?'Hasta 4 estrellas: la cuarta, con una ronda sin errores.':'Gana estrellas para avanzar.'} Cada error resta media estrella.</p>`}
    <button type="button" class="btn primary big" data-start="${id}">${prac?'Practicar':'Jugar'}</button>
    <button type="button" class="btn big" data-tut="${uid}" data-then="${id}">Tutorial</button>
    <button type="button" class="btn link" data-close="1" style="align-self:center">Cancelar</button></div>`;
  c.hidden=false;c.classList.add('show');sfx.click();setTimeout(()=>{const b=c.querySelector('[data-start]');b&&b.focus({preventScroll:true})},30);
}
function closeChooser(){const c=document.getElementById('chooser');if(c){c.hidden=true;c.classList.remove('show');c.innerHTML=''}}
function nextProblem(){
  const pl=G.practice?{u:G.uid,l:G.l,c:Math.random()<0.15}:G.plan[G.i];let prob;
  for(let k=0;k<6;k++){try{prob=pl.c?genConcept(pl.u,G.used):UK[pl.u].gen(pl.l);break}catch(e){console.error(e)}}
  prob.unit=pl.u;prob.lvl=pl.l;
  const mode=(!G.final&&pl.l===1&&!prob.concept)?'guided':'direct';
  G.S=makeSession(prob,mode);G.phase='play';G.showSol=false;G.exitArm=false;
  if(G.i===0&&!G.practice&&G.id&&isChal(G.id))setTimeout(flare,700);
  renderPlay(true);window.scrollTo({top:0});
}

/* lo que entra al álbum: las sustancias y la reacción de cada ejercicio bien resuelto */
function collect(p){
  if(p.concept)return;
  const before=BADGES.filter(badgeDone).map(b=>b.id);
  const fs=new Set();(p.els||[]).forEach(f=>fs.add(f));if(p.rx)p.rx.all.forEach(x=>fs.add(x.f));
  fs.forEach(f=>{if(NAMES[f]&&!P.subs[f]){P.subs[f]=1;G.newSubs.push(f)}});
  if(p.rx&&RXK[p.rx.key]&&!P.rxs[p.rx.key]){P.rxs[p.rx.key]=1;G.newRxs.push(p.rx.key)}
  BADGES.filter(b=>badgeDone(b)&&!before.includes(b.id)).forEach(b=>G.newBadges.push(b.n));
}
function exerciseDone(){
  const S=G.S;const rev=S.ps.some(p=>p.st==='rev');const e=S.errors;
  const sc=rev?0:(e===0&&!S.usedSteps)?1:e<=1?0.75:0.5;
  if(sc===1)G.combo++;else G.combo=0;G.maxCombo=Math.max(G.maxCombo,G.combo);
  const xp=Math.round(10*sc)+(G.combo>=3?5:0);G.xp+=xp;G.res.push(sc);G.lastXp=xp;G.lastSc=sc;G.phase='done';G.showSol=sc===0;
  statEx(sc,S.errors);
  if(sc>0)collect(S.prob);
  if(G.practice)P.xp+=xp;
  save();
  if(sc>0)sfx.ok(G.combo);else sfx.bad();
  if(sc>0&&G.combo>=3&&!G.practice&&G.id&&isChal(G.id))flare();
  renderPlay();
  setTimeout(()=>{const b=document.querySelector('.sheet .btn.primary');b&&b.focus({preventScroll:true})},50);
}
/* Estrellas de una ronda: se empieza con todas y cada error resta media; ver la respuesta resta otra media.
   Quien lo intenta con ganas se lleva al menos 1. Quien toca cualquier cosa (3 o más errores en menos de 2 s) puede quedar en 0. */
const ERR_RESTA=0.5,RAPIDOS_MAX=3;
function roundStars(mx,err,rev,fast){
  const s=Math.max(0,mx-ERR_RESTA*(err+rev));
  return fast<RAPIDOS_MAX?Math.max(1,s):s;
}
function finishRound(){
  const mx=maxOf(G.id);G.maxS=mx;
  const s=roundStars(mx,G.errN||0,G.revN||0,G.fastN||0);G.stars=s;
  const prevRank=rankOf(totalStars()),prevStars=st(G.id);
  const before={};NODES().forEach(x=>before[x]=unlocked(x));const ub=Object.fromEntries(UNITS.map(u=>[u.id,unitOpen(u.id)]));
  P.stars[G.id]=Math.max(prevStars,s);
  G.msgs=[];G.toGo=null;

function playSubmit(i,raw){

}

/* ================== ÁLBUM · sustancias y reacciones ================== */
const METALS=['Li','Na','K','Mg','Ca','Ba','Al','Zn','Fe','Cu','Ag','Pb','Mn','Cr','Ni','Co','Sn','Ti'];
const KIND={el:'Elemento',ox:'Óxido',ac:'Ácido',hi:'Hidróxido',sa:'Sal',or:'Orgánico',mo:'Molecular'};
function kindOf(f){
  const c=parseFormula(f.replace('·5H2O',''));const els=Object.keys(c);
  if(els.length===1)return 'el';
  if(els.includes('C')&&els.includes('H')&&els.every(e=>'CHO'.includes(e)))return 'or';
  if(f.includes('(OH)')||/OH$/.test(f))return 'hi';
  if(f[0]==='H'&&f!=='H2O'&&f!=='H2O2'&&!els.includes('C')&&!els.includes('N')||f==='HNO3')return 'ac';
  if(els.length===2&&els.includes('O')&&f!=='H2O'&&f!=='H2O2')return 'ox';
  if(els.some(e=>METALS.includes(e))||f.includes('NH4'))return 'sa';
  return 'mo';
}

function reveal(items,done){

    else if(it.type==='rank'){prize=chemAv(it.i,'xl');kick=`¡Subiste al nivel ${it.i+1}!`;title=CHEM[it.i].n;sub=CHEM[it.i].d}
    else{prize=`<span class="rv-badge">${IC.trophy}</span>`;kick='¡Insignia nueva!';title=esc(it.n);sub='Completaste esta colección en tu álbum'}

function parseCustom(str){
  const t=str.replace(/→|=>|=/g,'->').split('->');if(t.length!==2)throw new Error('Separa reactivos y productos con -> o =.');
  const side=(x,sd)=>x.split('+').map(y=>y.trim()).filter(Boolean).map(y=>{const f=y.replace(/^\d+\s*/,'').replace(/\((g|l|s|aq)\)$/,'');parseFormula(f);return{c:1,f,st:'',side:sd,M:mm(f),name:f,h:fh(f)}});
  const reac=side(t[0],'r'),prod=side(t[1],'p');if(!reac.length||!prod.length)throw new Error('Faltan sustancias de un lado.');
  if(reac.length+prod.length>6)throw new Error('Máximo 6 sustancias.');
  const rx={key:'custom',ctx:'',reac,prod,all:reac.concat(prod)};
  const inv=inventory(rx,rx.all.map(()=>1));for(const e in inv)if(!inv[e].L||!inv[e].R)throw new Error(`El ${e} aparece de un solo lado: no se puede balancear.`);
  const sol=solveBalance(rx);if(!sol)throw new Error('No encontré coeficientes pequeños que la balanceen. Revisa las fórmulas.');

/* ================== CALCULADORA ================== */
const CALC={expr:'',res:null,just:false,lastIn:null};
function calcEval(src){
  let i=0;const t=src;
  const peek=()=>t[i];
  function num(){let a='';while(/[0-9,]/.test(t[i]||''))a+=t[i++];if(!a||a===',')throw 0;let v=parseFloat(a.replace(',','.'));
    if(t[i]==='E'){i++;let sg=1;if(t[i]==='−'){sg=-1;i++}else if(t[i]==='+')i++;let e='';while(/[0-9]/.test(t[i]||''))e+=t[i++];if(!e)throw 0;v*=Math.pow(10,sg*+e)}return v}
  function fac(){if(peek()==='−'){i++;return -fac()}if(peek()==='+'){i++;return fac()}if(peek()==='('){i++;const v=ex();if(peek()===')')i++;return v}return num()}
  function term(){let v=fac();while(peek()==='×'||peek()==='÷'){const o=t[i++];const w=fac();v=o==='×'?v*w:v/w}return v}
  function ex(){let v=term();while(peek()==='+'||peek()==='−'){const o=t[i++];const w=term();v=o==='+'?v+w:v-w}return v}
  const v=ex();if(i<t.length)throw 0;if(!isFinite(v))throw 1;return v;
}
function calcFmt(v){
  if(v===0)return '0';const a=Math.abs(v);
  if(a>=1e7||a<1e-4){let [m,e]=v.toExponential(5).split('e');m=m.replace(/\.?0+$/,'');return dec(m)+'×10^'+(+e)}
  return dec(String(parseFloat(v.toPrecision(10))));
}
const calcShow=x=>esc(x).replace(/E/g,'×10^');
function calcRender(){
  const e=document.getElementById('cExpr'),r=document.getElementById('cRes');if(!e)return;
  if(CALC.just){e.innerHTML=calcShow(CALC.expr)+' =';r.className='cres';r.innerHTML=CALC.res===null?'—':calcFmt(CALC.res).replace(/\^(-?\d+)/,'<sup>$1</sup>')}
  else{e.innerHTML=CALC.res!==null&&CALC.prev?'Ans = '+calcFmt(CALC.res):'';r.className='cres';r.innerHTML=CALC.expr?calcShow(CALC.expr):'0'}
}
function calcKey(k){
  if(k==='C'){CALC.expr='';CALC.just=false;CALC.prev=false}
  else if(k==='B'){if(CALC.just){CALC.just=false;CALC.expr=''}else CALC.expr=CALC.expr.slice(0,-1)}
  else if(k==='='){if(!CALC.expr)return;try{CALC.res=calcEval(CALC.expr);CALC.just=true;sfx.click()}catch(err){const r=document.getElementById('cRes');r.className='cres err';r.textContent=err===1?'No se puede dividir por cero':'Revisa la expresión';return}}
  else if(k==='U'){calcUse();return}
  else{
    if(CALC.just){CALC.just=false;CALC.prev=true;if('+−×÷'.includes(k))CALC.expr=calcFmt(CALC.res).replace('×10^','E');else CALC.expr=''}
    CALC.expr+=k;
  }
  calcRender();
}
function calcUse(){
  let v=CALC.just?CALC.res:null;if(v===null){try{v=calcEval(CALC.expr)}catch(e){v=null}}
  const inp=CALC.lastIn&&document.body.contains(CALC.lastIn)?CALC.lastIn:document.querySelector('#v-play .step.s-open input');

  inp.value=calcFmt(v);inp.dispatchEvent(new Event('input',{bubbles:true}));sfx.step();toggleCalc(false);inp.focus({preventScroll:true});

/* ================== TECLADO-CALCULADORA ==================

   en lugar del teclado del celular. Se puede escribir el número o una cuenta (12,5×3):

const KP={on:typeof window!=='undefined'&&!!window.matchMedia&&window.matchMedia('(pointer: coarse)').matches,inp:null,el:null};
const KP_KEYS=[['7','8','9','÷','B'],['4','5','6','×','('],['1','2','3','−',')'],['0',',','P','+','OK']];
function kpBuild(){
  if(KP.el)return;

    <div class="kpkeys">${KP_KEYS.flat().map(k=>`<button type="button" class="kk${'÷×−+()'.includes(k)?' op':''}${k==='OK'?' ok':''}${k==='B'?' op':''}" data-kp="${k}"${k==='B'?' aria-label="Borrar"':k==='P'?' aria-label="por diez a la"':''}>${k==='B'?'⌫':k==='P'?'×10ⁿ':k==='OK'?'Comprobar':k}</button>`).join('')}</div>`;
  document.body.appendChild(d);KP.el=d;

    b.classList.remove('pr');void b.offsetWidth;b.classList.add('pr');setTimeout(()=>b.classList.remove('pr'),180);buzz(b.dataset.kp==='OK'?18:9)});

const kpHasOps=v=>/[+×÷()]/.test(v.replace(/×10\^/g,''))||/.−/.test(v.replace(/×10\^−/g,''));

    d.innerHTML=`<div class="lgpanel"><div class="lghead"><div><span class="lgk">Tutorial de la unidad ${UK[uid].n}</span><h2 id="lgsT">${esc(UK[uid].name)}</h2></div><button type="button" class="exitbtn" data-lg="x" aria-label="Cerrar el tutorial">${IC.x}Cerrar</button></div>
      ${cards.length>1?`<div class="ldots" style="justify-content:center">${cards.map((_,k)=>`<i class="${k===i?'on':''}"></i>`).join('')}</div>`:''}
      <article class="lgcard"><div class="lvis">${c.v}</div><h3>${c.t}</h3><p>${c.p}</p></article>
      <div class="lgbtns">${i?'<button type="button" class="btn" data-lg="prev">Atrás</button>':''}<button type="button" class="btn primary big" data-lg="next">${last?'Seguir jugando':'Siguiente'}</button></div></div>`;
    const b=d.querySelector('[data-lg="next"]');b&&b.focus({preventScroll:true});d.querySelector('.lgpanel').scrollTop=0};
  d.addEventListener('click',e=>{if(e.target===d){close();return}const b=e.target.closest('[data-lg]');if(!b)return;sfx.click();const a=b.dataset.lg;
    if(a==='x')close();else if(a==='prev'){i=Math.max(0,i-1);show()}else if(i<cards.length-1){i++;show()}else close()});
  show();
}

/* =====================================================================
   SIN INTERNET (versión 3.0)
   El juego no se conecta a ningún servidor: el progreso queda solo en este dispositivo (en este navegador).
   La primera vez se abre desde GitHub y queda guardado para usarse sin conexión (sw.js).
   ===================================================================== */
/* --- historial de rondas: [minuto, nivel, medias estrellas, errores, errores rápidos, XP total, sesión, origen]
   origen: c = con código y conexión · o = con código pero sin conexión · g = sin código --- */
function sanLog(a){
  if(!Array.isArray(a))return [];
  const ni=(v,m)=>Number.isInteger(v)&&v>=0&&v<=m,out=[];
  for(const x of a){if(!Array.isArray(x)||x.length<8)continue;const [t,n,s2,e,f,xp,ses,src]=x;
    if(ni(t,1e8)&&typeof n==='string'&&/^[A-Za-z0-9_-]{1,24}$/.test(n)&&ni(s2,8)&&ni(e,9999)&&ni(f,9999)&&ni(xp,1e7)&&ni(ses,1e6)&&(src==='c'||src==='o'||src==='g'))out.push([t,n,s2,e,f,xp,ses,src])}
  out.sort((a,b)=>a[0]-b[0]);return out.slice(-LOG_MAX);
}
function mergeLog(a,b){const m=new Map();for(const x of sanLog(a).concat(sanLog(b))){const k=x.slice(0,6).join('|');if(!m.has(k))m.set(k,x)}return sanLog([...m.values()])}

/* --- lo que llega de la nube no es confiable: se reconstruye campo por campo --- */
function sanP(o){
  const r=P0();if(!o||typeof o!=='object')return r;
  const int=(v,max)=>Number.isInteger(v)&&v>=0&&v<=max?v:0;
  const own=(o,k)=>Object.prototype.hasOwnProperty.call(o,k);
  const kOk=k=>/^[A-Za-z0-9_-]{1,24}$/.test(k);
  r.xp=int(o.xp,1e7);r.plays=int(o.plays,1e6);
  if(o.stars&&typeof o.stars==='object')for(const k in o.stars)if(kOk(k)){const v=o.stars[k];if(Number.isFinite(v)&&v>0&&v<=4&&Number.isInteger(v*2))r.stars[k]=v}
  if(o.plv&&typeof o.plv==='object')for(const k in o.plv)if(own(UK,k)){const v=int(o.plv[k],3);if(v)r.plv[k]=v}
  if(o.seen&&typeof o.seen==='object')for(const k in o.seen)if(own(UK,k)&&o.seen[k])r.seen[k]=1;
  if(o.subs&&typeof o.subs==='object')for(const k in o.subs)if(own(NAMES,k)&&o.subs[k])r.subs[k]=1;
  if(o.rxs&&typeof o.rxs==='object')for(const k in o.rxs)if(own(RXK,k)&&o.rxs[k])r.rxs[k]=1;
  if(o.missions&&typeof o.missions==='object')for(const k in o.missions)if(MISSIONS.some(m=>m.id===k)&&o.missions[k])r.missions[k]=1;
  r.labBest=int(o.labBest,1e5);
  if(typeof o.last==='string'&&kOk(o.last))r.last=o.last;
  /* estadísticas: tiempo de juego, sesiones y, por nivel, tiempo, ejercicios, aciertos y fallos */
  r.time=int(o.time,1e8);r.ses=int(o.ses,1e6);r.lastAct=int(o.lastAct,1e14);r.ns={};
  if(o.ns&&typeof o.ns==='object')for(const k in o.ns)if(kOk(k)&&o.ns[k]&&typeof o.ns[k]==='object'){const x=o.ns[k];r.ns[k]={t:int(x.t,1e8),n:int(x.n,1e6),ok:int(x.ok,1e6),mid:int(x.mid,1e6),f:int(x.f,1e6),e:int(x.e,1e7)}}
  r.log=sanLog(o.log);
  return r;
}
/* --- combinar dos progresos: el avance nunca se pierde --- */
function mergeP(a,b){
  const r=sanP(a);const c=sanP(b);
  r.xp=Math.max(r.xp,c.xp);r.plays=Math.max(r.plays,c.plays);
  for(const k in c.stars)r.stars[k]=Math.max(r.stars[k]||0,c.stars[k]);
  for(const f of ['seen','subs','rxs','missions'])Object.assign(r[f],c[f]);
  for(const k in c.plv)if(!r.plv[k])r.plv[k]=c.plv[k];
  r.labBest=Math.max(r.labBest||0,c.labBest||0);
  if(!r.last&&c.last)r.last=c.last;
  r.log=mergeLog(r.log,c.log);
  r.time=Math.max(r.time||0,c.time||0);r.ses=Math.max(r.ses||0,c.ses||0);r.lastAct=Math.max(r.lastAct||0,c.lastAct||0);
  for(const k in c.ns){const a=r.ns[k]||{t:0,n:0,ok:0,mid:0,f:0,e:0},b=c.ns[k];r.ns[k]={t:Math.max(a.t,b.t),n:Math.max(a.n,b.n),ok:Math.max(a.ok,b.ok),mid:Math.max(a.mid,b.mid),f:Math.max(a.f,b.f),e:Math.max(a.e,b.e)}}
  return r;
}



/* --- sin rastros: se borra todo lo que quedó de las versiones con código (el código, el grupo, el juego en vivo,
   fechas y estadísticas). El progreso del código (estrellas, XP, niveles…) pasa a este dispositivo, sin el código. --- */
const SIN_RASTRO=['log','time','ses','lastAct','ns'];
function limpiarRastros(){
  try{
    const ses=localStorage.getItem('atomoaatomo.sesion'),code=/^[A-HJKMNP-Z2-9]{5}$/.test(ses||'')?ses:null;
    for(const [pre,pend] of [['atomoaatomo.v1.c.','atomoaatomo.v1.pendiente'],['molamol.v2.c.','molamol.v2.pendiente']]){
      const keys=Object.keys(localStorage).filter(k=>k.startsWith(pre)),solo=keys.filter(k=>/^[A-HJKMNP-Z2-9]{5}$/.test(k.slice(pre.length)));
      const elegido=code&&solo.includes(pre+code)?pre+code:(solo.length===1?solo[0]:null);
      if(elegido&&!localStorage.getItem(pend)){try{const d=JSON.parse(localStorage.getItem(elegido));if(d&&typeof d==='object'){for(const k of SIN_RASTRO)delete d[k];localStorage.setItem(pend,JSON.stringify(d))}}catch(e){}}
      keys.forEach(k=>localStorage.removeItem(k));
    }
    for(const k of Object.keys(localStorage))if(k.startsWith('vivo.')||['atomoaatomo.sesion','atomoaatomo.v1.no','molamol.v2.no','atomoaatomo.v3','molamol.v3'].includes(k))localStorage.removeItem(k);
    try{sessionStorage.removeItem('ver.intento')}catch(e){}
  }catch(e){}
}
function tomarPendiente(){
  try{const t=localStorage.getItem('molamol.v2.pendiente');if(!t)return;const d=JSON.parse(t);
    if(d&&typeof d==='object'){let base=null;try{base=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){base=null}
      const r=mergeP(d,base);r.mute=!!((base&&base.mute)||d.mute);r.unlockAll=true;P=Object.assign(P0(),r)}
    localStorage.removeItem('molamol.v2.pendiente')}catch(e){}
}
/* lo que se guarda: solo lo que el juego necesita (sin historial, fechas ni estadísticas) */
save=function(){try{const x=Object.assign({},P);for(const k of SIN_RASTRO)delete x[k];localStorage.setItem(KEY,JSON.stringify(x))}catch(e){}};
/* el progreso guardado en el navegador se revisa campo por campo al empezar */
function revisarLocal(){try{const keep={mute:!!P.mute,unlockAll:true};P=Object.assign(P0(),sanP(P),keep)}catch(e){}}

/* --- funcionar sin conexión: una copia del juego queda guardada en el dispositivo (sw.js) --- */
const SW={reg:null,nueva:false};
function swRegistrar(){
  if(typeof navigator==='undefined'||!('serviceWorker' in navigator)||(location.protocol!=='https:'&&location.hostname!=='localhost'))return;
  navigator.serviceWorker.register('sw.js').then(reg=>{SW.reg=reg}).catch(()=>{});
  /* cuando llega una versión nueva, se usa al volver al mapa (nunca en medio de un nivel) */
  let ya=false;navigator.serviceWorker.addEventListener('controllerchange',()=>{if(ya)return;ya=true;SW.nueva=true;verAplicar()});
  try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
}
function verAplicar(){
  if(!SW.nueva||G)return;
  if(document.querySelector('.reveal'))return;
  SW.nueva=false;localSave();location.reload();
}
function localSave(){save()}
if(typeof window!=='undefined'){const exitPlay0=exitPlay;exitPlay=function(){exitPlay0();verAplicar()}}

renderMap=function(){renderMap0();const v=document.getElementById('v-map');if(v&&!document.getElementById('avisoCrea'))v.insertAdjacentHTML('afterbegin','<div id="avisoCrea" role="note" style="background:var(--surface);border:2px solid var(--ink);border-radius:16px;padding:12px 14px;margin:0 0 14px;font-size:15px;line-height:1.4"><b>Aviso:</b> este juego se va a mudar a <b>CREA</b>. Pronto lo vas a encontrar ahí.</div>')};

function arranque(){limpiarRastros();tomarPendiente();revisarLocal();for(const k of SIN_RASTRO)delete P[k];save();init();swRegistrar()}

if(typeof document!=='undefined'&&document.getElementById('v-map'))arranque();
